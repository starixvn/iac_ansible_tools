- name: Create DB folder
  file:
    path: "{{ gluster_path }}/{{ item }}"
    state: directory
    mode: "0777"
  become: yes
  with_items:
    - redis_socket
    - memcached_socket
    - pgdata
    - projects
    - .ssh

- name: Create network
  docker_network:
    name: '{{swarm_network_nexops}}'
    driver: 'overlay'
    attachable: true
  ignore_errors: yes
  become: yes

- name: Copy docker-compose file
  when: inventory_hostname in groups['swarm_managers']
  template:
    src: 'templates/{{ item }}.j2'
    dest: '{{gluster_path}}/{{ item }}'
  become: yes
  with_items:
    - docker-compose.yml
    - redis.conf

- name: Copy configuration files
  when: inventory_hostname in groups['swarm_managers']
  template:
    src: 'templates/{{ item }}'
    dest: '{{gluster_path}}/{{ item }}'
  become: yes
  ignore_errors: yes
  with_items:
    - SECRET_KEY
    #- .netrc
    #- environment.sh
    #- krb5.conf
    - nginx.conf

- name: Copy configuration env - {{env}} files
  when: inventory_hostname in groups['swarm_managers']
  template:
    src: 'templates/env/{{ item }}_{{env}}'
    dest: '{{gluster_path}}/{{ item }}'
  become: yes
  ignore_errors: yes
  with_items:
    - credentials.py
    - krb5.conf
    - environment.sh

- name: Copy SSH files
  when: inventory_hostname in groups['swarm_managers']
  template:
    src: 'templates/.ssh/{{ item }}'
    dest: '{{gluster_path}}/.ssh/{{ item }}'
  become: yes
  ignore_errors: yes
  with_items:
    - id_rsa.pub
    - id_rsa
    - id_ed25519
    - id_ed25519.pub
    - known_hosts

- name: Build up and run container
  when: inventory_hostname in groups['swarm_managers']
  shell: |
    cd {{gluster_path}}
    docker stack deploy --compose-file=docker-compose.yml awx --with-registry-auth
  become: yes
