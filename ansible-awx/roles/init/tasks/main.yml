- name: Create DB folder
  file:
    path: "{{ gluster_path }}/{{ item }}"
    state: directory
    mode: "0777"
  become: yes
  with_items:
    - redis_socket
    - memcached_socket
    - pgdata
    - projects

- name: Create network
  docker_network:
    name: '{{swarm_network_nexops}}'
    driver: 'overlay'
    attachable: true
  ignore_errors: yes
  become: yes

- name: Copy docker-compose file
  when: inventory_hostname in groups['swarm_managers']
  template:
    src: 'templates/{{ item }}.j2'
    dest: '{{gluster_path}}/{{ item }}'
  become: yes
  with_items:
    - docker-compose.yml
    - redis.conf

- name: Copy configuration files
  when: inventory_hostname in groups['swarm_managers']
  template:
    src: 'templates/{{ item }}'
    dest: '{{gluster_path}}/{{ item }}'
  become: yes
  with_items:
    - SECRET_KEY
    - .netrc
    - .ssh
    - credentials.py
    - environment.sh
    - krb5.conf
    - nginx.conf

- name: Build up and run container
  when: inventory_hostname in groups['swarm_managers']
  shell: |
    cd {{gluster_path}}
    docker stack deploy --compose-file=docker-compose.yml awx --with-registry-auth
  become: yes
