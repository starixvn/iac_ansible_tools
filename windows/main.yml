---
- hosts: all
  roles:
    - role: iis-binding
  tags:
    - iis-binding

- hosts: all
  roles:
    - role: iis-sites
  tags:
    - iis-sites

- hosts: all
  roles:
    - role: iis-subsites
  tags:
    - iis-subsites

- hosts: all
  roles:
    - role: install-iis
  tags:
    - install-iis

- hosts: all
  roles:
    - role: install-aspstate
  tags:
    - install-aspstate

- hosts: all
  roles:
    - role: install-netcore
  tags:
    - install-netcore

- hosts: all
  roles:
    - role: ConfigureRemotingForAnsible
  tags:
    - ConfigureRemotingForAnsible

- hosts: all
  roles:
    - role: ws_app
  tags:
    - ws_app

- hosts: all
  roles:
    - role: msmq
  tags:
    - ws_msmq

- hosts: all
  roles:
    - role: add_gzip
  tags:
    - add_gzip

- hosts: all
  roles:
    - role: install-docker
  become: yes
  become_method: runas
  vars:
    ansible_become_user: '{{ user }}'
    ansible_become_pass: '{{ password }}'
  tags:
    - install-docker

- hosts: gitlab-runner
  roles:
    - role: install-gitlab-runner
  become: yes
  become_method: runas
  vars:
    ansible_become_user: '{{ user }}'
    ansible_become_pass: '{{ password }}'
    workingDirectory: 'D:\GitLab-Runner'
    id_list: [1,2,3,4,5]
  tags:
    - install-gitlab-runner

- hosts: all
  roles:
    - role: docker-prune
  tags:
    - docker-prune

- hosts: all
  roles:
    - role: docker-prune-runner
  tags:
    - docker-prune-runner