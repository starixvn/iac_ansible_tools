---
- name: install NuGet Provider
  win_shell:
    script: |
      Install-PackageProvider -Name NuGet -RequiredVersion 2.8.5.201 -Force

- name: install the Docker-Microsoft PackageManagement Provider
  win_psmodule:
    name: DockerMsftProvider
    repository: PSGallery
    state: present

- name: install the latest version of Docker
  win_shell:
    script: |
      Install-Package -Name docker -ProviderName DockerMsftProvider

- name: install docker-compose
  win_shell:
    script: >
      Invoke-WebRequest "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-Windows-x86_64.exe"
         -UseBasicParsing -OutFile $Env:ProgramFiles\Docker\docker-compose.exe

- name: restart server
  win_shell:
    script: |
      Restart-Computer -Force