---
- name: install NuGet Provider
  win_shell: |
    if((Get-PackageProvider | Where{$_.Name -eq "NuGet"}) -eq $null){
      Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Force
    }
    else {
        Write-Host "Version of NuGet installed = " (Get-PackageProvider -Name NuGet).version
    }

- name: install the Docker-Microsoft PackageManagement Provider
  win_psmodule:
    name: DockerMsftProvider
    repository: PSGallery
    state: present

- name: install the latest version of Docker
  win_shell: |
    if((Get-Package | Where{$_.Name -eq "docker"}) -eq $null){
      Install-Package -Name docker -ProviderName DockerMsftProvider -Force
    }else{
        Write-Host "Version of docker = " (Get-Package -Name docker -ProviderName DockerMsftProvider).Version
    }

- name: install docker-compose
  win_shell: |
    if((Test-Path -Path $Env:ProgramFiles\Docker\docker-compose.exe) -eq $false){
      Invoke-WebRequest "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-Windows-x86_64.exe" -UseBasicParsing -OutFile $Env:ProgramFiles\Docker\docker-compose.exe -Force
    }else{
      Write-Host "Installed docker-compose already"
    }

- name: Ensure that docker is started when the system has settled
  win_service:
    name: docker
    start_mode: delayed

- name: restart server
  win_shell: Restart-Computer -Force