---
- name: Create "{{ workingDirectory }}" folder
  win_file:
    path: '{{ workingDirectory }}'
    state: directory

- name: Download gitlab-runner-windows-amd64.exe
  win_shell: |
    cd "{{workingDirectory}}";
    Invoke-WebRequest -Uri "https://gitlab-runner-downloads.s3.amazonaws.com/latest/binaries/gitlab-runner-windows-amd64.exe" -OutFile "gitlab-runner.exe"

- name: Delete config "{{ workingDirectory }}\config.toml" if exist
  win_file:
    path: '{{ workingDirectory }}\config.toml'
    state: absent

- name: Register gitlab-runner
  win_shell: |
    cd "{{workingDirectory}}";
    .\gitlab-runner.exe register `
        --non-interactive `
        --url https://gitlab.nexdev.net/ `
        --registration-token VscxAqFvRVcXgpyoBDD_ `
        --executor shell `
        --tag-list windows `
        --shell powershell `
        --description "windows-runner-{{item}}"
  with_items: '[1,2,3,4,5]'

- name: Install gitlab-runner
  win_shell: |
    cd "{{workingDirectory}}";
    .\gitlab-runner.exe install
  ignore_errors: yes

- name: Ensure that gitlab-runner is started when the system has settled
  win_service:
    name: gitlab-runner
    start_mode: delayed

- name: Start gitlab-runner
  win_shell: |
    cd "{{workingDirectory}}";
    .\gitlab-runner.exe start