- name: Configure Remoting for Ansible
  hosts: all
#gather_facts: true
  tasks:
    - name: Create working directory
      win_file:
        path: "{{script_location}}"
        state: "directory"

    - name: cp template files
      win_template:
        src: 'templates/{{ item }}.j2'
        dest: "{{script_location}}/{{ item }}"
      with_items: 
        - ConfigureRemotingForAnsible.ps1
        - execute_ConfigureRemotingForAnsible.ps1
        - newserver.txt

    - name: Run execute_ConfigureRemotingForAnsible.ps1 script
      win_shell: '{{script_location}}\execute_ConfigureRemotingForAnsible.ps1 >> {{script_location}}\execute_ConfigureRemotingForAnsible.log chdir={{script_location}}'
      register: result1
      become: yes
      become_method: runas
      become_user: "{{user_id}}"
      vars:
        ansible_become_password: "{{pass_id}}"

    - debug:
        msg: "{{ result1.stdout.split('\n')}}"
