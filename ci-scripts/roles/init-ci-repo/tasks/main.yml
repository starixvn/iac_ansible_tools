- name: Create CI repo {{repo_group_path}}/{{repo_name}}
  uri:
    url: https://{{gitlab_url | default("git3.nexdev.net")}}/api/v4/projects/
    headers:
      PRIVATE-TOKEN: '{{gitlab_token}}'
      Content-Type: 'application/json'
    body: '{"namespace_id": "{{repo_ci_group_id}}", "path": "{{repo_name}}",  "repository_access_level": "enabled", "visibility": "public"}'
    body_format: json
    method: POST
    status_code: 201
  register: result
  until:
  ignore_errors: yes

- name: Init commit
  uri:
    url: https://{{gitlab_url | default("git3.nexdev.net")}}/api/v4/projects/{{result.json.id}}/repository/commits
    headers:
      PRIVATE-TOKEN: '{{gitlab_token}}'
      Content-Type: 'application/json'
    body: '{"branch": "master", "commit_message": "initial commit", "actions": [{"action": "create", "file_path": "file", "content": "init"}]}'
    body_format: json
    method: POST
    status_code: 201
  ignore_errors: yes

- name: Create Built Image Repo {{item.0.docker_image_registry_path}}
  uri:
    url: https://{{registry_url}}/api/v4/projects/
    headers:
      PRIVATE-TOKEN: '{{registry_token}}'
      Content-Type: 'application/json'
    body: '{"namespace_id": "{{registry_group_id}}", "path": "{{ item.0.docker_image_registry_path | regex_replace('nexcel/') | urlencode }}",  "repository_access_level": "enabled", "visibility": "public"}'
    body_format: json
    method: POST
    status_code: 201
  register: result
  until:
  ignore_errors: yes
  when: team_name != "nex3" and team_name != "pentagon"
  with_items: '{{services}}'
