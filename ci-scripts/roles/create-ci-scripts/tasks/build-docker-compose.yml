- name: Delete .docker-compose directory for each service
  file:
    path: /var/ci-scripts/{{repo_name}}/.docker-compose/{{item.name | replace('-','_')}}
    state: absent    
  become: yes
  with_items: "{{services}}"

- name: Create .docker-compose directory for each service
  file:
    path: /var/ci-scripts/{{repo_name}}/.docker-compose/{{item.name | replace('-','_')}}
    state: directory
    mode: '0755'
  become: yes
  with_items: "{{services}}"

- name: Build docker-compose for {{env}}
  template:
    src: templates/docker-swarm/.docker-compose/docker-compose.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.docker-compose/{{item.name | replace('-','_')}}/{{env | upper}}.docker-compose.yml
  vars:
    env: local
    domain: "{{domain_local | default ('nodomain')}}"
  with_items: "{{services}}"
  become: yes

- name: Build docker-compose for {{env}}
  template:
    src: templates/docker-swarm/.docker-compose/docker-compose.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.docker-compose/{{item.name | replace('-','_')}}/{{env | upper}}.docker-compose.yml
  vars:
    env: nexprod
  with_items: "{{services}}"
  become: yes
  when: team_name != "nex3" and team_name != "pentagon"

