- name: Create .docker-compose directory for each service
  file:
    path: /var/ci-scripts/{{repo_name}}/.docker-compose/{{item.name}}
    state: directory
    mode: '0755'
  become: yes
  with_items: '{{services}}'

- name: Build docker-compose for {{env}}
  template:
    src: templates/docker-swarm/.docker-compose/docker-compose.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.docker-compose/{{item.0.name}}/{{env | upper}}{{ '' if item.1 == 0  else '_' }}{{ '' if item.1 == 0  else item.1 }}.docker-compose.yml
  vars:
    env: local
  with_subelements:
    - '{{ services }}'
    - versions
  become: yes

