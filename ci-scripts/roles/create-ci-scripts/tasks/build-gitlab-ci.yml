- name: Build gitlab-ci.yml
  template:
    src: templates/docker-swarm/gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/gitlab-ci.yml
  become: yes

- name: Build gitlab-ci-mixing.yml
  template:
    src: templates/docker-swarm/gitlab-ci-mixing.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/gitlab-ci-mixing.yml
  become: yes

- name: Delete .gitlab-ci directory
  file:
    path: /var/ci-scripts/{{repo_name}}/.gitlab-ci
    state: absent    
  become: yes

- name: Create .gitlab-ci directory for each service
  file:
    path: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name | replace('-','_')}}
    state: directory
    mode: '0755'
  become: yes
  with_items: '{{services}}'

- name: Build build.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/build.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name | replace('-','_')}}/build.gitlab-ci.yml
  with_items: '{{ services }}'
  become: yes

- name: Build scan.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/scan.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name | replace('-','_')}}/scan.gitlab-ci.yml
  with_items: '{{ services }}'
  when: item.platform is undefined or item.platform == "linux"
  become: yes

- name: Build transform-configs.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/transform-configs.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name | replace('-','_')}}/transform-configs.gitlab-ci.yml
  with_items: '{{ services }}'
  when: transform_config is defined and transform_config == true
  become: yes

- name: Build build-cocos-web.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/build-cocos-web.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name | replace('-','_')}}/build-cocos-web.gitlab-ci.yml
  with_items: '{{ services }}'
  when: frameworks is defined and "cocos" in frameworks
  become: yes

- name: Build deploy-vars.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/deploy-vars.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name | replace('-','_')}}/deploy-vars.gitlab-ci.yml
  with_items: '{{ services }}'
  become: yes

- name: Build rules.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/rules.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name | replace('-','_')}}/rules.gitlab-ci.yml
  with_items: '{{ services }}'
  become: yes

- name: Build deploy.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/deploy.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name | replace('-','_')}}/deploy.gitlab-ci.yml
  with_items: '{{ services }}'
  become: yes

- name: Merge multi gitlab-ci files into a file
  assemble:
    src: "/var/ci-scripts/{{repo_name}}/.gitlab-ci/{{services[0].name | replace('-','_')}}/"
    dest: "/var/ci-scripts/{{repo_name}}/.gitlab-ci/{{services[0].name | replace('-','_')}}.gitlab-ci.yml"
  become: yes