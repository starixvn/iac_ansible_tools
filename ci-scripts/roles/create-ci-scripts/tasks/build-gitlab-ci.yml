- name: Build gitlab-ci.yml
  template:
    src: templates/docker-swarm/gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/gitlab-ci.yml
  become: yes

- name: Create .gitlab-ci directory for each service
  file:
    path: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name}}
    state: directory
    mode: '0755'
  become: yes
  with_items: '{{services}}'

- name: Build build.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/build.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name}}/build.gitlab-ci.yml
  with_items: '{{ services }}'
  become: yes

- name: Build build-cocos-web.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/build-cocos-web.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name}}/build-cocos-web.gitlab-ci.yml
  with_items: '{{ services }}'
  when: frameworks is defined and "cocos" in frameworks
  become: yes

