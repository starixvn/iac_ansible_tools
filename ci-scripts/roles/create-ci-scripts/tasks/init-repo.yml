- name: Clean ci directory
  file:
    state: absent
    path: '/var/ci-scripts'
  become: yes

- name: Create ci directory
  file:
    path: "{{ folder_path | default('/var/ci-scripts')}}"
    state: directory
    mode: '0755'
  become: yes

- name: Install git
  apt:
    name: git
    state: present
    update_cache: yes
  become: yes

- name: Set repo ci name
  set_fact:
    repo_name: "{{team_name}}_{{project_name | replace('-','_')}}_{{ services[0].name | replace('-','_') }}"
  become: yes

- name: Set facts
  set_fact:
    ci_group_name: 'others'
  when: team_name == "nexus"
  become: yes

- name: Set facts
  set_fact:
    ci_group_name: '{{team_name}}'
  when: team_name == "nex3" or team_name == "luminet"
  become: yes

- name: Clone ci repo
  shell: |
    cd /var/ci-scripts
    eval "$(ssh-agent -s)"
    chmod 400 /home/{{ansible_user}}/.ssh/private_key
    ssh-add /home/{{ansible_user}}/.ssh/private_key
    GIT_SSH_COMMAND="ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no" git clone git@{{gitlab_url | default("git3.nexdev.net")}}:ci/repos-ci/{{repo_name}}.git
  become: yes
