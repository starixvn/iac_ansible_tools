- name: Clean ci directory
  file:
    state: absent
    path: '/var/ci-scripts'
  become: yes

- name: Create ci directory
  file:
    path: "{{ folder_path | default('/var/ci-scripts')}}"
    state: directory
    mode: '0755'
  become: yes

- name: Install git
  apt:
    name: git
    state: present
    update_cache: yes
  become: yes

- name: Set repo ci name
  set_fact:
    repo_name: "{{team_name}}_{{project_name | replace('-','_')}}_{{ services[0].name | replace('-','_') }}"
  become: yes

- name: Set ci group name
  set_fact:
    ci_group_name: 'others'
  when: team_name == "nexus"
  become: yes

- name: Set ci group name
  set_fact:
    ci_group_name: '{{team_name}}'
  when: team_name == "nex3" or team_name == "luminet"
  become: yes

- name: Clone ci repo
  shell: |
    cd /var/ci-scripts
    eval "$(ssh-agent -s)"
    chmod 400 /home/{{ansible_user}}/.ssh/private_key
    ssh-add /home/{{ansible_user}}/.ssh/private_key
    GIT_SSH_COMMAND="ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no" git clone git@{{gitlab_url | default("git3.nexdev.net")}}:ci/repos-ci/{{repo_name}}.git
  become: yes

- name: Build gitlab-ci.yml
  template:
    src: templates/docker-swarm/gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/gitlab-ci.yml
  become: yes

- name: Create .gitlab-ci directory for each service
  file:
    path: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name}}
    state: directory
    mode: '0755'
  become: yes
  with_items: '{{services}}'

- name: Create .docker-compose directory for each service
  file:
    path: /var/ci-scripts/{{repo_name}}/.docker-compose/{{item.name}}
    state: directory
    mode: '0755'
  become: yes
  with_items: '{{services}}'

- name: Build build.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/build.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name}}/build.gitlab-ci.yml
  with_items: '{{ services }}'
  become: yes

- name: Build deploy-vars.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/deploy-vars.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name}}/deploy-vars.gitlab-ci.yml
  with_items: '{{ services }}'
  become: yes

- name: Build rules.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/rules.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name}}/rules.gitlab-ci.yml
  with_items: '{{ services }}'
  become: yes

- name: Build deploy-local.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/deploy-local.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name}}/deploy-local.gitlab-ci.yml
  with_items: '{{ services }}'
  become: yes

- name: Build deploy-sit.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/deploy-sit.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name}}/deploy-sit.gitlab-ci.yml
  with_items: '{{ services }}'
  become: yes

- name: Build deploy-uat.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/deploy-uat.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name}}/deploy-uat.gitlab-ci.yml
  with_items: '{{ services }}'
  become: yes

- name: Build deploy-prod.gitlab-ci.yml for each service
  template:
    src: templates/docker-swarm/.gitlab-ci/deploy-prod.gitlab-ci.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.gitlab-ci/{{item.name}}/deploy-prod.gitlab-ci.yml
  with_items: '{{ services }}'
  become: yes

- name: Build docker-compose for local
  when: item.stack_deploy is defined and item.stack_deploy == true
  template:
    src: templates/docker-swarm/.docker-compose/docker-compose.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.docker-compose/{{item.name}}/{{env | upper}}.docker-compose.yml
  vars:
    env: local
  with_items: '{{ services }}'
  become: yes

- name: Build docker-compose for sit
  when: item.stack_deploy is defined and item.stack_deploy == true
  template:
    src: templates/docker-swarm/.docker-compose/docker-compose.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.docker-compose/{{item.name}}/{{env | upper}}.docker-compose.yml
  vars:
    env: sit
  with_items: '{{ services }}'
  become: yes

- name: Build docker-compose for uat
  when: item.stack_deploy is defined and item.stack_deploy == true
  template:
    src: templates/docker-swarm/.docker-compose/docker-compose.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.docker-compose/{{item.name}}/{{env | upper}}.docker-compose.yml
  vars:
    env: uat
  with_items: '{{ services }}'
  become: yes

- name: Build docker-compose for prod
  when: item.stack_deploy is defined and item.stack_deploy == true
  template:
    src: templates/docker-swarm/.docker-compose/docker-compose.yml.j2
    dest: /var/ci-scripts/{{repo_name}}/.docker-compose/{{item.name}}/{{env | upper}}.docker-compose.yml
  vars:
    env: prod
  with_items: '{{ services }}'
  become: yes

- name: Push CI repo
  shell: |
    cd /var/ci-scripts/{{repo_name}}
    eval "$(ssh-agent -s)"
    chmod 400 /home/{{ansible_user}}/.ssh/private_key
    ssh-add /home/{{ansible_user}}/.ssh/private_key
    git config --global user.email "ansible@nexdev.net"
    git config --global user.name "ansible"
    git add .
    git commit -m "ci: update"
    git push origin master
  become: yes

- name: Create gluster glusterfs_volumes
  file:
    path: '{{item.1}}'
    state: directory
    mode: '0777'
  with_subelements:
    - '{{ services }}'
    - volumes
  become: yes
