- name: Deploy swarm service for Windows web/services
  hosts: swarm_leader
  vars:
    team:
    stack:
    service_name: 
    environment_name:
    working_directory: /var/www/gluster/web/{{team}}/{{stack}}/{{service_name}}/{{environment_name}}
    image_name:
    max_memory:
    replicas:
    vol_source_path:
    vol_dest_path:

  roles:
    - role: deploy-windows-service
      run_once: true
      become: true