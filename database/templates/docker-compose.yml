version: '3.3'
services:
  mysql:
    image: registry.nexdev.net:5050/docker/database/mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - published: 33062
        target: 3306
        mode: ingress
    environment:
      - MYSQL_DATABASE=database
      - MYSQL_ROOT_PASSWORD=1qaz@WSX
      - MYSQL_USER=mysql_user
      - MYSQL_PASSWORD=Pass1234AA
    volumes:
      - db:/var/lib/mysql
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.labels.NEXOPS_LOW_STORAGE == yes
    networks:
      - {{swarm_network_nexops}}

