---
- name: Create phpadmin directory
  file:
    path: "{{gluster_path}}/{{team_path}}/phpadmin"
    mode: "0755"
    state: directory
  become: yes

- name: Copy phpadmin configuration
  copy:
    src: "files/uploads.ini"
    dest: "{{gluster_path}}/{{team_path}}/phpadmin"
  become: yes
- name: Copy mysql conf
  copy:
    src: "files/custom-mysql.cnf"
    dest: "{{gluster_path}}/{{team_path}}"
  become: yes

- name: Create directory
  file:
    path: "{{gluster_path}}/{{team_path}}/data"
    mode: "0755"
    state: directory
  become: yes

- name: Create network
  docker_network:
    name: "{{swarm_network_nexops}}"
    driver: "overlay"
    attachable: true
  ignore_errors: yes
  become: yes

- name: Copy docker-compose file
  template:
    src: "templates/deploy-mysql.yml.j2"
    dest: "{{gluster_path}}/{{team_path}}/{{stack_name}}_db.yml"
  become: yes

- name: Executing command docker stack deploy --compose-file={{stack_name}}_db.yml {{stack_name}} --with-registry-auth
  shell: |
    cd {{gluster_path}}/{{team_path}}
    docker stack deploy --compose-file={{stack_name}}_db.yml {{stack_name}} --with-registry-auth
  become: yes
