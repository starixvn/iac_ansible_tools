---
- name: Create stack directory
  file:
    path: "/home/{{ansible_user}}/stacks"
    mode: "0755"
    state: directory
  become: yes

- name: Create directory
  file:
    path: "{{gluster_path}}/{{team_path}}/data"
    mode: "0755"
    state: directory
  become: yes

- name: Create network
  docker_network:
    name: "{{swarm_network_nexops}}"
    driver: "overlay"
    attachable: true
  ignore_errors: yes
  become: yes

- name: Copy docker-compose file
  template:
    src: "templates/deploy-mysql.yml.j2"
    dest: /home/{{ansible_user}}/stacks/mysql-stack.yml
  become: yes

- name: Build up and run container
  shell: |
    cd /home/{{ansible_user}}/stacks
    docker stack deploy --compose-file=mysql-stack.yml {{stack_name}}
  become: yes
