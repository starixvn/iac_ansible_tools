---
- name: Create portainer directory
  file:
    path: "{{gluster_path}}/influshdb"
    mode: "0755"
    state: directory
  become: yes

- name: Copy docker-compose file
  #when: inventory_hostname == groups['swarm_managers'][0]
  template:
    src: "templates/influshdb-docker-compose.yml.j2"
    dest: /home/{{ansible_user}}/stacks/influshdb.yml
  become: yes

- name: Build up and run container
  #when: inventory_hostname == groups['swarm_managers'][0]
  shell: |
    cd /home/{{ansible_user}}/stacks
    docker stack deploy --compose-file=influshdb.yml influshdb
  become: yes
