- name: Copy Dockerfile template
  template:
    src: 'templates/nodejs.Dockerfile.j2'
    dest: "{{ working_directory }}/Dockerfile"
  become: yes

- name: Copy Nodejs Healthcheck template
  template:
    src: 'templates/nodejs.healthcheck.js.j2'
    dest: "{{ working_directory }}/healthcheck.js"
  become: yes

- name: Copy docker-compose build nodejs image template
  template:
    src: 'templates/build-image.docker-compose.yml.j2'
    dest: "{{ working_directory }}/docker-compose.yml"
  become: yes