---
- name: Creating network interface if not existed...
  shell: |
    docker network ls|grep frontend_nic > /dev/null || docker network create --driver bridge frontend_nic
    docker network ls|grep backend_nic > /dev/null || docker network create --driver bridge backend_nic
  become: yes
      
# - name: Check and create docker volume {{volume_name | default('logs')}} if not existed...
#   shell: |
#     docker volume ls|grep {{volume_name | default('logs')}} > /dev/null || docker volume create {{volume_name | default('logs')}}
#   become: yes

- name: Create working directory {{ working_directory }}
  file:
    path: '{{ working_directory }}'
    mode: '0755'
    state: directory
  become: yes

- name: Create working directory for site
  file:
    path: '{{ working_directory }}/{{ item }}'
    owner: root
    group: root
    mode: '0777'
    state: directory
  become: yes
  with_items: 
    - conf
    - logs
    - app



