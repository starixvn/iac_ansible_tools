---
- name: Create working path
  file:
    path: /var/www/portainer
    state: directory
    mode: 0755
  become: yes

- name: Copy docker-compose file
  template:
    src: 'templates/docker-compose.yml.j2'
    dest: /var/www/portainer/docker-compose.yml
  become: yes

