---
- name: Install GlusterFS
  apt: name={{ item }} state=latest update_cache=yes
  with_items:
    - glusterfs-server
    - glusterfs-common
  become: true

- name: Enable GlusterFS on boot
  service: 'name=glusterd state=started enabled=yes'
  become: true
  when: ansible_distribution == 'Ubuntu' and ansible_distribution_release == 'bionic'

- name: Enable GlusterFS on boot
  service: 'name=glusterfs-server state=started enabled=yes'
  become: true
  when: ansible_distribution == 'Ubuntu' and ansible_distribution_release == 'xenial'

- name: Configure glusterfs peers
  gluster_peer:
    state: present
    nodes: '{{ play_hosts }}'
  delegate_to: '{{ play_hosts | first }}'
  become: true

- name: Get existing volumes list
  shell: 'gluster volume list'
  changed_when: false
  register: glusterfs_volume_list
  delegate_to: '{{ play_hosts | first }}'
  become: true

- name: Install Docker Python library
  become: true
  apt:
    state: present
    update_cache: yes
    #upgrade: yes
    pkg:
      - python3-pip
      - curl
