- name: Prune images
  shell: |
    docker image prune --all -f
    docker builder prune --all -f
  become: yes
  ignore_errors: yes

- name: Prune volume
  shell: |
    docker volume prune -f
  become: yes
  ignore_errors: yes

- name: Removes the specified configs from the swarm
  shell: |
    docker config rm $(docker config ls)
  become: yes
  ignore_errors: yes
