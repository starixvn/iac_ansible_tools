- name: Prune images
  shell: |
    docker image prune --all -f
    docker builder prune --all -f
  become: yes
  ignore_errors: yes

- name: Prune volume
  shell: |
    docker volume prune -f
  become: yes
  ignore_errors: yes

- name: Prune container
  shell: |
    docker container prune -f --filter "until=240h"
  become: yes
  ignore_errors: yes
