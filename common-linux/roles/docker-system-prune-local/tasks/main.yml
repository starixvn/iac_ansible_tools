- name: Prune container
  shell: |
    docker container prune -f
  become: yes
  ignore_errors: yes

- name: Prune volume
  shell: |
    docker volume prune -f
  become: yes
  ignore_errors: yes

- name: Prune images
  shell: |
    docker image prune -f -a
    docker builder prune -f
  become: yes
  ignore_errors: yes
