- name: Ensure hostname set
  hostname: name={{ hostname }}
  ignore_errors: true
  become: yes

- name: Ensure hostname is in /etc/hosts
  lineinfile:
    dest=/etc/hosts
    regexp="^{{ ansible_default_ipv4.address }}.+$"
    line="{{ ansible_default_ipv4.address }} {{ hostname }}"
  ignore_errors: true
  become: yes

- name: Print hostname
  debug:
    msg: "{{ hostname }}"