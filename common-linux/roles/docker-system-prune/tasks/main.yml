- name: Install Software common
  become: true
  shell: |
    apt-get install software-properties-common
    apt-add-repository universe
    apt-get update

- name: Install Docker Python library
  become: true
  apt:
    state: present
    update_cache: yes
    pkg:
      - python3-pip

- name: Install Docker Python library
  become: true
  ignore_errors: true
  pip:
    name: docker
    state: latest

- name: Prune system docker
  shell: docker system prune --all -f
  become: yes
  ignore_errors: yes
