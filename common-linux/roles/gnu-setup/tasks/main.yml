- name: Install gnupg2
  apt:
    pkg:
    - gnupg2
    - pass
  become: yes

- name: Generate full key
  shell: |
    export GNUPGHOME="$(mktemp -d)" 
    cat >foo <<EOF
      %echo Generating a basic OpenPGP key
      Key-Type: DSA
      Key-Length: 1024
      Subkey-Type: ELG-E
      Subkey-Length: 1024
      Name-Real: NexOps
      Name-Comment: NexOps
      Name-Email: nexops@nexcel.vn
      Expire-Date: 0
      Passphrase: n3x0ps
      # Do a commit here, so that we can later print "done" :-)
      %commit
      %echo done
    EOF
    gpg2 --batch --generate-key foo
  become: yes