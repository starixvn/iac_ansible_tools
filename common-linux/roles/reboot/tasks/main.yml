---
- name: Check the uptime
  shell: uptime
  register: UPTIME_PRE_REBOOT

- debug: msg={{UPTIME_PRE_REBOOT.stdout}}

- name: Stop docker containers
  shell: |
    docker kill $(docker ps -aq)

