---
- name: Install Docker Python library
  become: true
  #become_method: sudo
  ignore_errors: true
  pip:
    name: docker

#- name: Remove old versions of Docker
#  become: true
#  #become_method: sudo
#  apt:
#    state: absent
#    pkg:
#      - docker
#      - docker-engine
#      - docker.io
#      - containerd
#      - runc
#    force_apt_get: true

- name: Install Docker GPG key
  become: yes
  #become_method: sudo
  shell: "curl -fsSL https://download.docker.com/linux/ubuntu/gpg | apt-key add -"

- name: Add Docker repository
  become: yes
  #become_method: sudo
  shell: add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"

- name: Install Docker
  become: yes
  #become_method: sudo
  apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
    force_apt_get: true
    update_cache: yes

- name: Add "{{ansible_user}}" user to "docker" group
  become: yes
  #become_method: sudo
  shell: "adduser {{ansible_user}} docker"

- name: Waiting for Docker service to become available
  wait_for:
    path: /var/run/docker.sock

- name: Ensure docker-compose is installed and available
  get_url:
    url: https://github.com/docker/compose/releases/download/{{docker_compose_version | default ('1.24.0')}}/docker-compose-{{ ansible_system }}-{{ ansible_userspace_architecture }}
    dest: /usr/local/bin/docker-compose
    mode: "u+x,g+x"
  become: yes
- name: chmod docker-compose
  command: chmod +x /usr/local/bin/docker-compose
  become: yes
