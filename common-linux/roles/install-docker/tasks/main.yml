---
- name: Install Software common (1/3)
  become: true
  apt:
    state: present
    update_cache: yes
    pkg:
      - software-properties-common
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent

- name: Install Software common (2/3) for {{ ansible_distribution }} {{ ansible_distribution_major_version }}
  when: ansible_distribution_major_version == "18" or ansible_distribution_major_version == "16"
  become: true
  apt:
    state: present
    update_cache: yes
    pkg:
      - python
      - python-pip
      - python-docker

- name: Install Software common (2/3) for {{ ansible_distribution }} {{ ansible_distribution_major_version }}
  when: ansible_distribution_major_version == "20" or ansible_distribution_major_version == "22"
  become: true
  apt:
    state: present
    update_cache: yes
    pkg:
      - python3
      - python3-pip
      - python3-docker

- name: Install Software common (3/3)
  become: yes
  ignore_errors: true
  apt_repository:
    repo: '{{ item }}'
    state: present
  loop:
    - 'deb http://archive.ubuntu.com/ubuntu/ bionic universe'
    - 'deb http://archive.ubuntu.com/ubuntu/ bionic-updates universe'
    - 'deb http://security.ubuntu.com/ubuntu/ bionic-security universe'
    
- name: Install Docker Python library
  when: ansible_distribution_major_version == "18" or ansible_distribution_major_version == "16"
  become: true
  ignore_errors: true
  pip:
    name: '{{ item }}'
    state: latest
  loop:
    #- docker
    - docker-compose
    #- docker-py

- name: Install Docker Python3 library
  when: ansible_distribution_major_version == "20" or ansible_distribution_major_version == "22"
  become: true
  ignore_errors: true
  pip:
    name: '{{ item }}'
    state: latest
    executable: pip3
  loop:
    #- docker
    - docker-compose
    #- docker-py

- name: Install Docker GPG key
  become: yes
  shell: 'curl -fsSL https://download.docker.com/linux/ubuntu/gpg | apt-key add -'

- name: Add Docker repository
  become: yes
  shell: add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"

- name: Install Docker
  become: yes
  apt:
    name: "{{ packages }}"
    state: present
    force: yes
    update_cache: yes
  vars:
    packages:
    - docker-ce={{docker_engine_version}}
    - docker-ce-cli 
    - containerd.io

- name: Add "{{ansible_user}}" user to "docker" group
  become: yes
  shell: 'adduser {{ansible_user}} docker'

- name: Waiting for Docker service to become available
  wait_for:
    path: /var/run/docker.sock

- name: Ensure docker-compose is installed and available
  get_url:
    url: https://github.com/docker/compose/releases/download/{{docker_compose_version | default ('1.24.0')}}/docker-compose-{{ ansible_system }}-{{ ansible_userspace_architecture }}
    dest: /usr/local/bin/docker-compose
    mode: 'u+x,g+x'
  become: yes
- name: chmod docker-compose
  command: chmod +x /usr/local/bin/docker-compose
  become: yes
