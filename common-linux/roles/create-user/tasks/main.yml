---
- name: Add a new user named provision
  user:
    name: "{{ provision_user }}"
    password: "{{ provision_password }}" # &hdke839D#4GY!)
    system: yes
    state: present
  become: yes

- name: Add provision user to the sudoers
  copy:
    dest: "/etc/sudoers.d/{{ provision_user }}"
    content: "{{ provision_user }}  ALL=(ALL)  NOPASSWD: ALL"
  become: yes
  #notify: restart ssh
