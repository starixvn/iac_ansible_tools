- name: Create {{ folder_path | default('/var/www')}} directory
  file:
    path: "{{ folder_path | default('/var/www')}}"
    state: directory
    mode: "{{permission | default('0755')}}"
  become: yes

- name: set permission folder
  shell: chmod -R {{permission | default('0755')}} {{folder_path | default('/var/www')}}
  become: yes
