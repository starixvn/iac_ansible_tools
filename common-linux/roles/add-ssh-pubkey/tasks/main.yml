---
- name: Create .ssh folder
  file:
    path: '/home/{{provision_user}}/.ssh'
    state: directory
  become: yes

- name: Copy authorized_keys file
  template:
    src: 'files/authorized_keys'
    dest: /home/{{provision_user}}/.ssh/authorized_keys
  become: yes

- name: Copy private key file
  template:
    src: 'files/private_key'
    dest: /home/{{provision_user}}/.ssh/private_key
  become: yes

- name: Copy ssh config
  template:
    src: 'files/config'
    dest: /home/{{provision_user}}/.ssh/config
  become: yes

- name: Set ssh add
  shell: |
    eval `ssh-agent -s`
    chmod 400 /home/{{provision_user}}/.ssh/private_key
    ssh-add /home/{{provision_user}}/.ssh/private_key
  become: yes

- name: Add provision user to the sudoers
  copy:
    dest: '/etc/sudoers.d/{{ provision_user }}'
    content: '{{ provision_user }}  ALL=(ALL)  NOPASSWD: ALL'
  become: yes
  notify: restart ssh
