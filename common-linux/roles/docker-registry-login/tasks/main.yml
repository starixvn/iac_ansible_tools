- name: Setup Docker Proxy (1/3)
  when: enable_docker_proxy is defined and enable_docker_proxy == "true"
  file:
    path: '/etc/systemd/system/docker.service.d'
    state: directory
  become: yes
  
- name: Setup Docker Proxy Copy Proxy Config (2/3) - {{env}}
  when: enable_docker_proxy is defined and enable_docker_proxy == "true"
  template:
    src: 'files/proxy-{{env}}.conf'
    dest: /etc/systemd/system/docker.service.d/proxy-{{env}}.conf
  become: yes

- name: Setup Docker Proxy (3/3)
  when: enable_docker_proxy is defined and enable_docker_proxy == "true"
  shell: systemctl daemon-reload && systemctl restart docker.service && chmod 666 /var/run/docker.sock
  become: yes

- name: Verify that the configuration has been loaded "systemctl show docker --property Environment"
  shell: |
    echo "$(systemctl show docker --property Environment)"
  register: proxy_cfg

- debug:
    msg: '{{ proxy_cfg.stdout }}'

- name: Login registry
  shell: docker login --username={{docker_registry_username}} --password={{docker_registry_password}} {{docker_registry_url}}