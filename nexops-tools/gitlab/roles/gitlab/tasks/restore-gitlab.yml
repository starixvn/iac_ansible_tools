---
- name: Restore database Gitlab
  become: yes
  shell: |
    latest_file=$(ls -t {{ working_path }}/{{ container_name }}/data/backups | head -n 1)
    file_restore=$(echo "$latest_file"|sed -e "s/_gitlab_backup.tar//")
    echo "file need restore is $file_restore"
    chmod 777 -R {{ working_path }}/{{ container_name }}/data/backups/
    chown root:root -R {{ working_path }}/{{ container_name }}/data/backups
    docker exec -i {{ container_name }} gitlab-ctl stop sidekiq
    sleep 10
    docker exec -i {{ container_name }} gitlab-ctl stop puma
    sleep 10
    docker exec -i {{ container_name }} gitlab-backup restore BACKUP=$file_restore --trace force=yes
    sleep 30
    docker exec -i {{ container_name }} gitlab-ctl restart
    sleep 10
    docker exec -i {{ container_name }} gitlab-rake gitlab:check SANITIZE=true

- name: Restart Gitlab
  become: yes
  shell: |
    docker restart {{ container_name }}



