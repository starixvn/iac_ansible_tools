---
- name: Add latest HAProxy PPA
  apt_repository:
    repo: "{{ haproxy_ppa }}"
    update_cache: true
  tags:
    - haproxy-install-add-repository
  ignore_errors: true
  become: yes
- name: Installing packages using loops
  apt:
    name:
      - colordiff
      - etckeeper
    state: present
    autoclean: yes
  become: yes
- name: Install HAProxy package
  apt:
    name: "haproxy"
    state: "latest"
  tags:
    - haproxy-install-dependencies
  become: yes

- name: cp haproxy certs files
  copy: 
    src: 'files/{{ item }}'
    dest: /etc/haproxy/
    directory_mode: yes
    owner: root
    group: root
    mode: 0644
  with_items: 
    - certs
  become: yes

- name: Copy HAProxy configuration in place.
  template:
    src: "templates/{{ env }}.haproxy.cfg.j2"
    dest: /etc/haproxy/haproxy.cfg
    backup: yes
    validate: haproxy -f %s -c
  notify: restart haproxy
  become: yes

- name: Ensure HAProxy is started and enabled on boot.
  service: name=haproxy state=started enabled=yes
  become: yes

- name: Put rsyslogd config file in /etc/rsyslog.d/
  copy: src=files/49-haproxy.conf dest=/etc/rsyslog.d/49-haproxy.conf owner=root group=root mode=7777
  notify: restart rsyslog
  become: yes

- name: Ensure rsyslog is started and enabled on boot.
  service: name=rsyslog state=started enabled=yes
  become: yes