---
- name: Create working directory
  file:
    path: "{{ working_directory }}"
    #/var/www/gluster/nexops/sentry_{{org}}#s11
    state: directory
    mode: "0777"
  become: yes

- name: Create DB folder
  file:
    path: "{{ working_directory }}/data"
    #/var/www/gluster/nexops/sentry_{{org}}#s11
    state: directory
    mode: "0777"
  become: yes

- name: Copy Sentry configuration
  copy:
    src: "templates/conf"
    dest: "{{ working_directory }}"
  become: yes

- name: Copy Docker compose file
  template:
    src: "templates/docker-compose.yml.j2"
    dest: "{{ working_directory }}/docker-compose.yml"
  become: yes

- name: Install jsondiff python package
  pip:
    name: jsondiff

- name: Deploy Sentry
  docker_stack:
    name: "sentry"
    state: present
    compose:
      - "{{working_directory}}/docker-compose.yml"

- name: Generating database for {{ container_name }}-web ...
  shell: |
    export sentry_web=$(docker ps -aqf "name=^sentry_web_{{org}}")
    export sentry_db=$(docker ps -aqf "name=^sentry_db_{{org}}")
    docker exec -it $sentry_db psql -U postgres -c "ALTER USER sentry WITH SUPERUSER;"
    docker exec -it $sentry_web sentry upgrade --noinput
  become: yes
  #Create Admin Sentry User
- name: Create Admin Sentry User
  shell: |
    export sentry_web=$(docker ps -aqf "name=^sentry_web_{{org}}")
    docker exec -it $sentry_web sentry createuser --email troy.vo@starixvn.com --password 1234aa --superuser --no-input
  become: yes
