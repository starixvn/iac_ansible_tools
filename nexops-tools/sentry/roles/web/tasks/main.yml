---
- name: Create working directory
  file:
    path: "{{ working_directory }}"
    #/var/www/gluster/nexops/sentry_{{org}}#s11
    state: directory
    mode: "0777"
  become: yes

- name: Copy Docker compose file
  copy:
    src: "templates/docker-compose.yml.j2"
    dest: "{{ working_directory }}/docker-compose.yml"
  become: yes

- name: Copy Sentry configuration
  copy:
    src: "templates/conf"
    dest: "{{ working_directory }}"
  become: yes

- name: Install jsondiff python package
  pip:
    name: jsondiff

- name: Deploy Sentry
  docker_stack:
    name: "sentry"
    state: present
    compose:
      - "{{working_directory}}/docker-compose.yml"
