---
- name: Create working directory
  file:
    path: "{{ working_directory }}"
    #/var/www/gluster/nexops/sentry_{{org}}#s11
    state: directory
    mode: "0777"
  become: yes

- name: Create DB folder
  file:
    path: "{{ working_directory }}/data"
    #/var/www/gluster/nexops/sentry_{{org}}#s11
    state: directory
    mode: "0777"
  become: yes

- name: cp script files
  copy:
    src: "templates/{{ item }}"
    dest: "{{ working_directory }}/{{ item }}"
  with_items:
    #- first-deployment.sh
    - postgres-container-id.sh
    - sentry-container-id.sh

- name: cp docker-compose file
  template:
    src: "templates/{{ item }}.j2"
    dest: "{{ working_directory }}/{{ item }}"
  with_items:
    - docker-compose.yml
    - sentry-config.yml
    - first-deployment.sh

- name: Copy Sentry configuration
  copy:
    src: "files/init.sql"
    dest: "{{ working_directory }}"
  become: yes

- name: Install jsondiff python package
  pip:
    name: jsondiff

- name: Deploy Sentry
  docker_stack:
    name: "sentry"
    state: present
    compose:
      - "{{working_directory}}/docker-compose.yml"

- name: Init database for sentry {{org}} ...
  shell: |
    cd {{ working_directory }}
    chmod 777 first-deployment.sh postgres-container-id.sh sentry-container-id.sh
    sh first-deployment.sh
  become: yes
