---
- name: Create working directory
  file:
    path: "{{ working_directory }}"
    state: directory
    mode: "0777"
  become: yes

- name: Create DB folder
  file:
    path: "{{ working_directory }}/{{ item }}"
    state: directory
    mode: "0777"
  become: yes
  with_items:
    - sentry-data
    - sentry-postgres
    - sentry-redis

- name: cp docker-compose file
  template:
    src: "templates/{{ item }}.j2"
    dest: "{{ working_directory }}/{{ item }}"
  with_items:
    - docker-compose.yml
    - sentry-config.yml
    - first-deployment.sh
    - postgres-container-id.sh
    - sentry-container-id.sh

- name: Copy Sentry configuration
  copy:
    src: "files/init.sql"
    dest: "{{ working_directory }}"
  become: yes

#- name: Install jsondiff python package
#  pip:
#    name: jsondiff
#  ignore_errors: true

- name: replace org {{org}} in postgres-container-id.sh
  replace:
    path: "{{working_directory}}/postgres-container-id.sh"
    regexp: "org"
    replace: "{{org}}"

- name: replace org {{org}} in sentry-container-id.sh
  replace:
    path: "{{working_directory}}/sentry-container-id.sh"
    regexp: "org"
    replace: "{{org}}"

- name: Deploy Sentry
  shell: |
    docker stack deploy -c {{working_directory}}/docker-compose.yml {{stack}} --with-registry-auth

- name: grant scripts permission
  shell: |
    cd {{ working_directory }}
    docker-compose pull
    chmod 777 first-deployment.sh postgres-container-id.sh sentry-container-id.sh
  become: yes

- name: Execute the script Init database - cd {{ working_directory }} && /bin/bash first-deployment.sh 
  shell: |
    docker service scale sentry_clean_{{org}}=0 sentry_web_{{org}}=0 sentry_cron_{{org}}=0 sentry_worker_{{org}}=0 
    until docker service ps --filter desired-state=running sentry_postgres_{{org}} 2>&1 >> /dev/null
    do
        echo "wait sentry_postgres_{{org}} up..."
        sleep 3
    done
    cd {{ working_directory }} && cat init.sql | docker exec -i $(./postgres-container-id.sh) psql -U postgres
    docker service scale sentry_web_{{org}}=1 sentry_cron_{{org}}=1 sentry_worker_{{org}}=1 sentry_clean_{{org}}=1 
    until docker service ps --filter desired-state=running sentry_web_{{org}} 2>&1 >> /dev/null
    do
        echo "wait sentry_sentry up..."
        sleep 3
    done
  register: console
  become: yes #  #cd {{ working_directory }} && /bin/bash first-deployment.sh

- debug: msg="{{ console.stdout }}"

- debug: msg="{{ console.stderr }}" 

- name: Upgrade sentry and craete Admin user sentry {{org}} ...
  shell: |
    cd {{ working_directory }}
    docker exec -it $(./sentry-container-id.sh) sentry upgrade --noinput
    docker exec -it $(./sentry-container-id.sh) sentry createuser \
    --email {{admin_email}} \
    --password {{password_admin_email}} \
    --superuser --no-input > /dev/null
  become: yes
