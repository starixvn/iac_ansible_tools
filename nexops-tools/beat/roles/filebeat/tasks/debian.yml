---
- name: Download Filebeats Package
  command: curl -L -O https://artifacts.elastic.co/downloads/beats/filebeat/filebeat-7.14.1-amd64.deb
  become: yes

- name: Install Filebeats Package
  command: dpkg -i filebeat-7.14.1-amd64.deb
  become: yes

- name: Enable and configure System Module
  command: filebeat modules enable system
  become: yes

- name: This is where I hate my life
  command: filebeat setup
  become: yes
