---

- name: Install filebeat
  become: true
  apt:
    state: present
    update_cache: yes
    pkg:
      - filebeat
  notify:
    - restart filebeat
- name: Download filebeat .deb file
  command: curl -L -O https://artifacts.elastic.co/downloads/beats/filebeat/{{version}}
#filebeat-7.14.1-amd64.deb
    # Use command module
- name: Install filebeat .deb
  command: dpkg -i {{version}}

