---
- include: debian.yml
  when: ansible_os_family == 'Debian'

- include: redhat.yml
  when: ansible_os_family == 'RedHat'

- name: Prepare filebeat config file
  template:
    src: filebeat.yml.j2
    dest: /etc/filebeat/filebeat.yml
    backup: true
  notify:
    - restart filebeat
  become: yes

- name: Start and enable filebeat service
  service:
    name: filebeat
    enabled: yes
    state: started
  changed_when: False
  become: yes