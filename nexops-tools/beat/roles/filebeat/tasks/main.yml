---
- include: debian.yml
  when: ansible_os_family == 'Debian' and proxy is not defined
- include: debian_proxy.yml
  when: ansible_os_family == 'Debian' and proxy is defined

- include: redhat.yml
  when: ansible_os_family == 'RedHat'

- include: filebeat-windows.yml
  when: ansible_os_family == 'Windows'

- name: Copy Filebeat configuration.
  template:
    src: "filebeat.yml.j2"
    dest: "/etc/filebeat/filebeat.yml"
  notify: restart filebeat
  become: yes
  ignore_errors: true
  when: ansible_os_family == 'Debian'

- name: Start and enable filebeat service
  service:
    name: filebeat
    enabled: yes
    state: started
  changed_when: False
  become: yes
  when: ansible_os_family == 'Debian'