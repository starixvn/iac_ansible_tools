---
- name: APT - Add elastic.co key
  apt_key: url="https://artifacts.elastic.co/GPG-KEY-elasticsearch"
  when: ansible_distribution == "Ubuntu"
  become: yes

- name: Update apt cache
  apt: update_cache=yes cache_valid_time=3600
  become: yes

- name: APT - Add elastic.co repository
  when: ansible_distribution == "Ubuntu"
  apt_repository:
    repo: "deb https://artifacts.elastic.co/packages/{{version}}/apt stable main"
    state: present
    filename: "elastic-{{version}}"
    #update_cache: true
  become: yes

- name: FILEBEAT - Install Filebeat
  apt: pkg=filebeat
  when: ansible_distribution == "Ubuntu"
  become: yes
