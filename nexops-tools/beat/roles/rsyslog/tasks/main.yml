---
- name: The detected OS is Ubuntu. Installing rsyslog...
  apt:
    name: rsyslog
  register: installedSuccess
  when: ansible_facts['distribution'] == "Ubuntu"
  become: yes

- name: After success installation, replace config file.
  template:
    src: "rsyslog.conf.j2"
    dest: "/etc/rsyslog.conf"
  become: yes
  #ignore_errors: true
  when: installedSuccess

# update service data?

- name: Start and enable rsyslog service
  service:
    name: rsyslog
    enabled: yes
    state: started
  changed_when: False
  become: yes

- name: Rsyslog is installed and running. Copying {{item}} configuration...
  template:
    src: "{{item}}.j2"
    dest: "/etc/rsyslog.d/{{item}}"
  notify: restart rsyslog
  become: yes
  with_items:
    - haproxy.conf

- name: Copying {{item}} configuration...
  template:
    src: "{{item}}.j2"
    dest: "/etc/logrotate.d/{{item}}"
  become: yes
  with_items:
    - haproxy