---
- name: Create config folder
  file:
    path: '{{config_folder}}'
    state: directory
    mode: '777'

- name: Copy rabbitmq.conf
  copy:
    src: config/rabbitmq.conf
    dest: "{{config_folder}}/rabbitmq.conf"
    mode: 0777

- name: Copy definitions.json
  copy:
    src: "config/definitions.{{environment_name}}.json"
    dest: "{{config_folder}}/definitions.json"
    mode: 0777

- name: Copy enabled_plugins
  copy:
    src: config/enabled_plugins
    dest: "{{config_folder}}/enabled_plugins"
    mode: 0777

- name: Copy nodes folder
  copy:
    src: nodes/
    dest: "{{nodes_folder}}"
    mode: 0777

- name: Set .erlang.cookie permission
  file:
    path: '{{nodes_folder}}/{{item}}/data/.erlang.cookie'
    state: file
    mode: 0600
    owner: 'root'
    group: 'root'
  with_items:
    - rabbit1
    - rabbit2
    - rabbit3

- name: Copy docker_compose.yml
  ansible.builtin.template:
    src: templates/docker-compose.yml.j2
    dest: "{{working_directory}}/docker-compose.yml"
    mode: 0777

- name: Install jsondiff python package
  pip:
    name: jsondiff

- name: Sleep for 10 seconds for gluster synchronize data
  wait_for:
    timeout: 10
  delegate_to: localhost

- name: Deploy RabbitMQ
  docker_stack:
    name: "rabbitmq"
    state: present
    compose: 
      - "{{working_directory}}/docker-compose.yml"