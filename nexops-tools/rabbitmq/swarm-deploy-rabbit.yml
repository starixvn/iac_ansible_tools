---
- name: Deploy RabbitMQ to Docker Swarm
  hosts: nexops_high_storage

  vars:
    working_directory: "/var/www/gluster/nexops/rabbitmq"
    node_label: "NEXOPS_HIGH_STORAGE"
    environment_name: "Local" # Local, UAT, SIT, PRO, AWS, LUMI
    swarm_network: "swarm_nexcel_local"
    config_folder: "{{working_directory}}/config"
    data_folder: "{{working_directory}}/data"
  roles:
    - role: deploy-rabbit
      when: inventory_hostname in groups['gluster_leader']