---
# Variables here are applicable to all host groups
volume_path: /var/www/traefik
traefik_version: 2.4
nexcel_traefik_image_local: hub.nexdev.net/base
nexcel_traefik_image_local_test: hub.nexdev.net/base
nexcel_traefik_image_nexprod: hub.nexdev.net/base
