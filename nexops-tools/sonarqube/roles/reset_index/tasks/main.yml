---
- name: Stop Sonar
  shell: docker service update --replicas=0 {{service_name}}

- name: Sleep for 15 seconds
  wait_for:
    timeout: 15
  delegate_to: localhost

- name: Delete es6 folder
  file:
    path: "{{es_folder}}"
    state: absent

- name: Start Sonar
  shell: docker service update --replicas=1 {{service_name}}