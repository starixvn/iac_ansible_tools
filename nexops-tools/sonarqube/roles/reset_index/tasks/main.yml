---
- name: Stop Sonar
  docker_swarm_service:
    name: "{{service_name}}"
    image: registry.nexdev.net:5050/docker/nexops-tools/sonarqube:8.4.2-community
    replicas: 0

- name: Sleep for 30 seconds
  wait_for:
    timeout: 60
  delegate_to: localhost

- name: Delete es6 folder
  file:
    path: "{{es_folder}}"
    state: absent

- name: Start Sonar
  docker_swarm_service:
    name: "{{service_name}}"
    image: registry.nexdev.net:5050/docker/nexops-tools/sonarqube:8.4.2-community
    replicas: 1