---
- name: Stop Sonar
  ansible.builtin.shell: docker service update --replicas=0 {{service_name}}

- name: Sleep for 30 seconds
  wait_for:
    timeout: 30
  delegate_to: localhost

- name: Delete es6 folder
  file:
    path: "{{es_folder}}"
    state: absent

- name: Start Sonar
  ansible.builtin.shell: docker service update --replicas=1 {{service_name}}