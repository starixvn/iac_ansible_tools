version: "3.8"

services:
  web:
    image: sonarqube:8.4.2-community
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swarm_nexcel_local
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - "node.labels.NEXOPS_HIGH_STORAGE==yes"
        max_replicas_per_node: 1
    stop_grace_period: 1m
    environment:
      SONAR_HOME: /opt/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: SQL@Root1105
      SONAR_JDBC_URL: jdbc:postgresql://postgres/sonar
    volumes:
      - conf:/opt/sonarqube/conf
      - data:/opt/sonarqube/data
      - extensions:/opt/sonarqube/extensions
      - logs:/opt/sonarqube/logs

  postgres:
    image: postgres:9.6
    networks:
      - swarm_nexcel_local
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 1s
      timeout: 3s
      retries: 30
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - "node.labels.NEXOPS_HIGH_STORAGE==yes"
        max_replicas_per_node: 1
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: SQL@Root1105
      POSTGRES_DB: sonar
    volumes:
      - db_data:/var/lib/postgresql/data

networks:
  swarm_nexcel_local:
    external: true

volumes:
  conf:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /var/www/gluster/nexops/sonarqube/web/conf
  data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /var/www/gluster/nexops/sonarqube/web/data
  extensions:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /var/www/gluster/nexops/sonarqube/web/extensions
  logs:
  db_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: /var/www/gluster/nexops/sonarqube/postgres/db_data