---
- name: Deploy SonarQube to docker swarm
  hosts: nexops_high_storage
  vars:
    ansible_ssh_port: 222
    working_directory: "/var/www/gluster/nexops/sonarqube"
    web_folder: "{{working_directory}}/web"
    postgres_folder: "{{working_directory}}/postgres/db_data"
    prepare_web_volume: false            # false: not prepare volume data - true: prepare volume data for first time
    prepare_postgres_volume: false
  roles:
    - role: copy_volume_data
      run_once: true
  tasks:
    - name: Copy docker_compose.yml
      copy:
        src: docker-compose.yml
        dest: "{{working_directory}}"
        mode: 0777
      run_once: true

    - name: Deploy SonarQube
      when: inventory_hostname in groups['swarm_managers']
      docker_stack:
        name: "sonar"
        state: present
        compose: 
          - "{{working_directory}}/docker-compose.yml"
      run_once: true

