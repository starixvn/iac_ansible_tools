---
# Variables here are applicable to all host groups
gluster_path: "/var/www/redis/{{env}}/{{system}}"
redis_config_master: "redis_master_{{env}}_{{ ansible_date_time.iso8601_basic_short }}"
redis_config_slave: "redis_slave_{{env}}_{{ ansible_date_time.iso8601_basic_short }}"
####  ALPHA
alpha_redis_local:
  master: "10.18.200.109"
  #slave1: "10.18.200.121"
  #slave2: "10.18.200.144"
  node1: "{{redis_config_master}}"
  node2: "{{redis_config_slave}}"
  node3: "{{redis_config_slave}}"
  redis_port: "6312"
  sentinel_port: "26112"
  python_port: "33005"
  redis_version: "5"
  maxmemory: "4g"
  redis_stack: "ALPHA"

