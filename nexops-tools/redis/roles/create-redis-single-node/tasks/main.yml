---
- name: Verify stacks directory exists
  #when: inventory_hostname in groups['swarm_managers']
  file:
    path: '{{gluster_path}}/{{item}}'
    mode: '0755'
    state: directory
  with_items:
    - data
    - logs
  become: yes

- name: Copy docker-compose file
  #when: inventory_hostname in groups['swarm_managers']
  template:
    src: "templates/{{item}}.j2"
    dest: "{{gluster_path}}/{{item}}"
  become: yes
  with_items:
    - docker-compose.yml
    - redis.conf

- name: Build up and run container
  #when: inventory_hostname in groups['swarm_managers']
  shell: |
    cd {{gluster_path}}
    chmod 777 -R {{gluster_path}}/logs
    docker-compose up -d
  become: yes
