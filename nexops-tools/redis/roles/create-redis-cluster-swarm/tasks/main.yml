---
- name: Verify stacks directory exists (on first swarm node)
  #when: inventory_hostname in groups['swarm_managers']
  file:
    path: '{{gluster_path}}'
    mode: '0755'
    state: directory
  become: yes

- name: Verify stacks directory exists (on first swarm node)
  #when: inventory_hostname in groups['swarm_managers']
  file:
    path: '{{gluster_path}}/{{item}}'
    mode: '0777'
    state: directory
  with_items:
    - data
    - logs
  become: yes

#- name: Create network
#  docker_network:
#    name: '{{swarm_network_nexops}}'
#    driver: 'overlay'
#    attachable: true
#  ignore_errors: yes
#  become: yes
- name: Copy docker-compose file
  template:
    src: "templates/docker-compose.yml.j2"
    dest: "{{gluster_path}}/docker-compose.yml"
  become: yes
  with_items:
    - "{{system}}_redis_{{env}}"

- name: Copy cfg files
  template:
    src: "templates/{{item}}.j2"
    dest: "{{gluster_path}}/{{item}}"
  become: yes
  with_items:
    - redis.conf

