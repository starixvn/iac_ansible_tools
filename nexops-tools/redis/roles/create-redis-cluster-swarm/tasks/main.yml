---
- name: creating working path
  #when: inventory_hostname in groups['swarm_managers']
  file:
    path: '{{gluster_path}}/data'
    mode: '0755'
    state: directory
  become: yes

- name: ceate folders data logs
  file:
    path: '{{gluster_path}}/{{item}}'
    mode: '0777'
    state: directory
  with_items:
    - conf/master
    - conf/slave
  become: yes
  when: inventory_hostname in groups['swarm_managers']

### COPY docker-compose 
- name: Copy docker-compose file {{system}} {{env}}
  template:
    src: templates/docker-compose.yml.j2
    dest: "{{gluster_path}}/docker-compose.yml"
  become: yes
  when: inventory_hostname in groups['swarm_managers']
  run_once: true
  skip_reason: Conditional result was False

###NAP REDIS CFG 
- name: Copy redis MASTER file {{env}}
  template:
    src: templates/master_redis.conf.j2
    dest: "{{gluster_path}}/conf/master/redis.conf"
  become: yes
  when: inventory_hostname in groups['swarm_managers']
  run_once: true
  skip_reason: Conditional result was False

- name: Copy redis SLAVE file {{env}}
  template:
    src: templates/slave_redis.conf.j2
    dest: "{{gluster_path}}/conf/slave/redis.conf"
  become: yes
  when: inventory_hostname in groups['swarm_managers']
  run_once: true
  skip_reason: Conditional result was False
###
- name: Deploy stack service REDIS
  shell: |
    cd {{gluster_path}}
    docker stack deploy -c docker-compose.yml {{system}}-redis --with-registry-auth
  become: yes
  when: inventory_hostname in groups['swarm_managers']
  run_once: true
  skip_reason: Conditional result was False

- name: remove old swarn config REDIS
  shell: |
    cd {{gluster_path}}
    docker config rm $(docker config ls | grep -e {{system}}-redis_redis_*)
  become: yes
  when: inventory_hostname in groups['swarm_managers']
  run_once: true
  skip_reason: Conditional result was False
  ignore_errors: yes