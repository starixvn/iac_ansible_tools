---
- name: creating working path
  #when: inventory_hostname in groups['swarm_managers']
  file:
    path: '{{gluster_path}}'
    mode: '0755'
    state: directory
  become: yes

- name: ceate folders data logs
  file:
    path: '{{gluster_path}}/{{item}}'
    mode: '0777'
    state: directory
  with_items:
    - data
    - logs
  become: yes

######NEXPROD
- name: Copy docker-compose file {{system}} NEXPROD
  template:
    src: templates/docker-compose.yml.j2
    dest: "{{gluster_path}}/docker-compose.yml"
  become: yes
  with_items:
    - "{{alpha_redis_nexprod}}"
  when: system == "alpha" and env == "nexprod"

- name: Copy docker-compose file {{system}} NEXPROD
  template:
    src: templates/docker-compose.yml.j2
    dest: "{{gluster_path}}/docker-compose.yml"
  become: yes
  with_items:
    - "{{nap_redis_nexprod}}"
  when: system == "nap" and env == "nexprod"
######LOCAL
- name: Copy docker-compose file {{system}} LOCAL
