###
- name: Deploy stack service REDIS
  shell: |
    cd {{gluster_path}}
    docker stack deploy -c docker-compose.yml {{system}}-redis --with-registry-auth
  become: yes
  when: inventory_hostname in groups['swarm_managers']
  run_once: true

- name: remove old swarn config REDIS
  shell: |
    cd {{gluster_path}}
    docker config rm $(docker config ls | grep -e {{system}}-redis_redis_{{env}}_*)
  become: yes
  when: inventory_hostname in groups['swarm_managers']
  run_once: true
  ignore_errors: yes