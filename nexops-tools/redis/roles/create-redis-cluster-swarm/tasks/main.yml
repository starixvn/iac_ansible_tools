---
- name: creating working path
  #when: inventory_hostname in groups['swarm_managers']
  file:
    path: '{{gluster_path}}'
    mode: '0755'
    state: directory
  become: yes

- name: ceate folders data logs
  file:
    path: '{{gluster_path}}/{{item}}'
    mode: '0777'
    state: directory
  with_items:
    - data
    - conf/master
    - conf/slave
  become: yes

######NEXPROD
- name: Copy docker-compose file {{system}} NEXPROD
  template:
    src: templates/docker-compose.yml.j2
    dest: "{{gluster_path}}/docker-compose.yml"
  become: yes
  with_items:
    - "{{alpha_redis_nexprod}}"
  when: system == "alpha" and env == "nexprod"

- name: Copy docker-compose file {{system}} NEXPROD
  template:
    src: templates/docker-compose.yml.j2
    dest: "{{gluster_path}}/docker-compose.yml"
  become: yes
  with_items:
    - "{{nap_redis_nexprod}}"
  when: system == "nap" and env == "nexprod" 

###REDIS
- name: Copy redis file {{system}} NEXPROD
  template:
    src: templates/redis.conf.j2
    dest: "{{gluster_path}}/master/redis.conf"
  become: yes
  with_items:
    - "{{alpha_redis_nexprod}}"
  ignore_errors: yes
  when: system == "alpha" and env == "nexprod" and inventory_hostname == {{ lookup('vars', 'alpha_redis_nexprod').master }}

- name: Copy redis file {{system}} NEXPROD
  template:
    src: templates/redis.conf.j2
    dest: "{{gluster_path}}/slave/redis.conf"
  become: yes
