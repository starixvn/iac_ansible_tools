###
- name: Copy cfg files
  template:
    src: "templates/{{item}}.j2"
    dest: "{{gluster_path}}/{{item}}"
  become: yes
  with_items:
    - redis.conf

- name: Deploy stack service REDIS
  shell: |
    cd {{gluster_path}}
    docker stack deploy -c docker-compose.yml {{system}}-redis --with-registry-auth
  become: yes
  #run_once: true
  when: inventory_hostname in groups['swarm_managers']
