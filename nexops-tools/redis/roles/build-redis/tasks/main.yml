---
- name: Verify directory exists
  file:
    path: '{{gluster_path}}/redis'
    mode: '0777'
    state: directory
  become: yes

- name: Copy docker files
  template:
    src: "templates/{{item}}.j2"
    dest: "{{gluster_path}}/redis/{{item}}"
  become: yes
  with_items:
    - docker-compose.yml
    - redis.conf
    - Dockerfile

- name: Build image
  shell: |
    cd {{gluster_path}}/redis
    docker-compose build
    docker-compose push
  become: yes
