---
- hosts: all
  tasks:
    - name: Testing 
      debug: msg="{{ lookup('vars', system + 'system_redis_' + env).master }}"
      tags: testing
      ignore_errors: yes
    
    - name: Testing
      debug: msg="{{ lookup('vars', system + '_redis_' + env).redis_port }}"
      tags: testing
      ignore_errors: yes

    - name: Show value of 'variablename'
      debug: msg="{{ lookup('vars', 'nap_redis_nexprod').master }}"
      tags: testing
      ignore_errors: yes
      #debug: msg="{{ lookup('vars', 'variabl' + myvar).sub_var }}"

    - name: Show default empty since i dont have 'variablnotename'
      debug: msg="{{ lookup('vars', 'nap_redis_local').slave2 }}"
      tags: testing
      ignore_errors: yes

    - name: Access nested variables
      debug: msg="{{ lookup('vars', 'variabl' + myvar).sub_var }}"
      ignore_errors: True
      vars:
        variablename:
            sub_var: 12
        myvar: ename
      tags: testing
      ignore_errors: yes

- hosts: all
  roles:
    - role: create-redis-single-node
    - role: redis-tuning
  tags: create-redis-single-node

- hosts: all
  roles:
    - role: create-redis-cluster-swarm
#    - role: redis-tuning
  tags:  create-redis-cluster-swarm

- hosts: all
  roles:
    - role: redis-tuning
  tags:  redis-tuning