---
- hosts: all
  tasks:
    - name: Show value of 'variablename'
      debug: msg="{{ lookup('group_vars', 'glusterpath' + myvar) }}"
      vars:
        variablename: hello
        myvar: ename
      tags: testing

    - name: Show default empty since i dont have 'variablnotename'
      debug: msg="{{ lookup('vars', 'variablename')}}"
      vars:
        variablename: hello
        myvar: notename
      tags: testing

- hosts: all
  roles:
    - role: create-redis-single-node
    - role: redis-tuning
  tags: create-redis-single-node

- hosts: all
  roles:
    - role: create-redis-cluster-swarm
#    - role: redis-tuning
  tags:  create-redis-cluster-swarm

- hosts: all
  roles:
    - role: redis-tuning
  tags:  redis-tuning