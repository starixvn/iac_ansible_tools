---
- hosts: all
  tasks:
    - name: Show value of 'variablename'
      debug: msg="{{ lookup('vars', 'variabl' + myvar) }}"
      vars:
        variablename: hello
        myvar: ename

    - name: Show default empty since i dont have 'variablnotename'
      debug: msg="{{ lookup('vars', 'variabl' + myvar, default='')}}"
      vars:
        variablename: hello
        myvar: notename

    - name: Produce an error since i dont have 'variablnotename'
      debug: msg="{{ lookup('vars', 'variabl' + myvar)}}"
      ignore_errors: True
      vars:
        variablename: hello
        myvar: notename

- hosts: all
  roles:
    - role: create-redis-single-node
    - role: redis-tuning
  tags: create-redis-single-node

- hosts: all
  roles:
    - role: create-redis-cluster-swarm
#    - role: redis-tuning
  tags:  create-redis-cluster-swarm

- hosts: all
  roles:
    - role: redis-tuning
  tags:  redis-tuning