---
- hosts: all
  tasks:
    - name: Show value of 'variablename'
      debug: msg="{{ lookup('vars', 'nap_redis_nexprod','master') }}"
      tags: testing
      ignore_errors: yes

    - name: Show default empty since i dont have 'variablnotename'
      debug: msg="{{ lookup('vars', 'nap_redis_local')}}"
      tags: testing
      ignore_errors: yes

- hosts: all
  roles:
    - role: create-redis-single-node
    - role: redis-tuning
  tags: create-redis-single-node

- hosts: all
  roles:
    - role: create-redis-cluster-swarm
#    - role: redis-tuning
  tags:  create-redis-cluster-swarm

- hosts: all
  roles:
    - role: redis-tuning
  tags:  redis-tuning