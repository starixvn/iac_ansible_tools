---
- name: remove old HAProxy PPA
  shell: rm -f /etc/apt/sources.list.d/*haproxy*
  ignore_errors: true
  become: yes

- name: Add latest HAProxy PPA
  apt_repository:
    repo: "{{ haproxy_ppa }}"
    update_cache: no
  ignore_errors: true

  become: yes
- name: Installing packages using loops
  apt:
    name:
      - colordiff
      - etckeeper
      - libpcre3
      - libpcre3-dev
    state: present
    autoclean: yes
  become: yes
- name: Install HAProxy package
  apt:
    name: "haproxy"
    state: "latest"
    update_cache: yes
  become: yes

- name: create haproxy path
  file:
    path: '/var/state/haproxy'
    state: directory
  with_items: 
    - haproxy
  become: yes

- name: cp haproxy conf.d files
  copy: 
    src: 'files/{{ item }}'
    dest: /etc/haproxy/
    directory_mode: yes
    owner: root
    group: root
    mode: 0644
  with_items: 
    - conf.d
  become: yes
- name: cp haproxy script
  template:
    src: "files/haconfig.sh.j2"
    dest: /etc/haproxy/haconfig.sh
  become: yes

- name: Copy HAProxy configuration in place.
  template:
    src: "files/{{ haproxy_configs }}.haproxy.cfg.j2"
    dest: /etc/haproxy/haproxy.cfg
#    backup: yes
    validate: haproxy -f %s -c
  become: yes
#  notify: restart haproxy
- name: compile haproxy cfg
  shell: cd /etc/haproxy && /bin/bash haconfig.sh
  notify: restart haproxy
  become: yes

- name: Ensure HAProxy is started and enabled on boot.
  service: name=haproxy state=started enabled=yes
  become: yes

- name: Put rsyslogd config file in /etc/rsyslog.d/
  copy: src=files/49-haproxy.conf dest=/etc/rsyslog.d/49-haproxy.conf owner=root group=root mode=0777
  notify: restart rsyslog
  become: yes

- name: Ensure rsyslog is started and enabled on boot.
  service: name=rsyslog state=started enabled=yes
  become: yes

- name: start haproxy
  service: >
    name=haproxy
    enabled=yes
    state=started
  become: yes