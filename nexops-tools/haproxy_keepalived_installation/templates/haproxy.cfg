global
    log          fd@2 local2
    chroot       /var/lib/haproxy
    pidfile      /var/run/haproxy.pid
    maxconn      4000
    user         haproxy
    group        haproxy
    stats socket /var/lib/haproxy/stats expose-fd listeners
    master-worker

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold valid      10s
    hold obsolete   10s

defaults
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    log global
    mode http
    option httplog

frontend  servicedemo1
    bind *:8089
    mode  http
    option forwardfor
    use_backend stat if { path -i /my-stats }
    default_backend servicedemo1 

backend servicedemo1_nodes
    balance roundrobin
    server-template servicedemo1- 3 servicedemo1-LOCAL:80 check resolvers docker init-addr libc,none

frontend  servicedemo2
    bind *:8087
    mode  http
    option forwardfor
    default_backend servicedemo1 

backend servicedemo2_nodes
    balance roundrobin
    server-template servicedemo 2 servicedemo1-LOCAL:80 check resolvers docker init-addr libc,none

backend stat
    stats enable
    stats uri /my-stats
    stats refresh 15s
    stats show-legends
    stats show-node