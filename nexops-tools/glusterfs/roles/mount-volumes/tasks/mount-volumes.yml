---
- name: Add a key from a file on the Ansible server
  apt_key:
    url: https://download.gluster.org/pub/gluster/glusterfs/7/rsa.pub
    state: present
  become: yes
  ignore_errors: yes

- name: Add apt repository gluster
  apt_repository:
    repo: ppa:gluster/glusterfs-7
    state: present
  become: yes
  ignore_errors: yes

- name: Install GlusterFS client
  apt: name={{ item }} state=latest update_cache=no
  with_items:
    - glusterfs-client
  become: true
  ignore_errors: yes

- name: Remove old mount point from fstab in case of change
  mount:
    path: "/var/www/gluster/*"
    state: absent

- name: Unmount old mount point in case of change
  shell: umount --verbose {{ umount_volume }}
  become: yes
  ignore_errors: yes

- name: Ensure mount paths presence
  file:
    path: '{{ item.mount.path }}'
    state: directory
  with_items: '{{ glusterfs_volumes }}'
  when: >
    item.mount is defined and
    (item.state is not defined or item.state == 'present')

- name: Mount volume(s)
  mount:
    name: '{{ item.mount.path }}'
    src: "{{ glusterfs_host + ':/' + item.volume }}"
    fstype: glusterfs
    state: mounted
  with_items: '{{ glusterfs_volumes }}'
  when: >
    item.mount is defined and
    (item.state is not defined or item.state == 'present')

- name: Ensure mount paths permissions
  file:
    path: '{{ item.mount.path }}'
    state: directory
    owner: "{{ item.mount.owner | default ('root') }}"
    group: "{{ item.mount.group | default ('root') }}"
    mode: "{{ item.mount.mode | default ('0777') }}"
  with_items: '{{ glusterfs_volumes }}'
  when: >
    item.mount is defined and
    (item.state is not defined or item.state == 'present')
