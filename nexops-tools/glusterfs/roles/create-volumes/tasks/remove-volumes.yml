---
- name: Get existing volumes list
  shell: 'gluster volume list'
  #changed_when: false
  register: glusterfs_volume_list

- name: Stop volume(s)
  shell: "gluster volume stop {{ glusterfs_volume_list }} force"
  #with_items: "{{ glusterfs_volume_list }}"
  become: true

- name: Delete volume(s)
  shell: "gluster volume delete {{ glusterfs_volume_list }} force"
  #with_items: "{{ glusterfs_volume_list }}"
  become: true