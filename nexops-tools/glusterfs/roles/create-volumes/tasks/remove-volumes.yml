---
- name: Get existing volumes list
  shell: 'gluster volume list'
  #changed_when: false
  register: glusterfs_volume_list

- name: Stop volume(s)
  shell: "echo 'y'| gluster volume stop {{ item }}"
  with_items: "{{ glusterfs_volume_list }}"
  become: true

- name: Delete volume(s)
  shell: "echo 'y' | gluster volume delete {{ item }}"
  with_items: "{{ glusterfs_volume_list }}"
  become: true