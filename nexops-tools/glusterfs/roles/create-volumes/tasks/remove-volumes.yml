---
- name: Get existing volumes list
  shell: 'gluster volume list'
  #changed_when: false
  register: glusterfs_volume_list

- name: Stop volume(s)
  shell: "gluster volume stop {{ item.stdout  }} force"
  with_items: "{{ glusterfs_volume_list.results }}"
  become: true

-- name: delete volume(s)
  shell: "gluster volume delete {{ item.stdout  }} force"
  with_items: "{{ glusterfs_volume_list.results }}"
  become: true