---
- name: Create working directory {{ working_directory }}
  file:
    path: '{{ working_directory }}/prometheus/data'
    mode: '0755'
    state: directory
  become: yes
  ignore_errors: yes

- name: Copy docker-compose template
  template:
    src: 'deploy-compose/prometheus-keepalived.docker-compose.yml.j2'
    dest: '{{ working_directory }}/docker-compose.yml'
  become: yes

- name: Pull latest images
  shell: |
    cd {{ working_directory }}
    docker-compose pull
  become: yes

- name: Copy tools' configs files
  copy:
    src: 'files/{{item}}/conf/'
    dest: '{{ working_directory }}/{{item}}'
    mode: '0755'
  become: yes
  with_items:
    - prometheus
  ignore_errors: yes

- name: Generate configs from templates
  template:
    src: 'files/{{item}}/templates/prometheus_keepalived.yml.j2'
    dest: '{{ working_directory }}/{{item}}/{{item}}.yml'
  become: yes
  with_items:
    - prometheus
  #ignore_errors: yes

- name: remove service and config
  when: inventory_hostname in groups['swarm_managers']
  shell: |
    docker service rm keepalived_prometheus
    docker config rm keepalived_prometheus_config
  become: yes
  ignore_errors: yes
  
- name: Update Promethus
  when: inventory_hostname in groups['swarm_managers']
  shell: |
    cd {{ working_directory }}
    export ENV={{ENV}}
    docker stack deploy --compose-file=docker-compose.yml keepalived --with-registry-auth
  become: yes