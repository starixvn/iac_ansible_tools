---
- name: Create working directory {{ working_directory }}
  file:
    path: '{{ working_directory }}'
    mode: '0755'
    state: directory
  become: yes
  ignore_errors: yes

- name: Create tools directory
  file:
    path: '{{ working_directory }}/{{item}}'
    mode: '0755'
    state: directory
  become: yes
  with_items:
    - mysql
    - grafana
  ignore_errors: yes

- name: Copy tools' configs files
  copy:
    src: 'files/{{item}}/conf/'
    dest: '{{ working_directory }}/{{item}}'
    mode: '0755'
  become: yes
  with_items:
    - caddy
    - prometheus
  ignore_errors: yes

- name: Generate configs from templates
  template:
    src: 'files/{{item}}/templates/{{item}}.yml.j2'
    dest: '{{ working_directory }}/{{item}}/{{item}}.yml'
  become: yes
  with_items:
    - prometheus
  ignore_errors: yes
