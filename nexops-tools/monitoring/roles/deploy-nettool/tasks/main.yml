---
- name: Copy docker-compose template
  template:
    src: 'deploy-compose/nettool.docker-compose.yml.j2'
    dest: '{{ working_directory }}/nettool.docker-compose.yml'
  become: yes

- name: Deploy nettool
  shell: |
    cd {{ working_directory }}
    docker stack deploy -c nettool.docker-compose.yml monitoring --with-registry-auth
  become: yes
