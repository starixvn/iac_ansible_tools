---
- name: Create working directory {{ working_directory }}
  file:
    path: '{{ working_directory }}'
    mode: '0755'
    state: directory
  become: yes
  ignore_errors: yes

- name: Copy docker-compose template
  #when: inventory_hostname == groups['swarm_managers'][0]
  template:
    src: 'deploy-compose/nettool.docker-compose.yml.j2'
    dest: '{{ working_directory }}/nettool.docker-compose.yml'
  become: yes

- name: Login registry
  shell: docker login --username={{docker_registry_username}} --password={{docker_registry_password}} {{docker_registry_url}}
  
- name: Pull images
  shell: |
    cd {{ working_directory }}
    docker-compose -f nettool.docker-compose.yml pull
  become: yes

- name: Deploy nettool
  when: inventory_hostname == groups['swarm_managers'][0]
  shell: |
    cd {{ working_directory }}
    docker stack deploy -c nettool.docker-compose.yml monitoring --with-registry-auth
  become: yes
