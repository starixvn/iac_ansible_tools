---
- name: Copy docker-compose template
  template:
    src: 'deploy-compose/prometheus.docker-compose.yml.j2'
    dest: '{{ working_directory }}/docker-compose.yml'
  become: yes

- name: Pull latest images
  shell: |
    export ENV={{ENV}}
    cd {{ working_directory }}
    docker-compose pull
  become: yes

- name: Copy tools' configs files
  copy:
    src: 'files/{{item}}/conf/'
    dest: '{{ working_directory }}/{{item}}'
    mode: '0755'
  become: yes
  with_items:
    #- caddy
    - prometheus
  ignore_errors: yes

- name: Generate configs from templates
  template:
    src: 'files/{{item}}/templates/{{item}}.yml.j2'
    dest: '{{ working_directory }}/{{item}}/{{item}}.yml'
  become: yes
  with_items:
    - prometheus
  #ignore_errors: yes

- name: remove service and config
  when: inventory_hostname in groups['swarm_managers']
  shell: |
    docker service rm monitoring_prometheus
    docker service rm  monitoring_caddy
    docker config rm monitoring_caddy_config
    docker config rm monitoring_prometheus_config
  become: yes
  ignore_errors: yes

#- name: Create network
#  docker_network:
#    name: "{{item}}"
#    driver: "overlay"
#    attachable: true
#  with_items: 'swarm_{{org}}_{{ENV}}'
#  ignore_errors: yes
#  become: yes
  
- name: Update Promethus
  when: inventory_hostname in groups['swarm_managers']
  shell: |
    cd {{ working_directory }}
    export ENV={{ENV}}
    docker stack deploy --compose-file=docker-compose.yml monitoring  --with-registry-auth
  become: yes