---
- name: Create working directory {{ working_directory }}
  file:
    path: '{{ working_directory }}'
    mode: '0755'
    state: directory
  become: yes

- name: Copy template files for build
  copy:
    src: 'files/{{item}}'
    dest: '{{ working_directory }}'
  become: yes
  with_items:
    - grafana
    - node-exporter
    - prometheus
  ignore_errors: yes

- name: Executing script to build and push images
  shell: |
    export ENV={{ENV}}
    cd {{ working_directory }}
    docker-compose -f grafana/docker-compose.yml build
    docker-compose -f grafana/docker-compose.yml push
    docker-compose -f node-exporter/docker-compose.yml build
    docker-compose -f node-exporter/docker-compose.yml push
    docker-compose -f prometheus/docker-compose.yml build
    docker-compose -f prometheus/docker-compose.yml push
  become: yes
