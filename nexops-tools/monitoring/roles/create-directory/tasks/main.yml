---
- name: Create working directory {{ working_directory }}
  file:
    path: '{{ working_directory }}'
    mode: '0755'
    state: directory
  become: yes

- name: Create working directory for data
  file:
    path: '{{ working_directory }}/{{item}}'
    mode: '0755'
    state: directory
  become: yes
  with_items:
    - mysql
    - prometheus

- name: Copy template files for build
  when: deploy is undefined or deploy == false
  copy:
    src: 'files/{{item}}'
    dest: '{{ working_directory }}'
  become: yes
  with_items:
    - grafana
    - node-exporter
    - prometheus
  ignore_errors: yes

- name: Copy configs files for runtime
  when: deploy == true
  template:
    src: 'templates/{{item}}/configs/{{item}}.yml.j2'
    dest: '{{ working_directory }}/{{item}}/{{item}}.yml'
  become: yes
  with_items:
    - prometheus
  ignore_errors: yes

- name: Copy template files for runtime
  when: deploy == true
  copy:
    src: 'files/{{item}}'
    dest: '{{ working_directory }}'
  become: yes
  with_items:
    - caddy
  ignore_errors: yes
