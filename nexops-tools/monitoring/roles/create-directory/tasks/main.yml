---
- name: Create working directory {{ working_directory }}
  file:
    path: '{{ working_directory }}'
    mode: '0755'
    state: directory
  become: yes

- name: Copy template files
  copy:
    src: 'files/{{item}}'
    dest: '{{ working_directory }}'
  become: yes
  with_items: 
    - alertmanager
    - caddy
    - grafana
    - node-exporter
    - prometheus
    - dockerd-exporter
  ignore_errors: yes