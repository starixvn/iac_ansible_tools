- name: Create network
  docker_network:
    name: "{{item}}"
    driver: "overlay"
    attachable: true
  with_items: 'swarm_{{org}}_{{ENV}}'
  ignore_errors: yes
  become: yes

- name: Copy docker-compose template for deploy
  template:
    src: 'deploy-compose/{{item}}.docker-compose.yml.j2'
    dest: '{{ working_directory }}/{{item}}.docker-compose.yml'
  become: yes
  with_items:
    - grafana
    - prometheus

- name: Pull latest images
  shell: |
    export ENV={{ENV}}
    cd {{ working_directory }}/{{item}}
    docker-compose pull
  become: yes
  with_items:
    - grafana
    - prometheus

- name: remove existed configs
  shell: |
    docker config rm monitoring_prometheus_config
  ignore_errors: yes
  become: yes

- name: Deploy NexOps monitoring tools
  when: inventory_hostname in groups['swarm_leader']
  shell: |
    cd {{ working_directory }}
    export ENV={{ENV}}
    docker config rm monitoring_prometheus_config
    docker stack deploy --compose-file grafana.docker-compose.yml -c prometheus.docker-compose.yml monitoring --with-registry-auth
  become: yes
