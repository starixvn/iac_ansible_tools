- name: prepare working path ...
  file:
    path: "{{ working_path }}/{{ item }}"
    state: directory
    mode: "0777"
  become: yes
  #run_once: true
  with_items:
    - data
    - common

- name: Copy harbor jinja cfg
  template:
    src: 'templates/{{ item }}.j2'
    dest: '{{working_path}}/{{ item }}'
  become: yes
  with_items:
    - harbor.yml

- name: Copy harbor template cfg
  template:
    src: 'templates/{{ item }}'
    dest: '{{working_path}}/{{ item }}'
  become: yes
  with_items:
    - common.sh
    - install.sh
    - prepare

- name: Build up and run container
  #when: inventory_hostname in groups['swarm_managers']
  shell: |
    cd {{working_path}} && chmod 777 common.sh install.sh prepare
  become: yes

- name: Execute the script Init database - cd {{ working_directory }} && /bin/bash first-deployment.sh 
  shell: cd {{ working_path }} && /bin/bash install.sh
  register: console
  become: yes

- debug: msg="{{ console.stdout }}"

- debug: msg="{{ console.stderr }}" 
