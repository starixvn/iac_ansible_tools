# LE Backend
backend letsencrypt-backend
	mode http
    server letsencrypt 127.0.0.1:1111
### HOSTS
####### HTTP GITLAB.nexdev.net
backend gitlab_cluster
	mode http
	
	#cookie JSESSIONID prefix
	# add X-FORWARDED-FOR
	option forwardfor
	# add X-CLIENT-IP
	http-request add-header X-CLIENT-IP %[src]
	server 10.18.200.109_8010 10.18.200.109:8010 check
	#server 10.18.200.119_8010 10.18.200.119:8010 check backup
	#server 10.18.200.222_8010 10.18.200.222:8010 check
	
####### SSH - GITLAB.nexdev.net
backend ssh-proxy-backend
	mode tcp
	stick-table type ip size 200k expire 30m
    stick on src
	#server 10.18.200.222_2221 10.18.200.222:2221 check
	server 10.18.200.109_2221 10.18.200.109:2221 check
	#server 10.18.200.119_2221 10.18.200.119:2221 check backup
####### SSH - GITLAB.nexdev.net
####### SMTP
backend smtp_cluster
	mode tcp
	no option http-server-close
	option smtpchk HELO smtp.nexdev.net
	server 10.18.200.95 10.18.200.95:10025 send-proxy check
	server 10.18.200.96 10.18.200.96:10026 send-proxy check backup
####### SMTP
###REDMINE
backend redmine_cluster
	mode http
	timeout client 30m
    timeout server 30m
    timeout check 30s
	
	#cookie JSESSIONID prefix
	server 10.18.200.109_8084 10.18.200.109:8084 check
	#server 10.18.200.119_8084 10.18.200.119:8084 check backup

backend ndict_cluster
	mode http
	balance source
	
	#cookie JSESSIONID prefix
	server 10.18.200.123_7803 10.18.200.123:7803 check
	#server 10.18.200.122_7803 10.18.200.122:7803 check

backend nuget_cluster
	mode http
	
	server 10.18.200.123_80 10.18.200.123:80 check
	#server 10.18.200.122_80 10.18.200.122:80 check

backend ndict_api_cluster
	mode http
	balance source
	
	#cookie JSESSIONID prefix
	server 10.18.200.123_7804 10.18.200.123:7804 check
	#server 10.18.200.122_7804 10.18.200.122:7804 check

#######  licbot.nexdev.net
backend licbot_cluster
