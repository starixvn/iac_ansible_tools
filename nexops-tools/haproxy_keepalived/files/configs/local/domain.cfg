	#acl ndict_api_host hdr(host) -i ndict-api.nexdev.net
	#acl ndict_api_host hdr(host) -i api.ndict.now
	acl nuget_host hdr(host) -i nuget.nexdev.net
	#acl wekan_host hdr(host) -i boards.nexdev.net
	#acl zabbix_host hdr(host) -i zabbix.nexdev.net
	#acl sentry_host hdr(host) -i sentry.nexdev.net

	#acl ndict_api_host hdr(host) -i api.ndict.now
	#acl grafana_host hdr(host) -i grafana.nexdev.net
	#acl kibana_host hdr(host) -i logs.nexdev.net
	acl licbot_host hdr(host) -i licbot.nexdev.net
	#acl docs_host hdr(host) -i docs.nexdev.net
	#acl docs_host2 hdr(host) -i docs2.nexdev.net
	#acl bot_host hdr(host) -i bot.nexdev.net
	acl nex3_i1_host hdr(host) -i nex3-i1.nexdev.net
	acl nex3_i7_host hdr(host) -i nex3-i7.nexdev.net
	#acl dockerhub_host hdr(host) -i regdocker.nexdev.net
	#acl docker_host hdr(host) -i docker.nexdev.net
	#acl hasite_host hdr(host) -i haproxy.nexdev.net
	acl nexgoal_host hdr(host) -i goal.nexdev.net
	#acl ansible_host hdr(host) -i ansible.nexdev.net
	acl grafana-report-host hdr(host) -i grafana-report.nexdev.net

	## figure out which one to use
	#use_backend ansible_cluster if ansible_host
	use_backend nexgoal_cluster if nexgoal_host
	use_backend gitlab_cluster if gitlab_host
