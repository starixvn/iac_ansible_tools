###SSH
frontend SSH-in
	bind *:22
	mode tcp
	#log global
	##ACL
	default_backend ssh-proxy-backend
###SMTP
frontend smtp-in
	bind *:25
	mode tcp
	#log global
	default_backend smtp_cluster
###Domain HTTP
frontend http-in
	bind *:80
	bind *:443 ssl crt /etc/haproxy/certs/nexdev.net.pem alpn h2,http/1.1 crt /etc/haproxy/certs/licbot.nexdev.net.pem alpn h2,http/1.1 crt /etc/haproxy/certs/server.pem
	mode http
    option forwardfor
	#http-request set-header X-Forwarded-Proto https if { ssl_fc }
	#redirect scheme https code 301 if !{ ssl_fc }
	#log global
	#option  httplog
	timeout client 30m
    timeout server 30m
    timeout check 30s
	#### Define ACL ####
	# LetsEncrypt
	acl letsencrypt-acl path_beg /.well-known/acme-challenge/
    use_backend letsencrypt-backend if letsencrypt-acl
	#
	acl gitlab_host hdr(host) -i gitlab.nexdev.net
	acl redmine_host hdr(host) -i nexdev.net
	acl redmine_host hdr(host) -i rm-bk.nexdev.net
