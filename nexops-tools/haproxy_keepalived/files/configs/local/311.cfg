
### 7 - upproxyapi
frontend frontend-upproxyapi
bind *:8802 
mode http
default_backend backend-upproxyapi

backend backend-upproxyapi
mode http
balance roundrobin

option  httplog
option forwardfor
option httpchk HEAD /whoami.aspx HTTP/1.0
default-server inter 3s fall 3 rise 10
server 10.18.200.123_http_8802 10.18.200.123:8802 check 

