
### 7 - rabbit-mq-admin
frontend frontend-rabbit-mq-admin
bind *:15672 
mode tcp
default_backend backend-rabbit-mq-admin

backend backend-rabbit-mq-admin
mode tcp
balance roundrobin

option tcplog
option tcp-check
default-server inter 3s fall 3 rise 10
server 10.18.200.111_tcp_15672 10.18.200.111:15672 check 
server 10.18.200.222_tcp_15672 10.18.200.222:15672 check 

