
### 7 - nexopsrocketorproxy
frontend frontend-nexopsrocketorproxy
bind *:7802 
mode http
default_backend backend-nexopsrocketorproxy

backend backend-nexopsrocketorproxy
mode http
balance roundrobin

option  httplog
