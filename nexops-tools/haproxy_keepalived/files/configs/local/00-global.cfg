global 
    #log 127.0.0.1   local0
    stats bind-process 1
    #stats socket ipv4@127.0.0.1:9999 level admin
    user haproxy
    group haproxy
    daemon
    maxconn 80000
    #spread-checks 4
    #tune.bufsize 32768
    #tune.ssl.default-dh-param 2048
    #server-state-file server-state
    #stats socket /var/lib/haproxy/stats
    #server-state-base /var/lib/haproxy #/var/state/haproxy/
    #stats socket /var/run/haproxy/info.sock  mode 666 level user
defaults
    #log     global
	maxconn 10000
    option  dontlognull
    #option dontlog-normal
    timeout client-fin 5s
    timeout server-fin 5s
    retries 3
    option redispatch
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout check 10s
    #load-server-state-from-file global

listen stats
    bind *:8080
    mode  http
    maxconn  10
    stats  enable
    #stats  hide-version
    stats  realm Haproxy\ Statistics
    stats  uri /
    stats  auth admin:1234aa

frontend status-monitor
	bind *:8001
    mode http
    option httplog
	monitor-uri	/checkstatus
default_backend default_backend_nodes

backend default_backend_nodes
    mode http
    option httplog
    http-request return status 503 content-type "text/plain"  lf-string "503 Service Unavailable ! Pls contact NexOps if you think this is a mistake..."
