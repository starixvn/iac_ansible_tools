### REDIS for ALPHA
frontend frontend_alpha_redis
bind *:16389 name alpha_redis
mode tcp
default_backend backend_alpha_redis
option tcplog
option tcp-check

backend backend_alpha_redis
option tcplog
option tcp-check
tcp-check connect
tcp-check send AUTH\ foo1@bared\r\n
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send info\ replication\r\n
tcp-check expect string role:master
tcp-check send QUIT\r\n
tcp-check expect string +OK
server 10.2.27.130_6312 10.2.27.130:6312 check inter 1s
server 10.2.27.125_6312 10.2.27.125:6312 check inter 1s
server 10.99.99.210_6312 10.99.99.210:6312 check inter 1s
