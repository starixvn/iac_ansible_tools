### REDIS for FPS
frontend frontend_spu_redis
bind *:6111 name redis-spu
mode tcp
default_backend backend_redis_spu_cluster
option tcplog
option tcp-check

backend backend_redis_spu_cluster
option tcplog
option tcp-check
tcp-check connect
tcp-check send AUTH\ foo1@bared\r\n
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send QUIT\r\n
tcp-check expect string +OK
server 10.2.23.2 10.2.23.2:6111 check inter 1s

