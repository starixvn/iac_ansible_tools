###SYSTEM State

###SYSTEM
frontend frontend-redis-state-cluster
bind *:16380 name redis
mode tcp
default_backend backend-redis-state-cluster

option tcplog
option tcp-check
backend backend-redis-state-cluster
option tcp-check
tcp-check connect
tcp-check send AUTH\ foo1@bared\r\n
tcp-check send PING\r\n
tcp-check expect string +PONG
default-server inter 3s fall 5 rise 5
server 10.99.99.210_tcp_16379 10.99.99.210:16379 check
server 10.99.99.220_tcp_16379 10.99.99.220:16379 check backup

