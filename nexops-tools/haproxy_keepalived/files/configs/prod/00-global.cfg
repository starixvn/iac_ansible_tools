global
    log   127.0.0.1       local0
    #stats socket /var/run/haproxy.stat level admin process 1
    stats bind-process 1
    #stats socket ipv4@127.0.0.1:9999 level admin
    user haproxy
    group haproxy
    daemon
    maxconn 80000
    spread-checks 4
    tune.bufsize 32768
    log-send-hostname srv002
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers !EDH:!RC4:!ADH:!DSS:HIGH:+AES128:+AES256-SHA256:+AES128-SHA256:+SHA:!3DES:!aNULL:!eNULL
    tune.ssl.default-dh-param 2048
    tune.ssl.cachesize 1000000
    tune.ssl.lifetime 2h
    tune.ssl.maxrecord 1500
    tune.maxrewrite 1024
    server-state-file global
    server-state-base /var/state/haproxy/
    stats socket /var/run/haproxy/info.sock  mode 666 level user
defaults
    log global
    #mode http
    retries 3
    balance roundrobin
    http-reuse never
    option dontlognull
    option abortonclose
#    option  dontlog-normal
    option http-server-close
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout check 10s
    load-server-state-from-file global

listen stats
	bind *:8080
	mode  http
	maxconn  10
	stats  enable
	#stats  hide-version
	stats  realm Haproxy\ Statistics
	stats  uri /
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX
	#stats  auth admin:St@r!x.D3v0ps
	server HAProxy99-27 10.99.99.27:8080 cookie A check
	server HAProxy99-28 10.99.99.28:8080 cookie B check

frontend stats_metric
    bind *:8404
    mode  http
    stats enable
    stats uri /stats
    stats refresh 15s
    #stats auth Username:Password  # Authentication credentials

frontend health_check
    bind :8405
    monitor-uri /check
    mode http
    #acl backend_nodes_toobusy avg_queue(empty_backend_nodes) gt 5
    #monitor fail if backend_nodes_toobusy
default_backend empty_backend_nodes

backend empty_backend_nodes
    mode http
    http-request return status 200 content-type "text/plain"  lf-string "I'm ok. HAP!"
