global
        maxconn 200000
        log 127.0.0.1 local0
        tune.ssl.default-dh-param 2048
        #server-state-file global
        #server-state-base /var/haproxy/state/
        #stats socket /var/run/haproxy/info.sock  mode 666 level user
defaults
        #log     global
        maxconn 10000
        option  dontlognull
        option dontlog-normal
        option  http-server-close
#       option  forwardfor except 127.0.0.0/8
        timeout queue 1m
	timeout connect 10s
	timeout client 10m
	timeout server 10m
	timeout check 10s
        #load-server-state-from-file global

listen stats
        bind *:8080
        mode  http
        maxconn  10
        stats  enable
        #stats  hide-version
        stats  realm Haproxy\ Statistics
        stats  uri /
        stats  auth admin:1234aa

