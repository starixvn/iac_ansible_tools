global_defs {
  smtp_server localhost
  vrrp_version 3
}

vrrp_track_process haproxy {
  delay 2
  process haproxy
  quorum 1
}


vrrp_instance VI_5 {
  accept
  advert_int 1
  interface ens160
  priority 105
  state MASTER
  track_process {
    haproxy
  }
  unicast_peer {
    10.99.99.28
  }
  unicast_src_ip 10.99.99.27
  virtual_ipaddress {
    10.99.99.51
  }
  virtual_router_id 130
}
vrrp_instance VI_6 {
  accept
  advert_int 1
  interface ens160
  priority 100
  state MASTER
  track_process {
    haproxy
  }
  unicast_peer {
    10.99.99.28
  }
  unicast_src_ip 10.99.99.27
  virtual_ipaddress {
    10.99.99.52
}
  virtual_router_id 140
}
