---
- name: Install necessary apt package
  apt:
    name: libssl-dev
  become: yes

- name: install | Check if keepalived file {{ keepalived_file_path }} status.
  stat: path={{ keepalived_file_path }}
  become: yes
  run_once: true
  delegate_to: localhost
  register: keepalived_file_result

- name: Copy keepalived setup file - {{keepalived_version}}.tar.gz
  copy:
    src: files/source/keepalived-{{keepalived_version}}.tar.gz
    dest: "{{software_files_path}}"
  run_once: true
  delegate_to: localhost
  register: keepalived_source
  when:
    - not keepalived_file_result.stat.exists
  become: yes

- name: Unpack keepalived
  unarchive:
    dest: /tmp/
    src: "{{ keepalived_file_path }}"
    creates: "/tmp/keepalived-{{ keepalived_version }}"
  # when:
  #   - not service_status.stat.exists or keepalived_source.changed
  register: keepalived_source_unpack
  become: yes

- name: Configure keepalived
  command: './configure'
  args:
    chdir: '{{ keepalived_install_dir }}'
  # when:
  #   - not service_status.stat.exists or keepalived_source_unpack.changed
  register: keepalived_configure
  become: yes

- name: Install keepalived
  shell: make && make install
  args:
    chdir: '{{ keepalived_install_dir }}'
  # when:
  #   - not service_status.stat.exists or keepalived_configure.changed
  become: yes

- name: Create config directory
  file:
    path: '{{ keepalived_conf_dir }}'
    state: directory
  become: yes

- name: Create keepalived config file
  template:
    src: '{{item}}.j2'
    dest: '{{ keepalived_conf_dir }}/{{item}}'
  notify: Restart keepalived
  become: yes
  with_items:
    - keepalived.conf
    - keepalived_notify.sh
    - haproxy-curl-check.sh
    - haproxy-container-check.sh

- name: Set permission script files
  shell: chmod +x {{ keepalived_conf_dir }}/{{item}}
  become: yes
  with_items:
    - keepalived_notify.sh
    - haproxy-curl-check.sh
    - haproxy-container-check.sh

- name: Install keepalived service
  template:
    src: keepalived.service.j2
    dest: /lib/systemd/system/keepalived.service
  notify: Restart keepalived
  become: yes

- name: Start keepalived
  service:
    name: keepalived
    state: started
    enabled: yes
  become: yes

- name: "check current version of keepalived"
  shell: echo "$(keepalived -v)"
  become: yes
  args:
    executable: /bin/bash
  register: keepalived_v
- debug:
    var: keepalived_v