---
- name: Remove old_backup_file
  shell: rm -rf {{ remove_server_path }}
  become: yes

- name: Backup database Registry
  shell: |
    docker exec -i {{ container_name }} gitlab-backup create
  become: yes

- name: Move Gitlab latest backup file
  shell: |
    latest_file=$(ls -t {{ backup_server_path }}| head -n 1)
    mv {{ backup_server_path }}/$latest_file {{ restore_server_path }}
  become: yes