---
- name: Export pgDB to sql
  shell: docker exec -t {{ container_name }} pg_dumpall -c -U {{ POSTGRES_USER }} > {{ backup_server_path }}/ansibledb_`date +%d-%m-%Y"_"%H_%M_%S`.sql
  become: yes

- name: remove old backup Ansible file
  shell: |
    find {{ backup_server_path }} -mtime +1 -exec rm {} \;
  become: yes
  

