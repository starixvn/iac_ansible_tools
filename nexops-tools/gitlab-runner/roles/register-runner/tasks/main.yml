---
- name: Registry Runner {{team}}
  when: team == "nexcel"
  shell: |
    docker run --rm -v /var/www/gitlab-runner/config:/etc/gitlab-runner hub.nexdev.net/base/gitlab-runner:latest register \
    --non-interactive \
    --executor "docker" \
    --docker-image hub.nexdev.net/base/docker:20.10.7 \
    --docker-privileged \
    --url "https://gitlab.nexdev.net/" \
    --registration-token "VscxAqFvRVcXgpyoBDD_" \
    --description "docker-{{inventory_hostname}}" \
    --tag-list "docker" \
    --cache-type "s3" \
    --cache-shared \
    --cache-s3-server-address "https://minio.nexdev.net" \
    --cache-s3-access-key "gitlab-ci" \
    --cache-s3-secret-key "H5nF5ywy262wt881ZWpq" \
    --cache-s3-bucket-name "gitlab" \
    --cache-s3-insecure \
    --run-untagged="true" \
    --locked="false" \
    --docker-volumes /var/run/docker.sock:/var/run/docker.sock
  with_items: '{{ services }}'
  become: yes

- name: Registry Runner {{team}}
  when: team == "luminet"
  shell: |
    docker run --rm -v /var/www/gitlab-runner/config:/etc/gitlab-runner hub.lumigame.com/base/gitlab-runner:latest register \
    --non-interactive \
    --executor "docker" \
    --docker-image hub.lumigame.com/base/docker:20.10.7 \
    --docker-privileged \
    --url "https://git3.nexdev.net/" \
    --registration-token "9JzG2oJKAmYBHzgygxfW" \
    --description "docker-{{inventory_hostname}}" \
    --tag-list "docker" \
    --run-untagged="true" \
    --locked="false" \
    --docker-volumes /var/run/docker.sock:/var/run/docker.sock
  with_items: '{{ services }}'
  become: yes