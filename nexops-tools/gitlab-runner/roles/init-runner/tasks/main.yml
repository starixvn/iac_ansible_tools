---
#- name: Login registry
#  shell: docker login --username={{docker_registry_username}} --password={{docker_registry_password}} {{docker_registry_url}}

- name: Create Deployment directory
  file:
    path: "{{runner_config_path}}"
    state: directory
    mode: "0755"
  become: yes

- name: Copy Gitlab-runner configs
  template:
    src: "templates/config.toml.j2"
    dest: "{{runner_config_path}}/config.toml"
  become: yes

- name: create Container Runner luminet
  when: team == "luminet"
  shell: |
    docker run -d --name gitlab-runner --restart always \
      -v {{runner_config_path}}:/etc/gitlab-runner \
      -v /var/run/docker.sock:/var/run/docker.sock \
      hub.lumigame.com/base/gitlab-runner:latest
#registry.nexdev.net:5050/docker/gitlab-runner:latest

- name: create Container Runner nexcel
  when: team == "nexcel"
  shell: |
    docker run -d --name gitlab-runner --restart always \
      -v {{runner_config_path}}:/etc/gitlab-runner \
      -v /var/run/docker.sock:/var/run/docker.sock \
      hub.nexdev.net/base/gitlab-runner:latest
#registry.nexdev.net:5050/docker/gitlab-runner:latest