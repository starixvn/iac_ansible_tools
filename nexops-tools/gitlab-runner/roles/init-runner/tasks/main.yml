---
- name: Login registry
  shell: docker login --username={{docker_registry_username}} --password={{docker_registry_password}} {{docker_registry_url}}

- name: Create Deployment directory
  file:
    path: "{{item}}"
    state: directory
    mode: "0755"
  become: yes
  with_items:
    - "/var/www/gitlab-runner/config"

- name: create Container Runner {{team}}
  when: team == "luminet"
  shell: |
    docker run -d --name gitlab-runner --restart always \
      -v /var/www/gitlab-runner/config:/etc/gitlab-runner \
      -v /var/run/docker.sock:/var/run/docker.sock \
      registry.nexdev.net:5050/docker/gitlab-runner:latest

- name: create Container Runner {{team}}
  when: team == "nexcel"
  shell: |
    docker run -d --name gitlab-runner --restart always \
      -v /var/www/gitlab-runner/config:/etc/gitlab-runner \
      -v /var/run/docker.sock:/var/run/docker.sock \
      registry.nexdev.net:5050/docker/gitlab-runner:latest