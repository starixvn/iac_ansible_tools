- name: Create HAProxy directory
  file:
    path: '{{ volume_path }}'
    state: directory
    mode: '0777'
  become: yes

- name: Clean HAProxy config directory
  file:
    state: absent
    path: '{{ volume_path }}/configs'
  become: yes

- name: Copy HAProxy configuration.
  copy:
    src: 'files/{{team}}/configs/{{ env }}'
    dest: '{{ volume_path }}/configs'
  become: yes

- name: Build HAProxy configurations
  assemble:
    src: '{{ volume_path }}/configs/{{ env }}'
    dest: '{{ volume_path }}/{{ config_filename }}'
  become: yes

- name: Copy whitelist configuration.
  template:
    src: 'files/{{team}}/whitelisted.ips'
    dest: '{{ volume_path }}/whitelisted.ips'
  become: yes


- name: Copy SSL Certs configuration.
  template:
    src: 'files/{{team}}/certs/{{item}}'
    dest: '{{ volume_path }}/{{item}}'
  become: yes
  with_items: 
    - nexdev.net.pem
    - lumigame.com.pem
  ignore_errors: yes

- name: Copy HAProxy Dockerfile.
  template:
    src: 'templates/{{team}}/check-config.Dockerfile.j2'
    dest: '{{ volume_path }}/Dockerfile'
  become: yes

- name: Install Python docker
  apt:
    name: python-docker
    state: present
  become: yes
  ignore_errors: yes

- name: Remove HAProxy image for syntax check
  shell: docker image rm haproxy-check-config
  ignore_errors: yes
  become: yes

- name: Build HAProxy container for syntax check
  docker_image:
    name: haproxy-check-config
    build:
      path: '{{ volume_path }}'
    state: present
  become: yes
  ignore_errors: yes

- name: Check HAProxy config
  shell: docker run -it --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg
  become: yes