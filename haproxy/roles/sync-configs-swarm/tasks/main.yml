- name: Create HAProxy directory
  file:
    path: "{{ volume_path }}"
    state: directory
    mode: "0777"
  become: yes

- name: Clean HAProxy config directory
  file:
    state: absent
    path: "{{ volume_path }}/configs"
  become: yes
  ignore_errors: yes

- name: Copy HAProxy configuration
  copy:
    src: "files/{{team}}/configs/{{ env }}"
    dest: "{{ volume_path }}/configs"
  become: yes
  ignore_errors: yes

- name: Build HAProxy configurations
  assemble:
    src: "{{ volume_path }}/configs/{{ env }}"
    dest: "{{ volume_path }}/{{ config_filename }}"
    regexp: "cfg$"
  become: yes

- name: Copy whitelist configuration {{ env }} .
  when: env != "local"
  template:
    src: "files/{{team}}/{{item}}"
    dest: "{{ volume_path }}/{{item}}"
  become: yes
  with_items:
    #- 404.html
    - whitelisted.ips
  ignore_errors: yes

- name: Copy SSL Certs configuration {{ env }}
  when: env == "local" or env == "local_test"
  template:
    src: "files/{{team}}/certs/{{item}}"
    dest: "{{ volume_path }}/{{item}}"
  become: yes
  with_items:
    - nexdev.net.pem
    - licbot.nexdev.net.pem
    - lumigame.com.pem
    - nexcel.vn.pem
  ignore_errors: yes

- name: Copy custom configuration {{ env }}
  when: env == "local_test"
  template:
    src: "files/{{team}}/configs/{{ env }}/{{item}}"
    dest: "{{ volume_path }}/{{item}}"
  become: yes
  ignore_errors: yes
  with_items:
    - dataplaneapi.hcl

- name: Copy custom configuration {{ env }}
  when: env == "local_test"
  template:
    src: "files/{{team}}/configs/{{ env }}/maps/{{item}}"
    dest: "{{ volume_path }}/{{item}}"
  become: yes
  ignore_errors: yes
  with_items:
    - hosts.map
    - l2-game-proxy.map

- name: Copy custom configuration {{ env }}
  when: env == "local" and team == "luminet"
  template:
    src: "files/{{team}}/configs/{{ env }}/maps/{{item}}"
    dest: "{{ volume_path }}/{{item}}"
  become: yes
  ignore_errors: yes
  with_items:
    - hosts.map
    - l2-game-proxy.map
    - l2-game-proxy1.map
    - l1-game-proxy2.map
    - l1-game-proxy1.map
    - l1-game-proxy.map

- name: Copy HAProxy Dockerfile.
  template:
    src: "templates/{{team}}/check-config.Dockerfile.j2"
    dest: "{{ volume_path }}/Dockerfile"
  become: yes

- name: Copy HAProxy Dockerfile Testlab.
  when: env == "local_test"
  template:
    src: "templates/{{team}}/check-config.Dockerfile_testlab.j2"
    dest: "{{ volume_path }}/Dockerfile"
  become: yes

- name: Copy HAProxy Dockerfile Testlab.
  when: env == "local" and team == "luminet"
  template:
    src: "templates/{{team}}/check-config.Dockerfile_local.j2"
    dest: "{{ volume_path }}/Dockerfile"
  become: yes

- name: Remove HAProxy image for syntax check
  shell: docker image rm haproxy-check-config
  ignore_errors: yes
  become: yes

- name: Build HAProxy container for syntax check
  docker_image:
    name: haproxy-check-config
    build:
      path: "{{ volume_path }}"
    state: present
  become: yes
  ignore_errors: yes

- name: Check HAProxy config
  shell: docker run -it --rm haproxy-check-config haproxy -c -V -f /etc/haproxy/haproxy.cfg
  become: yes
