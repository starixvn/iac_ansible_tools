- name: Create network
  docker_network:
    name: "{{swarm_network_name}}"
    driver: "overlay"
    attachable: true
  ignore_errors: yes
  become: yes

- name: Verify stacks directory exists (on first swarm node)
  when: inventory_hostname == groups['swarm_leader'][0]
  file:
    path: "/home/{{ansible_user}}/stacks"
    state: directory

- name: Copy docker-compose file
  when: inventory_hostname == groups['swarm_leader'][0]
  template:
    src: 'templates/docker-compose-stack.yml.j2'
    dest: /home/{{ansible_user}}/stacks/haproxy-stack.yml
  become: yes

- name: Deploy haproxy service
  when: inventory_hostname == groups['swarm_leader'][0]
  shell: |
    cd /home/{{ansible_user}}/stacks
    docker stack deploy --compose-file=haproxy-stack.yml {{stack_name}}
  become: yes