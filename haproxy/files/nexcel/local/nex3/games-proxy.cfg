frontend l1_games_proxy
    bind *:7270
    mode  http
    option forwardfor
    use_backend game_server_nodes_local1 if { path_beg /main/ }
    default_backend game_server_nodes_local1

backend game_server_nodes_local1
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /main/(.*) /\1
    server-template game_server_local1 1 l1-game-server-LOCAL:8001 check resolvers docker init-addr libc,none