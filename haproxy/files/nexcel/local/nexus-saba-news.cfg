backend nexus_saba_news_v1_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template saba_news_v1_1 1 10.18.200.138:7516 check resolvers docker init-addr libc,none
    server-template saba_news_v1_2 1 10.18.200.139:7516 check resolvers docker init-addr libc,none

