backend game_server_nodes_local3
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    acl nd_path_slash path_end /
    http-request set-path %[path,regsub(^/local3/main/,/)] if nd_path_slash
    http-request set-path %[path,regsub(^/local3/main,/)] if ! nd_path_slash
    server-template game_server_local3 1 10.18.200.134:7892 check resolvers docker init-addr libc,none

