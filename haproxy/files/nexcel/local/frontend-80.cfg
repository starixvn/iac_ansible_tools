frontend http_in
    bind *:80
    mode  http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    # Nex3
    # API
    acl nex3_l3_api_proxy_host hdr(host) -i l3-api-proxy.nexdev.net
    use_backend nex3_l3_game_server_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/game-server } !{ path_beg /local1/game-server-api }
    use_backend nex3_l3_game_server_api_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/game-server-api }
    use_backend nex3_l3_sicbo_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/sicbo }
    use_backend nex3_l3_blackjack_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/blackjack }
    use_backend nex3_l3_game_api_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/game-api }
    use_backend nex3_l3_game_auth_api_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/game-auth-api }
    use_backend nex3_l3_game_admin_api_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/game-admin-api }

    # SITES
    use_backend nex3_l3_game_client_nodes_local1 if { hdr(host) -i l3-games-1.nexdev.net }
    use_backend nex3_l3_game_admin_site_nodes_local1 if { hdr(host) -i l3-admin-1.nexdev.net }
    use_backend nex3_l3_game_lobby_nodes_local1 if { hdr(host) -i l3-lobby-1.nexdev.net }
    use_backend nex3_l3_ow_api_nodes_local1 if { hdr(host) -i l3-ow-api-1.nexdev.net }
    use_backend nex3_l3_round_result_nodes_local1 if { hdr(host) -i l3-result-1.nexdev.net }
    use_backend nex3_l3_user_nodes_local1 if { hdr(host) -i l3-user-1.nexdev.net }
 