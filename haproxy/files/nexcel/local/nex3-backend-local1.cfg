backend game_server_nodes_local1
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    acl nd_path_slash path_end /
    http-request set-path %[path,regsub(^/local1/game-server/,/)] if nd_path_slash
    http-request set-path %[path,regsub(^/local1/game-server,/)] if ! nd_path_slash
    server-template game_server_local1 1 10.18.200.133:7871 check resolvers docker init-addr libc,none

