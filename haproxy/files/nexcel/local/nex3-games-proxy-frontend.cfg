frontend l1_games_proxy
    bind *:7270
    mode  http
    option forwardfor
    use_backend game_server_nodes_local1 if { path_beg /local1/main }
    use_backend game_server_api_nodes_local1 if { path_beg /local1/api-main }
    use_backend sicbo_nodes_local1 if { path_beg /local1/sicbo }
    use_backend blackjack_nodes_local1 if { path_beg /local1/blackjack }

    default_backend game_server_nodes_local1

