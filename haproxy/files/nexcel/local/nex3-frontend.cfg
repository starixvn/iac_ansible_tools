frontend l3_frontend
    bind *:7270
    mode  http
    option forwardfor
    use_backend game_server_nodes_local1 if { path_beg /local1/game-server } !{ path_beg /local1/game-server-api }
    use_backend game_server_api_nodes_local1 if { path_beg /local1/game-server-api }
    use_backend sicbo_nodes_local1 if { path_beg /local1/sicbo }
    use_backend blackjack_nodes_local1 if { path_beg /local1/blackjack }

    use_backend game_client_nodes_local1 if { path_beg /local1/game-client }
    # use_backend game_api_nodes_local1 if { path_beg /local1/game-api }
    # use_backend game_auth_api_nodes_local1 if { path_beg /local1/game-auth-api }
    # use_backend game_admin_api_nodes_local1 if { path_beg /local1/game-admin-api }
    use_backend game_admin_site_nodes_local1 if { path_beg /local1/game-admin-site }
    default_backend game_server_nodes_local1

