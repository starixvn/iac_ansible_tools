backend nex3_l3_middle_site_sit
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l3_middle_site_SIT_ 1 l3_middle_site_SIT:5000 check resolvers docker init-addr libc,none

backend nex3_l3_middle_site_uat
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l3_middle_site_UAT_ 1 l3_middle_site_UAT:5000 check resolvers docker init-addr libc,none
    