
frontend nex3_l3_middle_site_sit
    bind *:6012
    mode  http
    use_backend nex3_l3_middle_site_sit

backend nex3_l3_middle_site_sit
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l3_middle_site_SIT_ 2 l3_middle_site_SIT:5000 check resolvers docker init-addr libc,none

frontend nex3_l3_middle_site_uat
    bind *:7012
    mode  http
    use_backend nex3_l3_middle_site_uat

backend nex3_l3_middle_site_uat
