backend nex3_l3_game_client_mini_UAT_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l3_game_client_mini_UAT_ 1 l3_game_client_mini_UAT:80 check resolvers docker init-addr none

