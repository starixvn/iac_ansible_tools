
frontend nex3_l3_api_proxy
    bind *:7000
    mode  http
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/blackjack } ! { path_beg /sit/blackjack/ }
    use_backend nex3_l3_blackjack_nodes_sit if { path_beg /sit/blackjack }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/blackjack } ! { path_beg /uat/blackjack/ }
    use_backend nex3_l3_blackjack_nodes_uat if { path_beg /uat/blackjack/ }

    http-request return status 200 content-type "text/plain" lf-string "Hello, you are: %[src]:7000"


backend nex3_l3_blackjack_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/sit/blackjack/,/)]
    server-template nex3_l3_blackjack_SIT 1 10.2.189.68:6011 check resolvers docker init-addr libc,none

backend nex3_l3_blackjack_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/uat/blackjack/,/)]
    server-template nex3_l3_blackjack_UAT 1 10.2.189.68:7011 check resolvers docker init-addr libc,none