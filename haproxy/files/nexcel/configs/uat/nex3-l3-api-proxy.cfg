
frontend nex3_l3_api_proxy
    bind *:7000
    mode  http
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/main } ! { path_beg /sit/main/ }
    use_backend nex3_l3_game_server_nodes_sit if { path_beg /sit/main }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/main } ! { path_beg /uat/main/ }
    use_backend nex3_l3_game_server_nodes_uat if { path_beg /uat/main }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/blackjack } ! { path_beg /sit/blackjack/ }
    use_backend nex3_l3_blackjack_nodes_sit if { path_beg /sit/blackjack }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/blackjack } ! { path_beg /uat/blackjack/ }
    use_backend nex3_l3_blackjack_nodes_uat if { path_beg /uat/blackjack/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/fishprawncrabpro } ! { path_beg /sit/fishprawncrabpro/ }
    use_backend nex3_l3_fish_prawn_crab_nodes_sit if { path_beg /sit/fishprawncrabpro }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/fishprawncrabpro } ! { path_beg /uat/fishprawncrabpro/ }
    use_backend nex3_l3_fish_prawn_crab_nodes_uat if { path_beg /uat/fishprawncrabpro/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/binarygames } ! { path_beg /sit/binarygames/ }
    use_backend nex3_l3_binary_games_nodes_sit if { path_beg /sit/binarygames }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/binarygames } ! { path_beg /uat/binarygames/ }
    use_backend nex3_l3_binary_games_nodes_uat if { path_beg /uat/binarygames/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/sicbo } ! { path_beg /sit/sicbo/ }
    use_backend nex3_l3_sicbo_nodes_sit if { path_beg /sit/sicbo }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/sicbo } ! { path_beg /uat/sicbo/ }
    use_backend nex3_l3_sicbo_nodes_uat if { path_beg /uat/sicbo/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/baccaratgames } ! { path_beg /sit/baccaratgames/ }
    use_backend nex3_l3_baccarat_games_nodes_sit if { path_beg /sit/baccaratgames }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/baccaratgames } ! { path_beg /uat/baccaratgames/ }
    use_backend nex3_l3_baccarat_games_nodes_uat if { path_beg /uat/baccaratgames/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/dragontiger } ! { path_beg /uat/dragontiger/ }
    use_backend nex3_l3_dragon_tiger_nodes_uat if { path_beg /uat/dragontiger/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/sedie } ! { path_beg /uat/sedie/ }
    use_backend nex3_l3_sedie_nodes_uat if { path_beg /uat/sedie/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/minifishprawncrab } ! { path_beg /uat/minifishprawncrab/ }
    use_backend nex3_l3_mini_fish_prawn_crab_nodes_uat if { path_beg /uat/minifishprawncrab/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/kenopromax } ! { path_beg /uat/kenopromax/ }
    use_backend nex3_l3_keno_pro_max_nodes_uat if { path_beg /uat/kenopromax/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/roulette } ! { path_beg /uat/roulette/ }
    use_backend nex3_l3_roulette_nodes_uat if { path_beg /uat/roulette/ }

    default_backend nex3_l3_blackjack_nodes_sit 

backend nex3_l3_game_server_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/sit/main/,/)]
    server-template l3_game_server_SIT_ 1 l3_game_server_SIT:5000 check resolvers docker init-addr libc,none

