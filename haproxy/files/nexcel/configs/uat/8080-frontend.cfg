frontend http_in
    bind *:8082
    mode http
    option forwardfor

    ###NEX3
    acl nex3_l3_api_proxy_host hdr(host) -i uatproxy.vgamesuat.com

    use_backend nex3_l3_game_client_nodes_sit if { hdr(host) -i sit.vgamesuat.com }
    use_backend nex3_l3_game_client_nodes_uat if { hdr(host) -i uat.vgamesuat.com }
    use_backend nex3_l3_game_client_mini_UAT_nodes if { hdr(host) -i uatmini.vgamesuat.com }
    use_backend nex3_l3_game_client_mini_SIT_nodes if { hdr(host) -i sitmini.vgamesuat.com }

    use_backend nex3_l3_game_api_nodes_sit if { hdr(host) -i sitapi.vgamesuat.com }
    use_backend nex3_l3_game_api_nodes_uat if { hdr(host) -i uatapi.vgamesuat.com }

    use_backend nex3_l3_result_nodes_sit if { hdr(host) -i sitresult.vgamesuat.com }
    use_backend nex3_l3_result_nodes_uat if { hdr(host) -i uatresult.vgamesuat.com }

    use_backend nex3_l3_user_nodes_sit if { hdr(host) -i situser.vgamesuat.com }
    use_backend nex3_l3_user_nodes_uat if { hdr(host) -i uatuser.vgamesuat.com }

    use_backend nex3_l3_middle_site_sit if { hdr(host) -i sitmiddlesite.vgamesuat.com }
    use_backend nex3_l3_middle_site_uat if { hdr(host) -i uatmiddlesite.vgamesuat.com }

    use_backend nex3_l3_middle_site_sit if { hdr(host) -i sitmiddlesite.sabaclub.net }
    use_backend nex3_l3_middle_site_uat if { hdr(host) -i uatmiddlesite.sabaclub.net }

    #use_backend nex3_l3_admin_site_nodes_sit if { hdr(host) -i sitadm.vgamesuat.com }
    #use_backend nex3_l3_admin_site_nodes_uat if { hdr(host) -i uatadm.vgamesuat.com }

   #VG3 Internal using for thirdparty
    use_backend nex3_l3_game_api_nodes_sit if { hdr(host) -i intsitapi.vgamesuat.com }
    use_backend nex3_l3_game_api_nodes_uat if { hdr(host) -i intuatapi.vgamesuat.com }

    use_backend nex3_l3_result_nodes_sit if { hdr(host) -i intsitresult.vgamesuat.com }
    use_backend nex3_l3_result_nodes_uat if { hdr(host) -i intuatresult.vgamesuat.com }

    use_backend nex3_l3_middle_site_sit if { hdr(host) -i intsitmiddlesite.vgamesuat.com }
    use_backend nex3_l3_middle_site_uat if { hdr(host) -i intuatmiddlesite.vgamesuat.com }

    #UAT
    http-request redirect scheme http drop-query append-slash if { path_beg /uat/main } ! { path_beg /uat/main/ }
    use_backend nex3_l3_game_server_nodes_uat if nex3_l3_api_proxy_host { path_beg /uat/main }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/sicbo } ! { path_beg /uat/sicbo/ }
    use_backend nex3_l3_sicbo_nodes_uat if nex3_l3_api_proxy_host { path_beg /uat/sicbo }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/blackjack } ! { path_beg /uat/blackjack/ }
    use_backend nex3_l3_blackjack_nodes_uat if nex3_l3_api_proxy_host { path_beg /uat/blackjack/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/fishprawncrabpro } ! { path_beg /uat/fishprawncrabpro/ }
    use_backend nex3_l3_fish_prawn_crab_nodes_uat if nex3_l3_api_proxy_host { path_beg /uat/fishprawncrabpro/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/binarygames } ! { path_beg /uat/binarygames/ }
    use_backend nex3_l3_binary_games_nodes_uat if nex3_l3_api_proxy_host { path_beg /uat/binarygames/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/baccaratgames } ! { path_beg /uat/baccaratgames/ }
    use_backend nex3_l3_baccarat_games_nodes_uat if nex3_l3_api_proxy_host { path_beg /uat/baccaratgames/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/dragontiger } ! { path_beg /uat/dragontiger/ }
    use_backend nex3_l3_dragon_tiger_nodes_uat if nex3_l3_api_proxy_host { path_beg /uat/dragontiger/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/sedie } ! { path_beg /uat/sedie/ }
    use_backend nex3_l3_sedie_nodes_uat if { path_beg /uat/sedie/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/minifishprawncrab } ! { path_beg /uat/minifishprawncrab/ }
    use_backend nex3_l3_mini_fish_prawn_crab_nodes_uat if { path_beg /uat/minifishprawncrab/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/kenopromax } ! { path_beg /uat/kenopromax/ }
    use_backend nex3_l3_keno_pro_max_nodes_uat if { path_beg /uat/kenopromax/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/roulette } ! { path_beg /uat/roulette/ }
    use_backend nex3_l3_roulette_nodes_uat if { path_beg /uat/roulette/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/casinoholdempoker } ! { path_beg /uat/casinoholdempoker/ }
    use_backend nex3_l3_casino_holdem_poker_nodes_UAT if { path_beg /uat/casinoholdempoker/ }

    #SIT
    http-request redirect scheme http drop-query append-slash if { path_beg /sit/main } ! { path_beg /sit/main/ }
    use_backend nex3_l3_game_server_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/main }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/sicbo } ! { path_beg /sit/sicbo/ }
    use_backend nex3_l3_sicbo_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/sicbo }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/blackjack } ! { path_beg /sit/blackjack/ }
    use_backend nex3_l3_blackjack_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/blackjack }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/fishprawncrabpro } ! { path_beg /sit/fishprawncrabpro/ }
    use_backend nex3_l3_fish_prawn_crab_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/fishprawncrabpro }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/binarygames } ! { path_beg /sit/binarygames/ }
    use_backend nex3_l3_binary_games_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/binarygames }
    
    http-request redirect scheme http drop-query append-slash if { path_beg /sit/baccaratgames } ! { path_beg /sit/baccaratgames/ }
    use_backend nex3_l3_baccarat_games_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/baccaratgames }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/dragontiger } ! { path_beg /sit/dragontiger/ }
    use_backend nex3_l3_dragon_tiger_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/dragontiger }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/sedie } ! { path_beg /sit/sedie/ }
    use_backend nex3_l3_sedie_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/sedie }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/minifishprawncrab } ! { path_beg /sit/minifishprawncrab/ }
    use_backend nex3_l3_mini_fish_prawn_crab_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/minifishprawncrab }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/kenopromax } ! { path_beg /sit/kenopromax/ }
    use_backend nex3_l3_keno_pro_max_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/kenopromax }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/roulette } ! { path_beg /sit/roulette/ }
    use_backend nex3_l3_roulette_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/roulette }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/casinoholdempoker } ! { path_beg /sit/casinoholdempoker/ }
    use_backend nex3_l3_casino_holdem_poker_nodes_SIT if { path_beg /sit/casinoholdempoker/ }
    