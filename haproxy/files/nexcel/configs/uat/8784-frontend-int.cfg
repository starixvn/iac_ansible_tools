frontend http_in_8088
    bind *:8784
    mode http
    option forwardfor

 #VG3
    use_backend nex3_l3_game_api_nodes_sit if { hdr(host) -i intsitapi.vgamesuat.com }
    use_backend nex3_l3_game_api_nodes_uat if { hdr(host) -i intuatapi.vgamesuat.com }

    use_backend nex3_l3_result_nodes_sit if { hdr(host) -i intsitresult.vgamesuat.com }
    use_backend nex3_l3_result_nodes_uat if { hdr(host) -i intuatresult.vgamesuat.com }

    use_backend nex3_l3_middle_site_sit if { hdr(host) -i intsitmiddlesite.vgamesuat.com }
    use_backend nex3_l3_middle_site_uat if { hdr(host) -i intuatmiddlesite.vgamesuat.com }

default_backend default_backend_nodes
