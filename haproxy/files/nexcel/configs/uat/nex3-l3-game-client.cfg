
frontend nex3_l3_game_client_sit
    bind *:5120
    mode  http
    option forwardfor
    default_backend nex3_l3_game_client_nodes_sit

backend nex3_l3_game_client_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l3_game_client_SIT_ 2 l3_game_client_SIT:80 check resolvers docker init-addr libc,none

frontend nex3_l3_game_client_uat
    bind *:7120
    mode  http
    option forwardfor
    default_backend nex3_l3_game_client_nodes_uat

backend nex3_l3_game_client_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l3_game_client_UAT_ 2 l3_game_client_UAT:80 check resolvers docker init-addr libc,none