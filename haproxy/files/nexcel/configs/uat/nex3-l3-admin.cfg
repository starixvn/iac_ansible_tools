frontend l3_admin_site_sit
    bind *:5321
    mode  http
    option forwardfor
    acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    http-request deny if !is-whitelisted-ip
    default_backend nex3_l3_admin_site_nodes_sit

frontend l3_admin_site_sit_1
    bind *:7100
    mode  http
    option forwardfor
    #acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    #http-request deny if !is-whitelisted-ip
    default_backend nex3_l3_admin_site_nodes_sit

backend nex3_l3_admin_site_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 302
    cookie serverid insert
    server-template l3_admin_site_SIT_ 1 l3_admin_site_SIT:5000 check resolvers docker init-addr libc,none

