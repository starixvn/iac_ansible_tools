frontend nex3_l3_user_sit
    bind *:8784
    mode  http
    option forwardfor
    default_backend nex3_l3_user_nodes_sit

backend nex3_l3_user_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 302
    cookie serverid insert
    server-template l3_user_site_SIT_ 2 l3_user_site_SIT:5000 check resolvers docker init-addr libc,none

frontend nex3_l3_user_uat
    bind *:8783
    mode  http
    option forwardfor
    default_backend nex3_l3_user_nodes_uat

backend nex3_l3_user_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 302
    cookie serverid insert
    server-template l3_user_site_UAT_ 2 l3_user_site_UAT:5000 check resolvers docker init-addr libc,none