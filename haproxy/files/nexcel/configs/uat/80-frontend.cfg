frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    #NEXUS
    use_backend nexus_saba_sports_saba_news_site_UAT_nodes if { hdr(host) -i sabanews.starixuat.com }

    #OLYMPUS
    use_backend olympus_nap_settlement_UAT_nodes_1 if { hdr(host) -i napsettlementcore.starixuat.com }
    use_backend olympus_nap_settlement_UAT_nodes_2 if { hdr(host) -i napsettlementcore2.starixuat.com }
    use_backend olympus_nap_prms_UAT_nodes if { hdr(host) -i prmscore.starixuat.com }
    use_backend olympus_owp_netcore_v1_nodes if { hdr(host) -i newowp1.starixuat.com }
    use_backend olympus_owp_netcore_v2_nodes if { hdr(host) -i newowp2.starixuat.com }
    use_backend olympus_owp_netcore_v3_nodes if { hdr(host) -i newowp3.starixuat.com }
    
    #NEX3
    acl nex3_l3_api_proxy_host hdr(host) -i uatproxy.vgaming88.net
    acl nex3_l3_api_proxy_host hdr(host) -i uatproxy.vgaming.club

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/main } ! { path_beg /sit/main/ }
    use_backend nex3_l3_game_server_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/main }
    http-request redirect scheme http drop-query append-slash if { path_beg /uat/main } ! { path_beg /uat/main/ }
    use_backend nex3_l3_game_server_nodes_uat if nex3_l3_api_proxy_host { path_beg /uat/main }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/sicbo } ! { path_beg /sit/sicbo/ }
    use_backend nex3_l3_sicbo_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/sicbo }
    http-request redirect scheme http drop-query append-slash if { path_beg /uat/sicbo } ! { path_beg /uat/sicbo/ }
    use_backend nex3_l3_sicbo_nodes_uat if nex3_l3_api_proxy_host { path_beg /uat/sicbo }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/blackjack } ! { path_beg /sit/blackjack/ }
    use_backend nex3_l3_blackjack_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/blackjack }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/blackjack } ! { path_beg /uat/blackjack/ }
    use_backend nex3_l3_blackjack_nodes_uat if nex3_l3_api_proxy_host { path_beg /uat/blackjack/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/fishprawncrabpro } ! { path_beg /sit/fishprawncrabpro/ }
    use_backend nex3_l3_fish_prawn_crab_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/fishprawncrabpro }
    http-request redirect scheme http drop-query append-slash if { path_beg /uat/fishprawncrabpro } ! { path_beg /uat/fishprawncrabpro/ }
    use_backend nex3_l3_fish_prawn_crab_nodes_uat if nex3_l3_api_proxy_host { path_beg /uat/fishprawncrabpro/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/binarygames } ! { path_beg /sit/binarygames/ }
    use_backend nex3_l3_binary_games_nodes_sit if nex3_l3_api_proxy_host { path_beg /sit/binarygames }
    http-request redirect scheme http drop-query append-slash if { path_beg /uat/binarygames } ! { path_beg /uat/binarygames/ }
    use_backend nex3_l3_binary_games_nodes_uat if nex3_l3_api_proxy_host { path_beg /uat/binarygames/ }

    use_backend nex3_l3_game_client_nodes_sit if { hdr(host) -i sit.vgaming.club }
    use_backend nex3_l3_game_client_nodes_uat if { hdr(host) -i uat.vgaming.club }

    use_backend nex3_l3_game_api_nodes_sit if { hdr(host) -i sitapi.vgaming.club }
    use_backend nex3_l3_game_api_nodes_uat if { hdr(host) -i uatapi.vgaming.club }

    use_backend nex3_l3_result_nodes_sit if { hdr(host) -i sitresult.vgaming.club }
    use_backend nex3_l3_result_nodes_uat if { hdr(host) -i uatresult.vgaming.club }

    use_backend nex3_l3_user_nodes_sit if { hdr(host) -i situser.vgaming.club }
    use_backend nex3_l3_user_nodes_uat if { hdr(host) -i uatuser.vgaming.club }

    use_backend nex3_l3_middle_site_sit if { hdr(host) -i sitmiddlesite.vgaming.club }
    use_backend nex3_l3_middle_site_uat if { hdr(host) -i uatmiddlesite.vgaming.club }

    use_backend nex3_l3_game_client_nodes_sit if { hdr(host) -i sit.vgaming88.net }
    use_backend nex3_l3_game_client_nodes_uat if { hdr(host) -i uat.vgaming88.net }

    use_backend nex3_l3_game_api_nodes_sit if { hdr(host) -i sitapi.vgaming88.net }
    use_backend nex3_l3_game_api_nodes_uat if { hdr(host) -i uatapi.vgaming88.net }

    use_backend nex3_l3_result_nodes_sit if { hdr(host) -i sitresult.vgaming88.net }
    use_backend nex3_l3_result_nodes_uat if { hdr(host) -i uatresult.vgaming88.net }

    use_backend nex3_l3_user_nodes_sit if { hdr(host) -i situser.vgaming88.net }
    use_backend nex3_l3_user_nodes_uat if { hdr(host) -i uatuser.vgaming88.net }

    use_backend nex3_l3_middle_site_sit if { hdr(host) -i sitmiddlesite.vgaming88.net }
    use_backend nex3_l3_middle_site_uat if { hdr(host) -i uatmiddlesite.vgaming88.net }

    use_backend nex3_l3_middle_site_sit if { hdr(host) -i sitmiddlesite.sabaclub.net }
    use_backend nex3_l3_middle_site_uat if { hdr(host) -i uatmiddlesite.sabaclub.net }

