frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    use_backend nexops_deploymentapi_nodes if { hdr(host) -i stdeployapi.starixplay.com }
    #use_backend nexops_portainer_nodes if { hdr(host) -i sbportainer.starixplay.com }
    use_backend default_backend_nodes if { hdr(host) -i haproxy.starixuat.com }
    #NEXUS
    use_backend nexus_saba_sports_saba_news_site_UAT_nodes if { hdr(host) -i sabanews.starixuat.com }

    #ROME
    use_backend rome_intaccounting_UAT_nodes if { hdr(host) -i intnap.starixuat.com }

    #LEGION
    use_backend legion_lap_analytics_api_UAT_1_nodes if { hdr(host) -i lapanalytics1.starixuat.com }
    use_backend legion_lap_ext_UAT_1_nodes if { hdr(host) -i lapext1.starixuat.com }
    use_backend legion_lap_player_admin_UAT_1_nodes if { hdr(host) -i lappa1.starixuat.com }
    use_backend legion_lap_bet_ticket_UAT_1_nodes if { hdr(host) -i lapbt1.starixuat.com }

    #OLYMPUS
    use_backend olympus_nap_settlement_UAT_nodes_1 if { hdr(host) -i napsettlementcore.starixuat.com }
    use_backend olympus_nap_settlement_UAT_nodes_2 if { hdr(host) -i napsettlementcore2.starixuat.com }
    use_backend olympus_nap_settlement_UAT_nodes_3 if { hdr(host) -i napsettlementcore3.starixuat.com }
    use_backend olympus_nap_settlement_UAT_nodes_4 if { hdr(host) -i napsettlementcore4.starixuat.com }
    use_backend olympus_nap_settlement_UAT_nodes_5 if { hdr(host) -i napsettlementcore5.starixuat.com }
    #use_backend default_backend_nodes if { hdr(host) -i napsettlementcore3.starixuat.com }
    #use_backend default_backend_nodes if { hdr(host) -i napsettlementcore4.starixuat.com }
    #use_backend default_backend_nodes if { hdr(host) -i napsettlementcore5.starixuat.com }
    use_backend olympus_nap_prms_UAT_nodes if { hdr(host) -i prmscore.starixuat.com }
    use_backend olympus_owp_netcore_v1_nodes if { hdr(host) -i newowp1.starixuat.com }
    use_backend olympus_owp_netcore_v2_nodes if { hdr(host) -i newowp2.starixuat.com }
    use_backend olympus_owp_netcore_v3_nodes if { hdr(host) -i newowp3.starixuat.com }
    use_backend olympus_nap_aa_UAT_1_nodes if { hdr(host) -i aav1.starixuat.com }
    use_backend olympus_nap_aa_UAT_2_nodes if { hdr(host) -i aav2.starixuat.com }
    
    #SPU
    use_backend spu_nap_main_service_UAT if { hdr(host) -i spumain.starixuat.com }
    use_backend spu_nap_cts_job_service_UAT if { hdr(host) -i spucts.starixuat.com }
    use_backend spu_nap_cts_cc_job_service_UAT if { hdr(host) -i spuctscc.starixuat.com }
    use_backend spu_nap_dcs_job_service_UAT if { hdr(host) -i spudcs.starixuat.com }
    use_backend spu_nap_fs_job_service_UAT if { hdr(host) -i spufs.starixuat.com }
    use_backend spu_nap_vr_job_service_UAT if { hdr(host) -i spuvr.starixuat.com }
    use_backend spu_nap_tgr_job_service_UAT if { hdr(host) -i sputgr.starixuat.com }

    ###NEX3
    acl nex3_l3_api_proxy_host hdr(host) -i uatproxy.vgamesuat.com

    #UAT
    http-request redirect scheme http drop-query append-slash if { path_beg /uat/main } ! { path_beg /uat/main/ }
    use_backend nex3_l3_game_server_nodes_uat if nex3_l3_api_proxy_host { path_beg /uat/main }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/sicbo } ! { path_beg /uat/sicbo/ }
    use_backend nex3_l3_sicbo_nodes_uat if nex3_l3_api_proxy_host { path_beg /uat/sicbo }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/blackjack } ! { path_beg /uat/blackjack/ }
