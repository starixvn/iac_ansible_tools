frontend nex3_l3_game_api_sit
    bind *:5320
    mode  http
    option forwardfor
    default_backend nex3_l3_game_api_nodes_sit

backend nex3_l3_game_api_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l3_game_api_SIT_ 2 l3_game_api_SIT:5000 check resolvers docker init-addr none

frontend nex3_l3_auth_api_sit
    bind *:5323
    mode  http
    option forwardfor
    default_backend nex3_l3_auth_api_nodes_sit

backend nex3_l3_auth_api_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l3_auth_api_SIT_ 1 l3_auth_api_SIT:5000 check resolvers docker init-addr none

