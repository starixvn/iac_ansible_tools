backend nex3_l3_game_api_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 400
    cookie serverid insert
    server-template l3_game_api_SIT_ 1 10.2.189.68:5320 check resolvers docker init-addr libc,none

frontend nex3_l3_game_api_uat
    bind *:7320
    mode  http
    option forwardfor
    default_backend nex3_l3_game_api_nodes_uat

backend nex3_l3_game_api_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l3_game_api_UAT_ 1 l3_game_api_UAT:5000 check resolvers docker init-addr libc,none
    