frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    #NEXUS
    use_backend nexus_saba_sports_saba_news_site_UAT_nodes if { hdr(host) -i sabanews.starixuat.com }

    #OLYMPUS
    use_backend olympus_nap_settlement_UAT_1_nodes if { hdr(host) -i napsettlement.starixuat.com }

    #NEX3
    use_backend nex3_l3_middle_site_sit if { hdr(host) -i sitmiddlesite.sabaclub.net }
    use_backend nex3_l3_middle_site_uat if { hdr(host) -i uatmiddlesite.sabaclub.net }