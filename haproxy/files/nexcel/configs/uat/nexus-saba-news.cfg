frontend nexus_saba_news_UAT_v1
    bind *:7516
    mode  http
    use_backend nexus_saba_news_nodes_UAT_v1

backend nexus_saba_news_nodes_UAT_v1
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template nexus_saba_sports_saba_news_site_UAT_v1 2 nexus_saba_sports_saba_news_site_UAT:5000 check resolvers docker init-addr libc,none

frontend nexus_saba_news_wp_UAT_v1
    bind *:7515
    mode  http
    http-request return status 200 content-type "text/plain" lf-string "Hello, you are: %[src]:7515"
    # use_backend nexus_saba_news_nodes_UAT_v1

