frontend nex3_l3_result_sit
    bind *:8782
    mode  http
    option forwardfor
    default_backend nex3_l3_result_nodes_sit

backend nex3_l3_result_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 302
    cookie serverid insert
    server-template l3_game_result_SIT_ 1 l3_game_result_SIT:5000 check resolvers docker init-addr none

frontend nex3_l3_result_uat
    bind *:8781
    mode  http
    option forwardfor
    default_backend nex3_l3_result_nodes_uat

backend nex3_l3_result_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 302
    cookie serverid insert
    server-template l3_game_result_UAT_ 1 l3_game_result_UAT:5000 check resolvers docker init-addr none
