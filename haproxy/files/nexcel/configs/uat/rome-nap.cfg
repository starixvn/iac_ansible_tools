backend rome_nap_u3_UAT_nodes   
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nap_u3_UAT_ 1 nap_u3_UAT:5000 check resolvers docker init-addr none

backend rome_intaccounting_UAT_nodes
    balance source
    option forwardfor
    option http-server-close
    option httpchk GET /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server-template rome_intaccounting_UAT_nodes1_ 1 10.2.23.6:7400 check
    server-template rome_intaccounting_UAT_nodes2_ 1 10.2.27.16:7400 check backup
