backend l3_admin_site_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l3_admin_site_AWS_ 1 l3_admin_site_AWS:5000 check resolvers docker init-addr libc,none

backend l3_admin_api_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l3_admin_api_AWS_ 1 l3_admin_api_AWS:5000 check resolvers docker init-addr libc,none