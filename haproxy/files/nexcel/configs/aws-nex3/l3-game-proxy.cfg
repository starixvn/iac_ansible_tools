backend l3_game_server_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/main/,/)]
    server-template l3_game_server_AWS_ 1 l3_game_server_AWS:5000 check resolvers docker init-addr none

backend l3_game_server_api_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/apimain/,/)]
    server-template l3_game_server_api_AWS_ 1 l3_game_server_api_AWS:5000 check resolvers docker init-addr none
