backend l3_game_server_nodes
    option forwardfor
    option http-server-close
    #option httpchk GET /
    #http-check expect status 200
    #cookie serverid insert
    http-request set-path %[path,regsub(^/main/,/)]
    http-request return status 200 content-type "text/plain" string "Game Server"
