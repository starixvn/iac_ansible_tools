frontend http_in
    bind *:80
    mode http
    option forwardfor
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    # SC3
    acl l3_api_proxy_host hdr(host) -i sc3-proxy.sportsfun.app

    http-request redirect scheme http drop-query append-slash if l3_api_proxy_host { path_beg /main } ! { path_beg /main/ } !{ path_beg /main } 
    use_backend l3_game_server_nodes if l3_api_proxy_host { path_beg /main }

    use_backend l3_game_client_nodes if { hdr(host) -i sc3-games.sportsfun.app }
    use_backend l3_api_nodes if { hdr(host) -i sc3-api.sportsfun.app }
    use_backend l3_admin_site_nodes if { hdr(host) -i sc3-adm.sportsfun.app }
    use_backend l3_game_round_result_nodes if { hdr(host) -i sc3-result.sportsfun.app } 
    use_backend l3_user_site_nodes if { hdr(host) -i sc3-user.sportsfun.app } 

    default_backend l3_game_client_nodes  

