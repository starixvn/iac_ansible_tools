backend l3_auth_api_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    #http-request return status 200 content-type "text/plain" string "Auth API"
    server-template l3_auth_api_AWS_ 1 l3_auth_api_AWS:5000 check resolvers docker init-addr none
