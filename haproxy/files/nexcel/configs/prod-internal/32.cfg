
### 7 - prodipapi
frontend frontend-prodipapi
bind *:8888 
mode tcp
default_backend backend-prodipapi

backend backend-prodipapi
mode tcp
balance roundrobin

log global
option tcplog
option tcp-check
default-server inter 3s fall 3 rise 10
server 10.40.40.22_tcp_8888 10.40.40.22:8888 check 
server 10.40.70.23_tcp_8888 10.40.70.23:8888 check 

