
###SYSTEM
frontend frontend-redis-cluster
bind *:16379 name redis
mode tcp
default_backend backend-redis-cluster

option tcplog
option tcp-check
backend backend-redis-cluster
option tcp-check
tcp-check connect
tcp-check send AUTH\ foo1@bared\r\n
tcp-check send PING\r\n
tcp-check expect string +PONG
tcp-check send info\ replication\r\n
tcp-check expect string role:master
tcp-check send QUIT\r\n
tcp-check expect string +OK
default-server inter 3s fall 5 rise 5
server 10.2.27.1_6388 10.2.27.1:6388 check inter 5s
server 10.2.27.5_6388 10.2.27.5:6388 check inter 5s
server 10.2.27.7_6388 10.2.27.7:6388 check inter 5s
#server 10.99.99.100_tcp_16379 10.99.99.100:16379 check
#server 10.99.99.66_tcp_16379 10.99.99.66:16379 check

