
### 7 - lbstate
frontend frontend-lbstate
bind *:42432 
mode tcp
default_backend backend-lbstate

backend backend-lbstate
mode tcp
balance source

log global
option tcplog
option tcp-check
default-server inter 3s fall 3 rise 10
server 10.2.27.4_tcp_42424 10.2.27.4:42424 check 
server 10.2.27.1_tcp_42424 10.2.27.1:42424 check 

