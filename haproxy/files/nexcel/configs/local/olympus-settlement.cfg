backend olympus_nap_settlement_LOCAL_1_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template nap_settlement_LOCAL_1_ 2 nap_settlement_LOCAL_1:5000 check resolvers docker init-addr libc,none

