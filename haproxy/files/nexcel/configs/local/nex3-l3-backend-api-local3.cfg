backend nex3_l3_game_server_nodes_local3
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/local3/game-server/,/)]
    server-template game_server_local3 1 10.18.200.134:7892 check resolvers docker init-addr libc,none

