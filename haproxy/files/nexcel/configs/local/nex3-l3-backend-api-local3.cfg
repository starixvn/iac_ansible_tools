backend nex3_l3_game_components_nodes_local3
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/local3/components/,/)]
    server-template l3_game_components_LOCAL_3_ 1 l3_game_components_LOCAL_3:80 check resolvers docker init-addr none

