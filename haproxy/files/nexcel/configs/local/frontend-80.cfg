frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    #NexOps
    use_backend nexops_portainer_nodes if { hdr(host) -i portainer.nexdev.net }
    use_backend nexops_grafana_nodes if { hdr(host) -i mon.nexdev.net }
    use_backend nexops_sentry_modes if { hdr(host) -i sentry.nexdev.net }

    # NEX3 API
    acl nex3_l3_api_proxy_host hdr(host) -i l3-api-proxy.nexdev.net

    # LOCAL1
    http-request redirect scheme http drop-query append-slash if { path_beg /local1/game-server } ! { path_beg /local1/game-server/ } !{ path_beg /local1/game-server-api }
    use_backend nex3_l3_game_server_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/game-server } !{ path_beg /local1/game-server-api }
    
    http-request redirect scheme http drop-query append-slash if { path_beg /local1/game-server-api } ! { path_beg /local1/game-server-api/ }
    use_backend nex3_l3_game_server_api_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/game-server-api }

    http-request redirect scheme http drop-query append-slash if { path_beg /local1/sicbo } ! { path_beg /local1/sicbo/ }
    use_backend nex3_l3_sicbo_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/sicbo }

    http-request redirect scheme http drop-query append-slash if { path_beg /local1/blackjack } ! { path_beg /local1/blackjack/ }
    use_backend nex3_l3_blackjack_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/blackjack }

    http-request redirect scheme http drop-query append-slash if { path_beg /local1/game-api } ! { path_beg /local1/game-api/ }
    use_backend nex3_l3_game_api_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/game-api }

    use_backend nex3_l3_game_auth_api_nodes_local1 if { hdr(host) -i l3-auth-1.nexdev.net }

    http-request redirect scheme http drop-query append-slash if { path_beg /local1/game-admin-api } ! { path_beg /local1/game-admin-api/ }
    use_backend nex3_l3_game_admin_api_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/game-admin-api }

    # LOCAL2
    http-request redirect scheme http drop-query append-slash if { path_beg /local2/game-server } ! { path_beg /local2/game-server/ } !{ path_beg /local2/game-server-api }
    use_backend nex3_l3_game_server_nodes_local2 if nex3_l3_api_proxy_host { path_beg /local2/game-server } !{ path_beg /local2/game-server-api }
    
    http-request redirect scheme http drop-query append-slash if { path_beg /local2/game-server-api } ! { path_beg /local2/game-server-api/ }
    use_backend nex3_l3_game_server_api_nodes_local2 if nex3_l3_api_proxy_host { path_beg /local2/game-server-api }

    http-request redirect scheme http drop-query append-slash if { path_beg /local2/game-api } ! { path_beg /local2/game-api/ }
    use_backend nex3_l3_game_api_nodes_local2 if nex3_l3_api_proxy_host { path_beg /local2/game-api }

    use_backend nex3_l3_game_auth_api_nodes_local2 if { hdr(host) -i l3-auth-2.nexdev.net }

    http-request redirect scheme http drop-query append-slash if { path_beg /local2/game-admin-api } ! { path_beg /local2/game-admin-api/ }
    use_backend nex3_l3_game_admin_api_nodes_local2 if nex3_l3_api_proxy_host { path_beg /local2/game-admin-api }

    http-request redirect scheme http drop-query append-slash if { path_beg /local2/sicbo } ! { path_beg /local2/sicbo/ }
    use_backend nex3_l3_sicbo_nodes_local2 if nex3_l3_api_proxy_host { path_beg /local2/sicbo }

    http-request redirect scheme http drop-query append-slash if { path_beg /local2/blackjack } ! { path_beg /local2/blackjack/ }
    use_backend nex3_l3_blackjack_nodes_local2 if nex3_l3_api_proxy_host { path_beg /local2/blackjack }

    http-request redirect scheme http drop-query append-slash if { path_beg /local2/fishprawncrabpro } ! { path_beg /local2/fishprawncrabpro/ }
    use_backend nex3_l3_fishprawncrabpro_nodes_local2 if nex3_l3_api_proxy_host { path_beg /local2/fishprawncrabpro }
    
    # LOCAL3
    http-request redirect scheme http drop-query append-slash if { path_beg /local3/game-server } ! { path_beg /local3/game-server/ } !{ path_beg /local3/game-server-api }
    use_backend nex3_l3_game_server_nodes_local3 if nex3_l3_api_proxy_host { path_beg /local3/game-server } !{ path_beg /local3/game-server-api }
    
    http-request redirect scheme http drop-query append-slash if { path_beg /local3/game-server-api } ! { path_beg /local3/game-server-api/ }
    use_backend nex3_l3_game_server_api_nodes_local3 if nex3_l3_api_proxy_host { path_beg /local3/game-server-api }

    http-request redirect scheme http drop-query append-slash if { path_beg /local3/sicbo } ! { path_beg /local3/sicbo/ }
    use_backend nex3_l3_sicbo_nodes_local3 if nex3_l3_api_proxy_host { path_beg /local3/sicbo }

    http-request redirect scheme http drop-query append-slash if { path_beg /local3/blackjack } ! { path_beg /local3/blackjack/ }
    use_backend nex3_l3_blackjack_nodes_local3 if nex3_l3_api_proxy_host { path_beg /local3/blackjack }

    http-request redirect scheme http drop-query append-slash if { path_beg /local3/game-api } ! { path_beg /local3/game-api/ }
    use_backend nex3_l3_game_api_nodes_local3 if nex3_l3_api_proxy_host { path_beg /local3/game-api }

    use_backend nex3_l3_game_auth_api_nodes_local3 if { hdr(host) -i l3-auth-3.nexdev.net }

    http-request redirect scheme http drop-query append-slash if { path_beg /local3/game-admin-api } ! { path_beg /local3/game-admin-api/ }
    use_backend nex3_l3_game_admin_api_nodes_local3 if nex3_l3_api_proxy_host { path_beg /local3/game-admin-api }
    
    # NEX3 SITES
    use_backend nex3_l3_game_client_nodes_local1 if { hdr(host) -i l3-games-1.nexdev.net }
    use_backend nex3_l3_game_admin_site_nodes_local1 if { hdr(host) -i l3-admin-1.nexdev.net }
    use_backend nex3_l3_game_lobby_nodes_local1 if { hdr(host) -i l3-lobby-1.nexdev.net }
    use_backend nex3_l3_ow_api_nodes_local1 if { hdr(host) -i l3-ow-api-1.nexdev.net }
    use_backend nex3_l3_round_result_nodes_local1 if { hdr(host) -i l3-result-1.nexdev.net }
    use_backend nex3_l3_user_nodes_local1 if { hdr(host) -i l3-user-1.nexdev.net }

    use_backend nex3_l3_game_client_nodes_local2 if { hdr(host) -i l3-games-2.nexdev.net }
    use_backend nex3_l3_game_admin_site_nodes_local2 if { hdr(host) -i l3-admin-2.nexdev.net }
    use_backend nex3_l3_game_lobby_nodes_local2 if { hdr(host) -i l3-lobby-2.nexdev.net }
    use_backend nex3_l3_ow_api_nodes_local2 if { hdr(host) -i l3-ow-api-2.nexdev.net }
    use_backend nex3_l3_round_result_nodes_local2 if { hdr(host) -i l3-result-2.nexdev.net }
    use_backend nex3_l3_user_nodes_local2 if { hdr(host) -i l3-user-2.nexdev.net }

    use_backend nex3_l3_game_client_nodes_local3 if { hdr(host) -i l3-games-3.nexdev.net }
    use_backend nex3_l3_game_admin_site_nodes_local3 if { hdr(host) -i l3-admin-3.nexdev.net }
    use_backend nex3_l3_game_lobby_nodes_local3 if { hdr(host) -i l3-lobby-3.nexdev.net }
    use_backend nex3_l3_ow_api_nodes_local3 if { hdr(host) -i l3-ow-api-3.nexdev.net }
    use_backend nex3_l3_round_result_nodes_local3 if { hdr(host) -i l3-result-3.nexdev.net }
    use_backend nex3_l3_user_nodes_local3 if { hdr(host) -i l3-user-3.nexdev.net }
 
    #Nexus
    use_backend nexus_saba_sports_saba_news_wp_nodes if { hdr(host) -i saba-reports.nexdev.net }
    use_backend nexus_saba_sports_saba_news_upload_nodes if { hdr(host) -i saba-reports-upload.nexdev.net }
    use_backend nexus_saba_sports_saba_news_site if { hdr(host) -i saba-news-v1.nexdev.net }

    #Legion
    use_backend legion_n88_nodes if { hdr(host) -i n88.nexdev.net }

    #Olympus
    use_backend olympus_prms_nodes if { hdr(host) -i prms.nexdev.net }
    use_backend olympus_owp_nodes if { hdr(host) -i owp.nexdev.net }

    use_backend olympus_prms_netcore_v1_nodes if { hdr(host) -i prms-netcore-v1.nexdev.net }
    use_backend olympus_prms_netcore_v2_nodes if { hdr(host) -i prms-netcore-v2.nexdev.net }
    use_backend olympus_prms_netcore_v3_nodes if { hdr(host) -i prms-netcore-v3.nexdev.net }

    use_backend olympus_owp_netcore_v1_nodes if { hdr(host) -i owp-netcore-v1.nexdev.net }
    use_backend olympus_owp_netcore_v2_nodes if { hdr(host) -i owp-netcore-v2.nexdev.net }
    use_backend olympus_owp_netcore_v3_nodes if { hdr(host) -i owp-netcore-v3.nexdev.net }