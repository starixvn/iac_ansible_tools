backend olympus_nap_api_nodes
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /swagger/ui/index
    http-check expect status 200
    balance roundrobin
    cookie serverid insert
    server-template olympus_nap_api_nodes1_ 1 10.18.200.103:1711 
    server-template olympus_nap_api_nodes2_ 1 10.18.200.104:1711 

backend olympus_nap_parlayrms_nodes
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
