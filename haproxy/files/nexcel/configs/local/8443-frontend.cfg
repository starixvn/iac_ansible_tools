frontend https_in_8001
    bind *:8001 ssl crt /usr/local/etc/haproxy/licbot.nexdev.net.pem alpn h2,http/1.1 crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1 crt /usr/local/etc/haproxy/nexcel.vn.pem alpn h2,http/1.1
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }

    use_backend nexus_ncb_endpoint if { hdr(host) -i licbot.nexdev.net:8001 }

frontend https_in_8443
    bind *:8443 ssl crt /usr/local/etc/haproxy/licbot.nexdev.net.pem alpn h2,http/1.1 crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1 crt /usr/local/etc/haproxy/nexcel.vn.pem alpn h2,http/1.1
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }

    #nexus
    use_backend nexus_ncb_endpoint if { hdr(host) -i licbot.nexdev.net:8443 }


backend default_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me" #if { path_beg /whoami }
