
backend nex3_l3_game_admin_api_nodes_local2
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/local2/game-admin-api/,/)]
    server-template admin_api_local2_ 1 l3_admin_api_LOCAL_2:5000 check resolvers docker init-addr libc,none

