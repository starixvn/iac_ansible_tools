backend nex3_l3_game_components_nodes_local2
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/local2/components/,/)]
    server-template l3_game_components_LOCAL_2_ 1 l3_game_components_LOCAL_2:80 check resolvers docker init-addr none

