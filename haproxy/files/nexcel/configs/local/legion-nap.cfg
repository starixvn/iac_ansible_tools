backend sparta_nap_lm_nodes
    option forwardfor
    timeout server 10m
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    cookie serverid insert
    server-template sparta_nap_lm_nodes1_ 1 10.18.200.202:7603 check resolvers docker init-addr libc,none
    server-template sparta_nap_lm_nodes2_ 1 10.18.200.209:7603 check resolvers docker init-addr libc,none

