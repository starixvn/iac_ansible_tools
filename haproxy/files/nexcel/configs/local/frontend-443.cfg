frontend http_in
    bind *:443 ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }

    #Nexus
    use_backend nexus_saba_reports_nodes if { hdr(host) -i saba-reports.nexdev.net }
    use_backend nexus_saba_news_v1_nodes if { hdr(host) -i saba-news-v1.nexdev.net }
    use_backend nexus_saba_news_v2_nodes if { hdr(host) -i saba-news-v2.nexdev.net }
    use_backend nexus_saba_news_v3_nodes if { hdr(host) -i saba-news-v3.nexdev.net }