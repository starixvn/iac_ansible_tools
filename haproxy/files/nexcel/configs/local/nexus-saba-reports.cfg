backend nexus_saba_reports_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template saba_reports 2 wp_wordpress:80 check resolvers docker init-addr libc,none

backend nexus_saba_reports_upload_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template nexus_saba_reports_upload1 1 10.18.200.138:7519 check resolvers docker init-addr libc,none
    server-template nexus_saba_reports_upload2 1 10.18.200.139:7519 check resolvers docker init-addr libc,none