backend nexops_deploymentapi_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server-template nexops_deployment_api_ 6 nexops_deployment_api:22222 check resolvers docker init-addr none

backend nexops_sonar_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /about
    http-check expect status 200
    cookie serverid insert
    server-template nexops_sonar 2 sonar_web:9000 check resolvers docker init-addr none
