frontend nexops_zabbix_server
    bind :10051
    mode tcp
    default_backend nexops_zabbix_server_nodes
backend nexops_zabbix_server_nodes
    mode tcp
    server zabbix_server 10.18.200.145:10055 check
    #server-template zabbix_server 1 10.18.200.145:10051 check resolvers docker init-addr libc,none

backend nexops_zabbix_webserver
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template zabbix_webserver 1 zb_zabbix-web-nginx-pgsql:8080 check resolvers docker init-addr libc,none

backend nexops_portainer_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template portainer 1 portainer_portainer:9000 resolvers docker init-addr libc,none

backend nexops_grafana_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template grafana 1 10.18.200.131:3000 resolvers docker init-addr libc,none

backend nexops_registry_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template registry 1 10.18.200.131:3000 resolvers docker init-addr libc,none