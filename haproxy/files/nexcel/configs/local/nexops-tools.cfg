listen zabbix_server
    bind :10051 # accept-proxy ssl strict-sni crt haproxy-certs

    mode tcp
    option tcplog
    option tcp-check
    server-template zabbix 1 zb_zabbix-server:10051 check resolvers docker init-addr libc,none

backend nexops_portainer_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template portainer 1 portainer_portainer:9000 resolvers docker init-addr libc,none

backend nexops_grafana_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template grafana 1 10.18.200.131:3000 resolvers docker init-addr libc,none

backend nexops_registry_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template registry 1 10.18.200.131:3000 resolvers docker init-addr libc,none