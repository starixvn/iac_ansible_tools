backend default_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "Empty backend! Pls contact NexOps if you think this is a mistake." #if { path_beg /whoami }

frontend nexops_rabbitmq_frontend
    bind *:5672
    mode tcp
    option tcp-check
    option tcplog
    use_backend nexops_rabbitmq_nodes

backend nexops_rabbitmq_nodes
    mode tcp
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template rabbitmq_node_ 2 rabbitmq_rabbit:5672 check resolvers docker init-addr none

backend nexops_rabbitmq_admin_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template rabbitmq_admin_node_ 2 rabbitmq_rabbit:15672 check resolvers docker init-addr none

frontend nexops_rabbitmq_rocketor_frontend
    bind *:5679
    mode tcp
    option tcp-check
    option tcplog
    use_backend nexops_rabbitmq_rocketor_backend

backend nexops_rabbitmq_rocketor_backend
    mode tcp
    option tcplog
    option tcp-check
    server 10.18.200.122_tcp_5672 10.18.200.122:5672 check
    server 10.18.200.123_tcp_5672 10.18.200.123:5672 check backup

backend nexops_bot_backend
    mode http
    option httplog
    option forwardfor
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    server 10.18.200.122_http_6969 10.18.200.122:6969 check
    server 10.18.200.123_http_6969 10.18.200.123:6969 check
