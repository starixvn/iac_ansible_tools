backend nexops_sentry_modes
    option forwardfor
    option http-server-close
    option httpchk HEAD /account/recover/
    http-check expect status 200
    cookie serverid insert
    server-template nexops_sentry_ 1 sentry_sentry-web:9000 check resolvers docker init-addr libc,none

backend nexops_zabbix_webserver
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template zabbix_webserver 1 zb_zabbix-web-nginx-pgsql:8080 check resolvers docker init-addr libc,none

