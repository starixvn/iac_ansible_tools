backend olympus_devnotes_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    balance source
    cookie serverid insert
    server-template olympus_owp1 1 10.18.200.202:7253 check resolvers docker init-addr libc,none
    server-template olympus_owp2 1 10.18.200.209:7253 check resolvers docker init-addr libc,none