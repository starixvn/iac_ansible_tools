frontend olumpus_owp
    bind *:7304 ssl crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1
    mode  http
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    default_backend olumpus_owp_nodes

backend olumpus_owp_netcore_v1_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template olumpus_netcore_owp_v1_ 1 10.18.200.143:7360 check resolvers docker init-addr libc,none

backend olumpus_owp_netcore_v2_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template olumpus_owp_netcore_v2_ 1 10.18.200.143:7361 check resolvers docker init-addr libc,none

backend olumpus_owp_netcore_v3_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template olumpus_owp_netcore_v3_ 1 10.18.200.143:7362 check resolvers docker init-addr libc,none