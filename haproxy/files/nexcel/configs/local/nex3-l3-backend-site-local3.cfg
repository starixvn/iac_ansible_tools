backend nex3_l3_game_client_nodes_local3
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template game_client_local3_ 1 l3_game_client_LOCAL_3:80 check resolvers docker init-addr libc,none

