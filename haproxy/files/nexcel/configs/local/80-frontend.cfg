    use_backend nex3_l3_game_client_nodes_local3 if { hdr(host) -i l3-games-3.nexdev.net }
    use_backend nex3_l3_game_admin_site_nodes_local3 if { hdr(host) -i l3-admin-3.nexdev.net }
    use_backend nex3_l3_game_lobby_nodes_local3 if { hdr(host) -i l3-lobby-3.nexdev.net }
    use_backend nex3_l3_ow_api_nodes_local3 if { hdr(host) -i l3-ow-api-3.nexdev.net }
    use_backend nex3_l3_round_result_nodes_local3 if { hdr(host) -i l3-result-3.nexdev.net }
    use_backend nex3_l3_user_nodes_local3 if { hdr(host) -i l3-user-3.nexdev.net }
    use_backend nex3_l3_middle_site_nodes_local3 if { hdr(host) -i l3-middle-site-3.nexdev.net }
 
    #Nexus
    use_backend nexus_saba_sports_saba_news_wp_nodes if { hdr(host) -i saba-reports.nexdev.net }
    use_backend nexus_saba_sports_saba_news_upload_nodes if { hdr(host) -i saba-reports-upload.nexdev.net }
    use_backend nexus_saba_sports_saba_news_site if { hdr(host) -i saba-news-v1.nexdev.net }
    use_backend nexus_saba_sports_saba_news_site_1 if { hdr(host) -i saba-news-v2.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i info.nexcel.vn }
    http-request redirect scheme https if { hdr(host) -i ncb-main.nexdev.net  }
    http-request redirect scheme https if { hdr(host) -i licbot.nexdev.net  }
    
    #Legion
    use_backend legion_n88_nodes if { hdr(host) -i n88.nexdev.net }

    #SPU
    use_backend nap_spu_main_service_LOCAL_nodes if { hdr(host) -i spu-main.nexdev.net }
    use_backend nap_spu_cts_job_service_LOCAL_nodes if { hdr(host) -i spu-cts-job.nexdev.net }
    use_backend nap_spu_dcs_job_service_LOCAL_nodes if { hdr(host) -i spu-dcs-job.nexdev.net }
    use_backend nap_spu_fs_job_service_LOCAL_nodes if { hdr(host) -i spu-fs-job.nexdev.net }
    use_backend nap_spu_vr_job_service_LOCAL_nodes if { hdr(host) -i spu-vr-job.nexdev.net }
    
    #Olympus
    use_backend olympus_nap_settlement_nodes if { hdr(host) -i settlement.nexdev.net }
    use_backend olympus_prms_nodes if { hdr(host) -i prms.nexdev.net }
    use_backend olympus_owp_nodes if { hdr(host) -i owp.nexdev.net }
    use_backend olympus_devnotes_nodes if { hdr(host) -i devnotes.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i devnotes.nexdev.net }

    use_backend olympus_prms_netcore_v1_nodes if { hdr(host) -i prms-netcore-v1.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i prms-core.nexdev.net }

    use_backend olympus_owp_netcore_v1_nodes if { hdr(host) -i owp-netcore-v1.nexdev.net }
    use_backend olympus_owp_netcore_v2_nodes if { hdr(host) -i owp-netcore-v2.nexdev.net }

    use_backend olympus_nap_settlement_LOCAL_1_nodes if { hdr(host) -i settlement-netcore-v1.nexdev.net }
    use_backend olympus_nap_settlement_LOCAL_2_nodes if { hdr(host) -i settlement-netcore-v2.nexdev.net }
    use_backend olympus_nap_settlement_LOCAL_3_nodes if { hdr(host) -i settlement-netcore-v3.nexdev.net }