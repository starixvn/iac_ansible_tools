    use_backend nex3_l3_game_auth_api_nodes_local2 if { hdr(host) -i l3-auth-2.nexdev.net }

    http-request redirect scheme http drop-query append-slash if { path_beg /local2/game-admin-api } ! { path_beg /local2/game-admin-api/ }
    use_backend nex3_l3_game_admin_api_nodes_local2 if nex3_l3_api_proxy_host { path_beg /local2/game-admin-api }

    http-request redirect scheme http drop-query append-slash if { path_beg /local2/sicbo } ! { path_beg /local2/sicbo/ }
    use_backend nex3_l3_sicbo_nodes_local2 if nex3_l3_api_proxy_host { path_beg /local2/sicbo }

    http-request redirect scheme http drop-query append-slash if { path_beg /local2/blackjack } ! { path_beg /local2/blackjack/ }
    use_backend nex3_l3_blackjack_nodes_local2 if nex3_l3_api_proxy_host { path_beg /local2/blackjack }

    http-request redirect scheme http drop-query append-slash if { path_beg /local2/fishprawncrabpro } ! { path_beg /local2/fishprawncrabpro/ }
    use_backend nex3_l3_fishprawncrabpro_nodes_local2 if nex3_l3_api_proxy_host { path_beg /local2/fishprawncrabpro }

    http-request redirect scheme http drop-query append-slash if { path_beg /local2/binarygames } ! { path_beg /local2/binarygames/ }
    use_backend nex3_l3_binary_games_nodes_local2 if nex3_l3_api_proxy_host { path_beg /local2/binarygames }

    http-request redirect scheme http drop-query append-slash if { path_beg /local2/baccaratgames } ! { path_beg /local2/baccaratgames/ }
    use_backend nex3_l3_baccarat_games_nodes_local2 if nex3_l3_api_proxy_host { path_beg /local2/baccaratgames }
    
    # LOCAL3
    http-request redirect scheme http drop-query append-slash if { path_beg /local3/game-server } ! { path_beg /local3/game-server/ } !{ path_beg /local3/game-server-api }
    use_backend nex3_l3_game_server_nodes_local3 if nex3_l3_api_proxy_host { path_beg /local3/game-server } !{ path_beg /local3/game-server-api }
    
    http-request redirect scheme http drop-query append-slash if { path_beg /local3/game-server-api } ! { path_beg /local3/game-server-api/ }
    use_backend nex3_l3_game_server_api_nodes_local3 if nex3_l3_api_proxy_host { path_beg /local3/game-server-api }

    http-request redirect scheme http drop-query append-slash if { path_beg /local3/sicbo } ! { path_beg /local3/sicbo/ }
    use_backend nex3_l3_sicbo_nodes_local3 if nex3_l3_api_proxy_host { path_beg /local3/sicbo }

