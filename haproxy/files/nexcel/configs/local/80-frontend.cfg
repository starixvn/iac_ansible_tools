frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX
    ###
    use_backend %[path,map_beg(/etc/haproxy/vg3-game-proxy.map)] if { hdr(host) -i l3-api-proxy.nexdev.net }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/hosts.map)]

default_backend default_backend_nodes