frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    #NexOps
    use_backend nexops_portainer_nodes if { hdr(host) -i portainer.nexdev.net }
    use_backend nexops_grafana_nodes if { hdr(host) -i mon.nexdev.net }
    use_backend nexops_sentry_nodes if { hdr(host) -i sentry.nexdev.net }
    use_backend nexops_sonar_nodes if { hdr(host) -i sonarqube.nexdev.net }

    # NEX3 API
    acl nex3_l3_api_proxy_host hdr(host) -i l3-api-proxy.nexdev.net

    # LOCAL1
    http-request redirect scheme http drop-query append-slash if { path_beg /local1/game-server } ! { path_beg /local1/game-server/ } !{ path_beg /local1/game-server-api }
    use_backend nex3_l3_game_server_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/game-server } !{ path_beg /local1/game-server-api }
    
    http-request redirect scheme http drop-query append-slash if { path_beg /local1/game-server-api } ! { path_beg /local1/game-server-api/ }
    use_backend nex3_l3_game_server_api_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/game-server-api }

    http-request redirect scheme http drop-query append-slash if { path_beg /local1/sicbo } ! { path_beg /local1/sicbo/ }
    use_backend nex3_l3_sicbo_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/sicbo }

    http-request redirect scheme http drop-query append-slash if { path_beg /local1/blackjack } ! { path_beg /local1/blackjack/ }
    use_backend nex3_l3_blackjack_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/blackjack }

    http-request redirect scheme http drop-query append-slash if { path_beg /local1/game-api } ! { path_beg /local1/game-api/ }
    use_backend nex3_l3_game_api_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/game-api }

    use_backend nex3_l3_game_auth_api_nodes_local1 if { hdr(host) -i l3-auth-1.nexdev.net }

    http-request redirect scheme http drop-query append-slash if { path_beg /local1/game-admin-api } ! { path_beg /local1/game-admin-api/ }
    use_backend nex3_l3_game_admin_api_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/game-admin-api }

    http-request redirect scheme http drop-query append-slash if { path_beg /local1/fishprawncrabpro } ! { path_beg /local1/fishprawncrabpro/ }
    use_backend nex3_l3_fishprawncrabpro_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/fishprawncrabpro }

    http-request redirect scheme http drop-query append-slash if { path_beg /local1/binarygames } ! { path_beg /local1/binarygames/ }
    use_backend nex3_l3_binary_games_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/binarygames }

    http-request redirect scheme http drop-query append-slash if { path_beg /local1/baccaratgames } ! { path_beg /local1/baccaratgames/ }
    use_backend nex3_l3_baccarat_games_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/baccaratgames }

    # LOCAL2
    http-request redirect scheme http drop-query append-slash if { path_beg /local2/game-server } ! { path_beg /local2/game-server/ } !{ path_beg /local2/game-server-api }
    use_backend nex3_l3_game_server_nodes_local2 if nex3_l3_api_proxy_host { path_beg /local2/game-server } !{ path_beg /local2/game-server-api }
    
