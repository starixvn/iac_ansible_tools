backend nap_spu_main_service_LOCAL_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template nap_spu_main_service_LOCAL_ 1 nap_spu_main_service_LOCAL:5000 check resolvers docker init-addr libc,none

