frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/licbot.nexdev.net.pem alpn h2,http/1.1 crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1 crt /usr/local/etc/haproxy/nexcel.vn.pem alpn h2,http/1.1
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    #Nexops
    use_backend nexops_portainer_nodes if { hdr(host) -i portainer.nexdev.net }
    use_backend nexops_grafana_nodes if { hdr(host) -i mon.nexdev.net }
    use_backend nexops_zabbix_webserver if { hdr(host) -i zabbix.nexdev.net }
    use_backend nexops_sentry_nodes if { hdr(host) -i sentry.nexdev.net }
    use_backend nexops_sonar_nodes if { hdr(host) -i sonarqube.nexdev.net }
    use_backend nexops_deploymentapi_nodes if { hdr(host) -i deploymentapi.nexdev.net }

    #Nexus
    use_backend nexus_saba_sports_saba_news_wp_nodes if { hdr(host) -i saba-reports.nexdev.net }
    use_backend nexus_saba_sports_saba_news_upload_nodes if { hdr(host) -i saba-reports-upload.nexdev.net }
    use_backend nexus_saba_sports_saba_news_site if { hdr(host) -i saba-news-v1.nexdev.net }
    use_backend nexus_saba_sports_saba_news_site_1 if { hdr(host) -i saba-news-v2.nexdev.net }
    use_backend nexus_nexcel_info_site if { hdr(host) -i info.nexcel.vn }
    use_backend nexus_ncb_main_LOCAL if { hdr(host) -i ncb-main.nexdev.net }
    use_backend nexus_ncb_main_LOCAL_1 if { hdr(host) -i ncb-main1.nexdev.net }
    use_backend nexus_ncb_main_LOCAL_2 if { hdr(host) -i ncb-main2.nexdev.net }
    use_backend nexus_ncb_main_LOCAL_3 if { hdr(host) -i ncb-main3.nexdev.net }
    use_backend nexus_ncb_endpoint_LOCAL if { hdr(host) -i licbot.nexdev.net }
    use_backend nexus_ncb_endpoint_LOCAL_1 if { hdr(host) -i licbot2.nexdev.net }
    use_backend nexus_redmine_nodes_LOCAL if { hdr(host) -i rm.nexdev.net }
    use_backend nexus_redmine_nodes_PROD if { hdr(host) -i rm-pro.nexdev.net }
    use_backend nexus_redmine_nodes_PROD_OLD if { hdr(host) -i rm-old.nexdev.net }
    use_backend nexus_redmine_nodes_PROD if { hdr(host) -i nexdev.net }
    use_backend nexus_redmine_nodes_PROD_bk if { hdr(host) -i rm-bk.nexdev.net }
    use_backend nexus_thor_api_LOCAL if { hdr(host) -i thor-api.nexdev.net }
    use_backend nexus_thor_api_LOCAL_1 if { hdr(host) -i thor-api1.nexdev.net }
    use_backend nexus_qland_nodes if { hdr(host) -i qland.nexdev.net }


    #Legion
    use_backend legion_aff_n88_nodes if { hdr(host) -i n88.nexdev.net }
    use_backend legion_lap_analytics_nodes1 if { hdr(host) -i lap-analytics1.nexdev.net }
    use_backend legion_lap_report_nodes1 if { hdr(host) -i lap-report1.nexdev.net }
    use_backend legion_lap_ext_nodes1 if { hdr(host) -i lap-ext1.nexdev.net }
    use_backend legion_lap_identity_server_nodes if { hdr(host) -i lap-identityserver.nexdev.net }
    use_backend legion_lap_identity_server_nodes1 if { hdr(host) -i lap-identityserver1.nexdev.net }
    use_backend legion_lap_player_admin_nodes if { hdr(host) -i lap-playeradmin.nexdev.net }
    use_backend legion_lap_player_admin_nodes1 if { hdr(host) -i lap-playeradmin1.nexdev.net }
    use_backend legion_lap_bet_ticket_nodes if { hdr(host) -i lap-betticket.nexdev.net }
    use_backend legion_lap_bet_ticket_nodes1 if { hdr(host) -i lap-betticket1.nexdev.net }

    #Olympus
    use_backend olympus_prms_nodes if { hdr(host) -i prms.nexdev.net }
    use_backend olympus_owp_nodes if { hdr(host) -i owp.nexdev.net }
    use_backend olympus_devnotes_nodes if { hdr(host) -i devnotes.nexdev.net }
    
    use_backend olympus_prms_netcore_v1_nodes if { hdr(host) -i prms-netcore-v1.nexdev.net }
    use_backend olympus_prms_netcore_nodes if { hdr(host) -i prms-core.nexdev.net }
    # use_backend olympus_prms_netcore_v3_nodes if { hdr(host) -i prms-netcore-v3.nexdev.net }

    use_backend olympus_owp_netcore_v1_nodes if { hdr(host) -i owp-netcore-v1.nexdev.net }
    use_backend olympus_owp_netcore_v2_nodes if { hdr(host) -i owp-netcore-v2.nexdev.net }
    use_backend olympus_owp_netcore_v3_nodes if { hdr(host) -i owp-netcore-v3.nexdev.net }

    use_backend olympus_nap_settlement_nodes if { hdr(host) -i settlement.nexdev.net }
    use_backend olympus_nap_settlement_LOCAL_1_nodes if { hdr(host) -i settlement-netcore-v1.nexdev.net }
    use_backend olympus_nap_settlement_LOCAL_2_nodes if { hdr(host) -i settlement-netcore-v2.nexdev.net }
    use_backend olympus_nap_settlement_LOCAL_3_nodes if { hdr(host) -i settlement-netcore-v3.nexdev.net }

    use_backend olympus_aa_LOCAL_nodes if { hdr(host) -i aa.nexdev.net }
    use_backend olympus_aa_LOCAL_nodes_1 if { hdr(host) -i aa-v1.nexdev.net }
    use_backend olympus_aa_LOCAL_nodes_2 if { hdr(host) -i aa-v2.nexdev.net }

     use_backend olympus_nap_special_delete_nodes if { hdr(host) -i specialdelete.nexdev.net }

    #SPU
    use_backend nap_spu_main_service_LOCAL_nodes if { hdr(host) -i spu-main.nexdev.net }
    use_backend nap_spu_cts_job_service_LOCAL_nodes if { hdr(host) -i spu-cts-job.nexdev.net }
    use_backend nap_spu_dcs_job_service_LOCAL_nodes if { hdr(host) -i spu-dcs-job.nexdev.net }
    use_backend nap_spu_fs_job_service_LOCAL_nodes if { hdr(host) -i spu-fs-job.nexdev.net }
    use_backend nap_spu_vr_job_service_LOCAL_nodes if { hdr(host) -i spu-vr-job.nexdev.net }
    use_backend nap_spu_tgr_job_service_LOCAL_nodes if { hdr(host) -i spu-tgr-job.nexdev.net }
    use_backend nap_spu_cts_cc_job_service_LOCAL_nodes if { hdr(host) -i spu-cts-cc-job.nexdev.net }
    use_backend nap_spu_cts_cc_job_service_LOCAL_1_nodes if { hdr(host) -i spu-cts-cc-job-v1.nexdev.net }
    use_backend nap_spu_cts_cc_job_service_LOCAL_2_nodes if { hdr(host) -i spu-cts-cc-job-v2.nexdev.net }

    #ROME
    use_backend rome_nap_u3_nodes if { hdr(host) -i nap-u3.nexdev.net }

    #NEX3 API
    acl nex3_l3_api_proxy_host hdr(host) -i l3-api-proxy.nexdev.net

    #NEX3
    http-request redirect scheme http drop-query append-slash if { path_beg /local1/casinoholdempoker } ! { path_beg /local1/casinoholdempoker/ }
    use_backend nex3_l3_casino_holdem_poker_nodes_local1 if nex3_l3_api_proxy_host { path_beg /local1/casinoholdempoker }


