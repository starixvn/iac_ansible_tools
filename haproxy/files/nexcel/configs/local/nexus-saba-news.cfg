    option http-server-close
    option httpchk GET /whoami
    http-check expect status 200
    cookie serverid insert
    server-template saba_sports_saba_news_site_LOCAL_1_ 2 saba_sports_saba_news_site_LOCAL_1:5000 check resolvers docker init-addr libc,none

