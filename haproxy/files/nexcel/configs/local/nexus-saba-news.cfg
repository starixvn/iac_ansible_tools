    server-template nexus_saba_sports_news_nodes1_ 1 10.18.200.138:7516 check resolvers docker init-addr libc,none
    server-template nexus_saba_sports_news_nodes2_ 1 10.18.200.139:7516 check resolvers docker init-addr libc,none