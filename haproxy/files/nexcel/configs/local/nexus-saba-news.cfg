backend nexus_saba_sports_saba_news_site
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami
    http-check expect status 200
    cookie serverid insert
    server-template nexus_saba_sports_saba_news_site_ 2 saba_sports_saba_news_site_LOCAL:5000 check resolvers docker init-addr libc,none


backend nexus_saba_sports_saba_news_site_1
