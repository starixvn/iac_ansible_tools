backend nexus_saba_news_v1_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template saba_news_v1_ 2 saba-news_v1:80 check resolvers docker init-addr libc,none

