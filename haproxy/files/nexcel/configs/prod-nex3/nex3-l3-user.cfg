frontend nex3_l3_user_prod
    bind *:9325
    mode  http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    default_backend nex3_l3_user_nodes_prod

backend nex3_l3_user_nodes_prod
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 302
    cookie serverid insert
    server-template l3_user_site_PROD_ 3 l3_user_site_PROD:5000 check resolvers docker init-addr none
