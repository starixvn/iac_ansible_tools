
frontend nex3_l3_api_proxy
    bind *:8000
    mode  http
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    use_backend nex3_l3_blackjack_nodes if { path_beg /blackjack/ }

backend nex3_l3_blackjack_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /blackjack/(.*) /\1
    server-template nex3_l3_blackjack 1 10.2.189.67:8011 check resolvers docker init-addr libc,none