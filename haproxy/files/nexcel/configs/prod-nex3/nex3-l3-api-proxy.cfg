
frontend nex3_l3_api_proxy
    bind *:8000
    mode  http
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    http-request redirect scheme http drop-query append-slash if { path_beg /main } ! { path_beg /main/ }
    use_backend nex3_l3_game_server_nodes if { path_beg /main }

    http-request redirect scheme http drop-query append-slash if { path_beg /blackjack } ! { path_beg /blackjack/ }
    use_backend nex3_l3_blackjack_nodes if { path_beg /blackjack/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /fishprawncrabpro } ! { path_beg /fishprawncrabpro/ }
    use_backend nex3_l3_fishprawncrabpro_nodes if { path_beg /fishprawncrabpro/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /binarygames } ! { path_beg /binarygames/ }
    use_backend nex3_l3_binary_games_service_nodes if { path_beg /binarygames/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /sicbo } ! { path_beg /sicbo/ }
    use_backend nex3_l3_sicbo_nodes if { path_beg /sicbo/ }

backend nex3_l3_game_server_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/main/,/)]
    server-template l3_game_server_PROD_ 1 l3_game_server_PROD:5000 check resolvers docker init-addr libc,none

