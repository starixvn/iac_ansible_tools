frontend l3_admin_site_prod
    bind *:9321
    mode  http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    http-request deny if !is-whitelisted-ip
    default_backend nex3_l3_admin_site_nodes_prod

frontend l3_admin_site_prod_1
    bind *:9100
    mode  http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    http-request deny if !is-whitelisted-ip
    default_backend nex3_l3_admin_site_nodes_prod

backend nex3_l3_admin_site_nodes_prod
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 302
    cookie serverid insert
    server-template l3_admin_site_PROD_ 1 l3_admin_site_PROD:5000 check resolvers docker init-addr none
