
frontend nex3_l3_game_client_sit
    bind *:9120
    mode  http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    default_backend nex3_l3_game_client_nodes_prod

backend nex3_l3_game_client_nodes_prod
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l3_game_client_PROD_ 3 l3_game_client_PROD:80 check resolvers docker init-addr none

backend nex3_l3_game_client_mini_nodes_prod
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l3_game_client_mini_PROD_ 2 l3_game_client_mini_PROD:80 check resolvers docker init-addr none

