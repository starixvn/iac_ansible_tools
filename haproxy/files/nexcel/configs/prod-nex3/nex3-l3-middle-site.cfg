frontend nex3_l3_middle_site_prod
    bind *:8012
    mode  http
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    use_backend nex3_l3_middle_site_prod

backend nex3_l3_middle_site_prod
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l3_middle_site_PROD_ 2 l3_middle_site_PROD:5000 check resolvers docker init-addr none
