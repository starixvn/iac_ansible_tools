frontend nex3_l3_middle_site_prod
    bind *:8012
    mode  http
    use_backend nex3_l3_middle_site_prod

backend nex3_l3_middle_site_prod
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l3_middle_site_PROD_ 1 l3_middle_site_PROD:5000 check resolvers docker init-addr libc,none
    