frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    #NEX3
    use_backend default_backend_nodes if { hdr(host) -i mini.vgaming88.net }
    use_backend nex3_l3_middle_site_prod if { hdr(host) -i middlesite.sabaclub.net }
    use_backend nex3_l3_game_client_nodes_prod if { hdr(host) -i www.vgaming88.net }
    use_backend nex3_l3_game_client_nodes_prod if { hdr(host) -i w1.vgaming88.net }
    use_backend nex3_l3_game_client_nodes_prod if { hdr(host) -i w2.vgaming88.net }
    use_backend nex3_l3_game_api_nodes_prod if { hdr(host) -i api.vgaming88.net }
    use_backend nex3_l3_result_nodes_prod if { hdr(host) -i result.vgaming88.net }
    use_backend nex3_l3_user_nodes_prod if { hdr(host) -i user.vgaming88.net }
    use_backend nex3_l3_middle_site_prod if { hdr(host) -i middlesite.vgaming88.net }
    # Internal
    use_backend nex3_l3_game_api_nodes_prod if { hdr(host) -i intapi.vgaming88.net }
    use_backend nex3_l3_middle_site_prod if { hdr(host) -i intmiddlesite.vgaming88.net }
    use_backend nex3_l3_result_nodes_prod if { hdr(host) -i intresult.vgaming88.net }
    #

    http-request redirect scheme http drop-query append-slash if { hdr(host) -i proxy.vgaming88.net } { path_beg /main } ! { path_beg /main/ }
    use_backend nex3_l3_game_server_nodes if { path_beg /main } { hdr(host) -i proxy.vgaming88.net }

    http-request redirect scheme http drop-query append-slash if { hdr(host) -i proxy.vgaming88.net } { path_beg /blackjack } ! { path_beg /blackjack/ }
    use_backend nex3_l3_blackjack_nodes if { path_beg /blackjack/ } { hdr(host) -i proxy.vgaming88.net }

    http-request redirect scheme http drop-query append-slash if { hdr(host) -i proxy.vgaming88.net } { path_beg /fishprawncrabpro } ! { path_beg /fishprawncrabpro/ }
