frontend nex3_l3_game_api_prod
    bind *:9320
    mode  http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    default_backend nex3_l3_game_api_nodes_prod

backend nex3_l3_game_api_nodes_prod
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l3_game_api_PROD_ 2 l3_game_api_PROD:5000 check resolvers docker init-addr none

frontend nex3_l3_auth_api_prod
    bind *:9323
    mode  http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    default_backend nex3_l3_auth_api_nodes_prod

backend nex3_l3_auth_api_nodes_prod
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l3_auth_api_PROD_ 2 l3_auth_api_PROD:5000 check resolvers docker init-addr none
