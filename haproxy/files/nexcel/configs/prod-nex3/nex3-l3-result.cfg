frontend nex3_l3_result_prod
    bind *:8781
    mode  http
    option forwardfor
    default_backend nex3_l3_result_nodes_prod

backend nex3_l3_result_nodes_prod
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 302
    cookie serverid insert
    server-template l3_game_result_PROD_ 1 l3_game_result_PROD:5000 check resolvers docker init-addr libc,none
