frontend redis_srv
    bind *:16379
    mode  tcp
use_backend redis_srv_nodes

backend redis_srv_nodes
    option tcp-check
server redis_srv_10.0.4.125_16379 10.0.4.125:16379 check
#
frontend redis_alpha_srv
    bind *:16389
    mode  tcp
use_backend redis_alpha_srv_nodes

backend redis_alpha_srv_nodes
    option tcp-check
server redis_alpha_srv_10.0.4.125_16389 10.0.4.125:16389 check
#