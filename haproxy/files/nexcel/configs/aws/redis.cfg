#
frontend redis_srv
    bind *:16379
    mode  tcp
use_backend redis_srv_nodes

backend redis_srv_nodes
    option tcp-check
server redis_srv_ 10.2.27.19:6379 check
#
frontend redis_alpha_srv
    bind *:16389
    mode  tcp
use_backend redis_alpha_srv_nodes

backend redis_alpha_srv_nodes
    option tcp-check
server redis_alpha_srv_ 10.2.27.19:6379 check
