#
frontend fps_web_api
    bind *:7788
    mode  http
use_backend fps_web_api_nodes

backend fps_web_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
server fps_web_api_ 10.2.27.26:7788 check
#
frontend fps_middle_api
    bind *:7789
    mode  http
use_backend fps_middle_api_nodes

backend fps_middle_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
server fps_middle_api 10.2.27.26:7789 check
#