#
frontend rabbit_mq
    bind *:5672
    mode  tcp
use_backend rabbit_mq_nodes

backend rabbit_mq_nodes
    option tcp-check
server rabbit_mq_ 10.2.27.19:5672 check
#

frontend rabbit_mq_admin
    bind *:15672
    mode  tcp
use_backend rabbit_mq_admin_nodes

backend rabbit_mq_admin_nodes
    option tcp-check
server rabbit_mq_admin_ 10.2.27.19:15672 check
#