frontend state_srv
    bind *:42424
    mode  tcp
    use_backend state_srv_nodes

backend state_srv_nodes
    option tcp-check
    server state_srv1 10.2.27.19:42424 check
    server state_srv2 10.2.27.16:42424 check backup

frontend alpha_state_srv
    bind *:43434
    mode  tcp
    use_backend alpha_state_srv_nodes

backend alpha_state_srv_nodes
    option tcp-check
    server alpha_state_srv1 10.2.27.1:42424 check
    server alpha_state_srv2 10.2.27.16:42424 check backup