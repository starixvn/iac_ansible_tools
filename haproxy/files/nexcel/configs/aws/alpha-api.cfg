frontend announcement_api
    bind *:6578
    mode  http
    use_backend announcement_api_nodes

backend announcement_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    server announcement_api_ 10.2.27.16:6578 check

frontend copy_customer_api
    bind *:7436
    mode  http
    use_backend copy_customer_api_nodes

backend copy_customer_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
    server copy_customer_api_ 10.2.27.16:7436 check