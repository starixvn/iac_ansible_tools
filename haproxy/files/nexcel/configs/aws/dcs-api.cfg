####
frontend dcs_setting
    bind *:7577
    mode  http
use_backend dcs_setting_nodes

backend dcs_setting_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
server dcs_setting_ 10.2.27.19:7577 check
