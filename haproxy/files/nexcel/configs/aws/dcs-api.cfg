frontend dcs_matrix
    bind *:7578
    mode  http
use_backend dcs_matrix_api_nodes

backend dcs_matrix_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /whoami.aspx
    http-check expect status 200
server dcs_setting_api_ 10.2.27.19:7578 check
