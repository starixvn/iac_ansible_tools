frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    use_backend default_backend_nodes if { path_beg /default }
    default_backend default_backend_nodes 

    #OLYMPUS
    use_backend olympus_nap_settlement_nodes if { hdr(host) -i settlementcore.sportsfun.app }
    use_backend olympus_nap_prms_AWS_nodes if { hdr(host) -i prms-core.sportsfun.app }

    #NEXUS
    use_backend nexus_saba_news_nodes if { hdr(host) -i sabanews.sportsfun.app }
    use_backend nexus_saba_sports_saba_news_wp_nodes if { hdr(host) -i sabanews-admin.sportsfun.app }
    use_backend nexus_saba_news_upload_nodes if { hdr(host) -i sabanews-cdn.sportsfun.app }
    use_backend nexus_bot_service_endpoint_nodes if { hdr(host) -i licbotendpoint.sportsfun.app  }
    use_backend nexus_crm_letstalk_nodes if { hdr(host) -i letstalkcrm.sportsfun.app  }
    use_backend nexus_odds_feed_admin_nodes if { hdr(host) -i oddsfeedadmin.sportsfun.app  }
    use_backend nexus_odds_feed_service_nodes if { hdr(host) -i oddsfeedwebservice.sportsfun.app  }
    
    #SPU
    use_backend spu_ws_nodes if { hdr(host) -i ws.sportsfun.app }
    use_backend spu_sc_nodes if { hdr(host) -i sc.sportsfun.app }
    use_backend spu_fps_api_nodes if { hdr(host) -i fps-api.sportsfun.app }

backend default_backend_nodes
    http-request return status 200 content-type "text/plain" string "Hello, it's me"