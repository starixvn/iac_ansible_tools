
frontend nex3_l3_api_proxy
    bind *:7777
    mode  http
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    use_backend nex3_l3_game_server_nodes_sit if { path_beg /sit/main/ }
    use_backend nex3_l3_blackjack_nodes_sit if { path_beg /sit/blackjack/ }

backend nex3_l3_blackjack_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /sit/blackjack/(.*) /\1
    server-template nex3_l3_blackjack_SIT 1 nex3_l3_blackjack_service_SIT:6003 check resolvers docker init-addr libc,none

backend nex3_l3_blackjack_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /uat/blackjack/(.*) /\1
    server-template nex3_l3_blackjack_UAT 1 nex3_l3_blackjack_service_UAT:7003 check resolvers docker init-addr libc,none