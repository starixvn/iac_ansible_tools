backend olympus_nap_settlement_SIT_nodes
    stick-table type ip size 1m expire 1h
    stick on src
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template nap_settlement_SIT 2 nap_settlement_SIT:5000 check resolvers docker init-addr libc,none