frontend http_in
    bind *:80
    mode http
    option forwardfor
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    #OLYMPUS
    use_backend olympus_nap_settlement_SIT_nodes_1 if { hdr(host) -i napsettlement.playthefun.com }
    use_backend olympus_nap_settlement_SIT_nodes_2 if { hdr(host) -i napsettlementcore2.playthefun.com }

default_backend default_backend_nodes