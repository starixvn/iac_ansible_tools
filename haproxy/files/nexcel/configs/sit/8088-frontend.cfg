frontend http_in_8088
    bind *:8088
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX
    option forwardfor

 #LEGION
    use_backend legion_lap_ext_SIT_1_nodes if { hdr(host) -i lapext1.playthefun.com }
    use_backend legion_lap_player_admin_SIT_1_nodes if { hdr(host) -i lappa1.playthefun.com }
    use_backend legion_lap_bet_ticket_SIT_1_nodes if { hdr(host) -i lapbt1.playthefun.com }
    use_backend default_backend_nodes if { hdr(host) -i haproxy.playthefun.com }

#default_backend default_backend_nodes
