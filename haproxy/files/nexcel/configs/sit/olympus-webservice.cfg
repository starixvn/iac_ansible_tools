frontend olympus_mail_service_SIT
    bind *:8787 
    mode tcp
    option tcp-check
    option tcplog
    default_backend olympus_mail_service_SIT_nodes

backend olympus_mail_service_UAT_nodes
    timeout server 10m
    server-template nap_mail_service_SIT_ 1 nap_mail_mail_service_SIT:5000 check resolvers docker init-addr none
