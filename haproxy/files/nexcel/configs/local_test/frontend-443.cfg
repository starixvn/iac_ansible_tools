frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/lumigame.com.pem alpn h2,http/1.1
    mode http
    option forwardfor
    option http-keep-alive
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats show-modules
    stats auth lumi:lum!onRock

    # L1 - LOCAL

    #NexOps
    use_backend nexops_portainer_nodes if { hdr(host) -i portainer-test.nexdev.net }

default_backend default_backend_nodes
