frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/lumigame.com.pem alpn h2,http/1.1
    mode http
    option forwardfor
    option http-keep-alive
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats show-modules
    stats auth lumi:lum!onRock

    # L1 - LOCAL
    use_backend l1_game_client_mobi_nodes if { hdr(host) -i l1-m.lumigame.com }
    use_backend l1_game_client_nodes if { hdr(host) -i games.lumigame.com }
    use_backend l1_game_admin_api_nodes if { hdr(host) -i admin-api.lumigame.com }
    use_backend l1_api_nodes if { hdr(host) -i api.lumigame.com }
    use_backend l1_auth_api_nodes if { hdr(host) -i auth.lumigame.com }
    use_backend l1_game_admin_site_nodes if {  hdr(host) -i admin.lumigame.com }
    use_backend l1_game_admin_api_nodes if { hdr(host) -i admin-api.lumigame.com }
    use_backend l1_gamelobby_simulator_nodes if { hdr(host) -i gamelobby-simulator.lumigame.com }
    use_backend l1_owapi_simulator_nodes if { hdr(host) -i owapi-simulator.lumigame.com }
    use_backend l1_game_result_nodes if { hdr(host) -i result.lumigame.com }
    use_backend l1_game_guides_nodes if { hdr(host) -i l1-guide.lumigame.com }
    use_backend l1_socket_gateway_nodes if { hdr(host) -i l1-gw.lumigame.com }
    use_backend l1_instant_game_client_nodes if { hdr(host) -i l1-mini.lumigame.com }

    #NexOps
    use_backend nexops_portainer_nodes if { hdr(host) -i portainer-test.nexdev.net }

default_backend default_backend_nodes
