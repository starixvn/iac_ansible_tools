
frontend l2_games_proxy_1
    bind *:7101
    mode  http
    option forwardfor
    http-request redirect scheme http drop-query append-slash if { path_beg /main } ! { path_beg /main/ }
    use_backend l2_game_server_nodes_1 if { path_beg /main/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /sedie } ! { path_beg /sedie/ }
    use_backend l2_sedie_nodes_1 if { path_beg /sedie/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /vsedie } ! { path_beg /vsedie/ }
    use_backend l2_vip_sedie_nodes_1 if { path_beg /vsedie/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /specialsedie } ! { path_beg /specialsedie/ }
    use_backend l2_special_sedie_nodes_1 if { path_beg /specialsedie/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /blackjack } ! { path_beg /blackjack/ }
    use_backend l2_blackjack_node_1 if { path_beg /blackjack/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /vipfishprawncrab } ! { path_beg /vipfishprawncrab/ }
    use_backend l2_vip_fish_prawn_crab_nodes_1 if { path_beg /vipfishprawncrab/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /sicbo } ! { path_beg /sicbo/ }
    use_backend l2_sicbo_nodes_1 if { path_beg /sicbo/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /vipbaccarat } ! { path_beg /vipbaccarat/ }
    use_backend l2_vip_baccarat_nodes_1 if { path_beg /vipbaccarat/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /vipsediewar } ! { path_beg /vipsediewar/ }
    use_backend l2_vip_sedie_war_nodes_1 if { path_beg /vipsediewar/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /turbooddeven } ! { path_beg /turbooddeven/ }
    use_backend l2_turbo_odd_even_nodes_1 if { path_beg /turbooddeven/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /kenopromax } ! { path_beg /kenopromax/ }
    use_backend l2_keno_pro_max_service_nodes_1 if { path_beg /kenopromax/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /bigsmall } ! { path_beg /bigsmall/ }
    use_backend l2_big_small_service_nodes_1 if { path_beg /bigsmall/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /user } ! { path_beg /user/ }
    use_backend l2_user_service_nodes_1 if { path_beg /user/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /minisedie } ! { path_beg /minisedie/ }
    use_backend l2_mini_sedie_service_nodes_1 if { path_beg /minisedie/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /turbobigsmall } ! { path_beg /turbobigsmall/ }
    use_backend l2_turbo_big_small_service_nodes_1 if { path_beg /turbobigsmall/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /dragontiger } ! { path_beg /dragontiger/ }
    use_backend l2_dragon_tiger_service_nodes_1 if { path_beg /dragontiger/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /baccarat } ! { path_beg /baccarat/ }
    use_backend l2_baccarat_service_nodes_1 if { path_beg /baccarat/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /roulette } ! { path_beg /roulette/ }
    use_backend l2_roulette_service_nodes_1 if { path_beg /roulette/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /fishprawncrab } ! { path_beg /fishprawncrab/ }
    use_backend l2_fish_prawn_crab_service_nodes_1 if { path_beg /fishprawncrab/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /fourguardians } ! { path_beg /fourguardians/ }
    use_backend l2_four_guardians_nodes_1 if { path_beg /fourguardians/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /lottery } ! { path_beg /lottery/ }
    use_backend l2_lottery_nodes_1 if { path_beg /lottery/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /minikeno } ! { path_beg /minikeno/ }
    use_backend l2_mini_keno_nodes_1 if { path_beg /minikeno/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /heroesslot } ! { path_beg /heroesslot/ }
    use_backend l2_heroes_slot_nodes_1 if { path_beg /heroesslot/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /luckywheel } ! { path_beg /luckywheel/ }
    use_backend l2_lucky_wheel_nodes_1 if { path_beg /luckywheel/ }

    default_backend l2_game_server_nodes_1

backend l2_keno_match_service_nodes_1
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/kenomatch/,/)]
    server-template l2_keno_match_service_LOCAL_1_ 1 l2_keno_match_service_LOCAL_1:5000 check resolvers docker init-addr last,libc,none

