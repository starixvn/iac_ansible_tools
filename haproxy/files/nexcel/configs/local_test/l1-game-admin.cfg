
backend l1_game_admin_site_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l1_admin_site_LOCAL_ 1 l1_admin_site_LOCAL:5000 check resolvers docker init-addr libc,none

