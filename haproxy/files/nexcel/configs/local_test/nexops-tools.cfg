backend nexops_portainer_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template portainer 1 portainer_portainer:9000 check init-addr last,libc,none resolvers docker

backend ngin_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template friendly_lehmann 1 friendly_lehmann:80 check init-addr last,libc,none resolvers docker

backend monitoring_prometheus_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template monitoring_prometheus 1 monitoring_prometheus:9090 check init-addr last,libc,none resolvers docker

backend default_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me" #if { path_beg /whoami }

