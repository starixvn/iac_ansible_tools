backend nexops_portainer_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template portainer 1 portainer_portainer:9000 resolvers docker init-addr last,libc,none

backend ngin_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template friendly_lehmann 1 friendly_lehmann:80 resolvers docker init-addr last,libc,none

backend default_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me" #if { path_beg /whoami }

