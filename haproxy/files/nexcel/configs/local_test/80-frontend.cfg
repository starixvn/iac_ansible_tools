    use_backend nexops_deploymentapi_nodes if { hdr(host) -i deploymentapi.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i deploymentapi.nexdev.net }
    use_backend nexops_zabbix_webserver if { hdr(host) -i zabbix.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i zabbix.nexdev.net }
    use_backend nexops_awx_nodes if { hdr(host) -i awx.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i awx.nexdev.net }

