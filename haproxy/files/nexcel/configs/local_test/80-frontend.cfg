frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

