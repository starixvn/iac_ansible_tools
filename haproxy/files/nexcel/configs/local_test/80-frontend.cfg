frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
    #http-request use-service prometheus-exporter if { path /metrics }
default_backend default_backend_nodes

frontend http_in
    bind *:80
    bind :443 ssl crt /etc/haproxy/nexdev.net.pem alpn h2,http/1.1
    mode http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    #option http-keep-alive
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    #NexOps
    #http-request redirect scheme https if { hdr(host) -i api.haproxydev.local }
    http-request redirect scheme https if { hdr(host) -i www.haproxydev.local }
    use_backend %[path,map_beg(/etc/haproxy/l2-game-proxy.map)] if { hdr(host) -i l2-proxy.lumigame.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/hosts.map)]
    
default_backend default_backend_nodes

backend nexops_portainer_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template portainer 1 portainer_portainer:9000 check init-addr none resolvers docker

backend ngin_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template friendly_lehmann 1 friendly_lehmann:80 check init-addr none resolvers docker

backend monitoring_prometheus_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template monitoring_prometheus 1 monitoring_prometheus:9090 check init-addr none resolvers docker

backend default_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me" #if { path_beg /whoami }

