backend be_www2
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me be_www2" #if { path_beg /whoami }

backend be_www3
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me be_www3" #if { path_beg /whoami }

backend game_api
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me game_api" #if { path_beg /whoami }
