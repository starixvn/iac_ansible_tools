frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    #NexOps
    use_backend nexops_portainer_nodes if { hdr(host) -i portainer.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i portainer.nexdev.net }
    use_backend nexops_grafana_nodes if { hdr(host) -i mon.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i mon.nexdev.net }
    use_backend nexops_sentry_nodes if { hdr(host) -i sentry.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i sentry.nexdev.net }
    use_backend nexops_sonar_nodes if { hdr(host) -i sonarqube.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i sonarqube.nexdev.net }
    use_backend nexops_deploymentapi_nodes if { hdr(host) -i deploymentapi.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i deploymentapi.nexdev.net }
    use_backend nexops_zabbix_webserver if { hdr(host) -i zabbix.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i zabbix.nexdev.net }

    #Nexus
    use_backend nexus_saba_sports_saba_news_wp_nodes if { hdr(host) -i saba-reports.nexdev.net }
    use_backend nexus_saba_sports_saba_news_upload_nodes if { hdr(host) -i saba-reports-upload.nexdev.net }
    use_backend nexus_saba_sports_saba_news_site if { hdr(host) -i saba-news-v1.nexdev.net }
    use_backend nexus_saba_sports_saba_news_site_1 if { hdr(host) -i saba-news-v2.nexdev.net }
    use_backend nexus_redmine_nodes_PROD if { hdr(host) -i nexdev.net }
    use_backend nexus_redmine_nodes_PROD_bk if { hdr(host) -i rm-bk.nexdev.net }
    use_backend nexus_thor_api_LOCAL if { hdr(host) -i thor-api.nexdev.net }
    use_backend nexus_thor_api_LOCAL_1 if { hdr(host) -i thor-api1.nexdev.net }
    use_backend nexus_ncb_main_LOCAL if { hdr(host) -i ncb-main.nexdev.net }
    use_backend nexus_ncb_main_LOCAL_1 if { hdr(host) -i ncb-main1.nexdev.net }
    use_backend nexus_ncb_main_LOCAL_2 if { hdr(host) -i ncb-main2.nexdev.net }
    use_backend nexus_ncb_main_LOCAL_3 if { hdr(host) -i ncb-main3.nexdev.net }

    http-request redirect scheme https if { hdr(host) -i rm-bk.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i nexdev.net }
    http-request redirect scheme https if { hdr(host) -i info.nexcel.vn }
    http-request redirect scheme https if { hdr(host) -i ncb-main.nexdev.net  }
    http-request redirect scheme https if { hdr(host) -i ncb-main1.nexdev.net  }
    http-request redirect scheme https if { hdr(host) -i ncb-main2.nexdev.net  }
    http-request redirect scheme https if { hdr(host) -i ncb-main3.nexdev.net  }
    http-request redirect scheme https if { hdr(host) -i licbot.nexdev.net  }
    http-request redirect scheme https if { hdr(host) -i rm.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i rm-pro.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i rm-old.nexdev.net }
    http-request redirect scheme https if { hdr(host) -i thor-api1.nexdev.net }
    