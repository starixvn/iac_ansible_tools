frontend http_in
    bind *:80
    mode http
    option forwardfor
    #http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    #NexOps
    use_backend nexops_portainer_nodes if { hdr(host) -i portainer-test.nexdev.net }
    use_backend ngin_nodes if { hdr(host) -i nginx-test.nexdev.net }

default_backend default_backend_nodes
