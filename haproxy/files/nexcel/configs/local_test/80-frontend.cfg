frontend http_in
    bind *:80
    mode http
    option forwardfor
    #http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    #NexOps
    #use_backend be_%[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map,be_www)]
    #use_backend be_%[req.hdr(host),lower,map_dom(/etc/haproxy/maps/hosts.map,www)]
    #use_backend be_%[path,map_beg(/etc/haproxy/maps/hosts.map)] if { path,map_beg(/etc/haproxy/maps/hosts.map) -m found }
    use_backend nexops_portainer_nodes if { hdr(host) -i portainer-test.nexdev.net }
    #use_backend ngin_nodes if { hdr(host) -i nginx-test.nexdev.net }
    #use_backend monitoring_prometheus_nodes if { hdr(host) -i monitoring_prometheus_nodes.nexdev.net }

#default_backend default_backend_nodes

backend nexops_portainer_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template portainer 1 portainer_portainer:9000 check init-addr none resolvers docker

backend ngin_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template friendly_lehmann 1 friendly_lehmann:80 check init-addr none resolvers docker

backend monitoring_prometheus_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template monitoring_prometheus 1 monitoring_prometheus:9090 check init-addr none resolvers docker

backend default_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me" #if { path_beg /whoami }

backend be_static
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me be_static" #if { path_beg /whoami }

backend be_api
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me be_api" #if { path_beg /whoami }

backend be_www
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me be_www" #if { path_beg /whoami }
