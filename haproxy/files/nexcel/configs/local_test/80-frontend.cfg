frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX


backend nex3_l3_game_admin_api_nodes_local1
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/local1/game-admin-api/,/)]
    server-template admin_api_local1_ 1 l3_admin_api_LOCAL_1:5000 check resolvers docker init-addr libc,none

