frontend http_in
    bind *:80
    mode  http
    option forwardfor
    option http-keep-alive
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats show-modules
    stats auth lumi:lum!onRock

    use_backend l1_oldgame_client_nodes if { hdr(host) -i oldgames.lumigame.com }

    # L1 - LOCAL
    http-request redirect scheme https if { hdr(host) -i l1-proxy.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i games.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-m.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i api.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i auth.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i admin.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i admin-api.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i gamelobby-simulator.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i owapi-simulator.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i result.lumigame.com }
    use_backend l1_socket_gateway_nodes if { hdr(host) -i l1-gw.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-guide.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-mini.lumigame.com }

    # L1 - LOCAL_1
    http-request redirect scheme https if { hdr(host) -i l1-proxy1.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-games1.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-m1.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-api1.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-auth1.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-admin1.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-admin-api1.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-glbs1.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-ows1.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-result1.lumigame.com }
    use_backend l1_socket_gateway_nodes_1 if { hdr(host) -i l1-gw1.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-guide-1.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-mini1.lumigame.com }

    # L1 - LOCAL_2
    http-request redirect scheme https if { hdr(host) -i l1-proxy2.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-games2.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-m2.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-api2.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-auth2.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-admin2.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-admin-api2.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-glbs2.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-ows2.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-result2.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-guide-2.lumigame.com }

default_backend default_backend_nodes