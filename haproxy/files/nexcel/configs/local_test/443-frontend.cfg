frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/licbot.nexdev.net.pem alpn h2,http/1.1 crt /usr/local/etc/haproxy/nexdev.net.pem alpn h2,http/1.1 crt /usr/local/etc/haproxy/nexcel.vn.pem alpn h2,http/1.1
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    stats uri /stats
    stats refresh 30s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    #Nexops
    use_backend nexops_portainer_nodes if { hdr(host) -i portainer.nexdev.net }
    use_backend nexops_grafana_nodes if { hdr(host) -i mon.nexdev.net }
    use_backend nexops_zabbix_webserver if { hdr(host) -i zabbix.nexdev.net }
    use_backend nexops_sentry_nodes if { hdr(host) -i sentry.nexdev.net }
    use_backend nexops_sonar_nodes if { hdr(host) -i sonarqube.nexdev.net }
    use_backend nexops_deploymentapi_nodes if { hdr(host) -i deploymentapi.nexdev.net }

    #Nexus
    use_backend nexus_saba_sports_saba_news_wp_nodes if { hdr(host) -i saba-reports.nexdev.net }
    use_backend nexus_saba_sports_saba_news_upload_nodes if { hdr(host) -i saba-reports-upload.nexdev.net }
    use_backend nexus_saba_sports_saba_news_site if { hdr(host) -i saba-news-v1.nexdev.net }
    use_backend nexus_saba_sports_saba_news_site_1 if { hdr(host) -i saba-news-v2.nexdev.net }
    use_backend nexus_nexcel_info_site if { hdr(host) -i info.nexcel.vn }
    use_backend nexus_ncb_main_LOCAL if { hdr(host) -i ncb-main.nexdev.net }
    use_backend nexus_ncb_main_LOCAL_1 if { hdr(host) -i ncb-main1.nexdev.net }
    use_backend nexus_ncb_main_LOCAL_2 if { hdr(host) -i ncb-main2.nexdev.net }
    use_backend nexus_ncb_main_LOCAL_3 if { hdr(host) -i ncb-main3.nexdev.net }
    use_backend nexus_ncb_endpoint if { hdr(host) -i licbot.nexdev.net }
    use_backend nexus_redmine_nodes_LOCAL if { hdr(host) -i rm.nexdev.net }
    use_backend nexus_redmine_nodes_PROD if { hdr(host) -i rm-pro.nexdev.net }
    use_backend nexus_redmine_nodes_PROD_OLD if { hdr(host) -i rm-old.nexdev.net }
    use_backend nexus_redmine_nodes_PROD if { hdr(host) -i nexdev.net }
    use_backend nexus_redmine_nodes_PROD_bk if { hdr(host) -i rm-bk.nexdev.net }
    use_backend nexus_thor_api_LOCAL if { hdr(host) -i thor-api.nexdev.net }
    use_backend nexus_thor_api_LOCAL_1 if { hdr(host) -i thor-api1.nexdev.net }
    