frontend http_in_8282
    bind *:8282
    mode http
    option forwardfor
    #compression algo gzip

 #NEXUS
    use_backend thor_thor_api_PROD_1_nodes if { hdr(host) -i thor-12b.oneops.net:8282 }
    use_backend thor_thor_api_PROD_nodes if { hdr(host) -i thornova88.oneops.net:8282 }

default_backend default_backend_nodes

backend thor_thor_api_PROD_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template thor_thor_api_PROD_ 1 thor_thor_api_PROD:5000 check resolvers docker init-addr libc,none

backend thor_thor_api_PROD_1_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template thor_thor_api_PROD_1_ 1 thor_thor_api_PROD_1:5000 check resolvers docker init-addr libc,none