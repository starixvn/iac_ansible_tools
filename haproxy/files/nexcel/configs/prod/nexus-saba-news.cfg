frontend nexus_saba_news_PROD
    bind *:7516
    mode  http
    use_backend nexus_saba_news_nodes_PROD

backend nexus_saba_news_nodes_PROD
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template nexus_saba_sports_saba_news_site_PROD 2 saba_sports_saba_news_site_PROD:5000 check resolvers docker init-addr libc,none

frontend nexus_saba_news_wp_PROD
    bind *:7515
    mode  http
    http-request return status 200 content-type "text/plain" lf-string "Hello, you are: %[src]:7515"
    # use_backend nexus_saba_news_nodes_PROD

frontend nexus_saba_news_upload_PROD
    bind *:7519
    mode  http
    http-request return status 200 content-type "text/plain" lf-string "Hello, you are: %[src]:7519"
    # use_backend nexus_saba_news_nodes_PROD

