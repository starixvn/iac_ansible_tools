frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX

    #Tools
    use_backend default_backend_nodes if { hdr(host) -i haproxy.oneops.net }
    use_backend alpha_log_nodes if { hdr(host) -i alphalog.starixplay.com }

    #NEXUS
    use_backend nexus_ncb_endpoint_nodes_UAT if { hdr(host) -i intuatlicbotendpoint.starixplay.com }

    #ROME
    use_backend rome_intaccounting_PROD_nodes if { hdr(host) -i intaccounting.oneops.net }

    #LEGION
    use_backend legion_lap_identity_server_PROD_nodes if { hdr(host) -i li.amazzu.com }

    #OLYMPUS
    use_backend olympus_nap_settlement_nodes if { hdr(host) -i settlementcore.oneops.net }
    use_backend olympus_nap_prms_PROD_nodes if { hdr(host) -i prmscore.oneops.net }
    use_backend olympus_nap_owp_PROD_nodes if { hdr(host) -i owp1.oneops.net }
    use_backend olympus_nap_owp_PROD_nodes if { hdr(host) -i owp.oneops.net }
    use_backend olympus_nap_aa_PROD_nodes if { hdr(host) -i aa.oneops.net }

    #SPU
    use_backend nap_spu_main_service_PROD_nodes if { hdr(host) -i spumain.oneops.net }
    use_backend nap_spu_cts_job_service_PROD_nodes if { hdr(host) -i spucts.oneops.net }
    use_backend nap_spu_dcs_job_service_PROD_nodes if { hdr(host) -i spudcs.oneops.net }
    use_backend nap_spu_fs_job_service_PROD_nodes if { hdr(host) -i spufs.oneops.net }
    use_backend nap_spu_vr_job_service_PROD_nodes if { hdr(host) -i spuvr.oneops.net }
    use_backend nap_spu_cts_cc_job_service_PROD_nodes if { hdr(host) -i spuctscc.oneops.net }
    use_backend nap_spu_tgr_job_service_PROD_nodes if { hdr(host) -i sputgr.oneops.net }
