frontend http_in_8088
    bind *:8088
    mode http
    option forwardfor
    compression algo gzip

 #LEGION
    use_backend legion_lap_player_admin_PROD_nodes if { hdr(host) -i pa.amazzu.com }
    use_backend legion_lap_bet_ticket_PROD_nodes if { hdr(host) -i bt.amazzu.com }
    use_backend legion_lap_identity_server_PROD_nodes if { hdr(host) -i li.amazzu.com } ##

default_backend default_backend_nodes
