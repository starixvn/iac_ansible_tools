frontend http_in_8088
    bind *:8088
    mode http
    option forwardfor
    #compression algo gzip

 #LEGION
    use_backend legion_lap_player_admin_PROD_nodes if { hdr(host) -i pa.amazzu.com }
    use_backend legion_lap_bet_ticket_PROD_nodes if { hdr(host) -i bt.amazzu.com }
    use_backend legion_lap_identity_server_PROD_nodes if { hdr(host) -i li.amazzu.com } ##

 #NEXOPS   
    use_backend sentry_web_prod_nodes if { hdr(host) -i sentry.starixplay.com }

 #NEXUS   
    use_backend nexus_ncb_endpoint_nodes_PROD if { hdr(host) -i licbotwebhook.starixplay.com }
    use_backend nexus_ncb_endpoint_nodes_PROD if { hdr(host) -i licbotwebhook2.starixplay.com }
    use_backend nexus_ncb_endpoint_nodes_UAT if { hdr(host) -i uatlicbotendpoint.starixplay.com }

 #ROME
    use_backend rome_nap_u3_PROD_nodes if { hdr(host) -i napu3.oneops.net }


default_backend default_backend_nodes
