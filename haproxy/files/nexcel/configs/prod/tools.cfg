backend default_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me" #if { path_beg /whoami }

backend sentry_web_prod_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /account/recover/
    http-check expect status 200
    cookie serverid insert
    server-template sentry_web_prod_ 2 sentry_web_prod:9000 check resolvers docker init-addr libc,none