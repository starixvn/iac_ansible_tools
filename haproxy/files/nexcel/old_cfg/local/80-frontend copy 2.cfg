frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth nexcel:1qaz@WSX
    ###
    use_backend %[path,map_beg(/etc/haproxy/vg3-game-proxy.map)] if { hdr(host) -i l3-api-proxy.nexdev.net }
    http-request redirect scheme http drop-query append-slash if { path_beg /local1/paigowpoker } ! { path_beg /local1/paigowpoker/ }
    http-request redirect scheme http drop-query append-slash if { path_beg /local1/main } ! { path_beg /local1/main/ } !{ path_beg /local1/game-server-api }
