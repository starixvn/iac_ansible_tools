frontend state_srv
    bind *:42424
    mode  tcp
use_backend state_srv_nodes

backend state_srv_nodes
	mode tcp
    option tcp-check
server state_srv1 10.0.4.220:42424 check
server state_srv2 10.0.4.4:42424 check backup
#
frontend alpha_state_srv
    bind *:43434
    mode  tcp
use_backend alpha_state_srv_nodes

backend alpha_state_srv_nodes
	mode tcp
    option tcp-check
server alpha_state_srv1 10.0.4.4:42424 check
server alpha_state_srv2 10.0.4.220:42424 check backup
