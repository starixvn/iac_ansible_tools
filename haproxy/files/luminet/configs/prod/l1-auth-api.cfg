
frontend l1_auth_api
    bind *:8303
    mode  http
    option forwardfor
    default_backend l1_auth_api_nodes

backend l1_auth_api_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_auth_api_PROD_ 2 l1_auth_api_PROD:5000 check resolvers docker init-addr none