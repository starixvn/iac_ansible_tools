
frontend l2_game_client
    bind *:8110
    mode  http
    option forwardfor
    default_backend l2_game_client_nodes

backend l2_game_client_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_client_PROD_ 2 l2_game_client_PROD:80 check resolvers docker init-addr libc,none