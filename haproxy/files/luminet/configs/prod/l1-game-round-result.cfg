
frontend l1_game_round_result
    bind *:8305
    mode  http
    option forwardfor
    default_backend l1_game_round_result_nodes

backend l1_game_round_result_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_result_PROD 1 l1_game_result_PROD:5000 check resolvers docker init-addr none
