frontend nexops_sentry_fe
    bind *:9009
    mode  http
    option forwardfor
    default_backend nexops_sentry_nodes

frontend nexops_sentry_fe2
    bind *:9000
    mode  http
    option forwardfor
    default_backend nexops_sentry_nodes

backend nexops_sentry_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /account/recover/
    http-check expect status 200
    cookie serverid insert
    server-template nexops_sentry 2 sentry_web_prod:9000 check resolvers docker init-addr none

backend default_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "Empty backend! Pls contact NexOps if you think this is a mistake." #if { path_beg /whoami }
