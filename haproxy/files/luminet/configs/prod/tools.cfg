frontend nexops_sentry_fe
    bind *:9009
    mode  http
    option forwardfor
    default_backend nexops_sentry_nodes

backend nexops_sentry_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /account/recover/
    http-check expect status 200
    cookie serverid insert
    server-template nexops_sentry 2 sentry_web_prod:9000 check resolvers docker init-addr libc,none
