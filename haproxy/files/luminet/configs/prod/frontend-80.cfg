frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
    http-request use-service prometheus-exporter if { path /metrics }
default_backend default_backend_nodes

frontend http_in
    bind *:80
    mode  http
    option forwardfor
    option http-keep-alive
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock
    
    # Tools
    use_backend nexops_sentry_nodes if { hdr(host) -i sentry.sabagame.com }

    # L1
    # Internal accessing
    use_backend l1_api_nodes if { hdr(host) -i intapi.sabagame.com }
    use_backend l1_game_round_result_nodes if { hdr(host) -i intresult.sabagame.com }

    #
    use_backend default_backend_nodes if { hdr(host) -i haproxy.sabagame.com }
    use_backend l2_socket_gateway_PROD_nodes if { hdr(host) -i gw.v-gaming.net }
    use_backend l2_socket_gateway_PROD_nodes if { hdr(host) -i gw2.v-gaming.net }
    use_backend l1_socket_gateway_nodes_prod if { hdr(host) -i gw.sabagame.com }
    use_backend l1_socket_gateway_nodes_prod if { hdr(host) -i gw.gamesaba.com }
    use_backend l1_game_client_mobi_nodes if { hdr(host) -i m.sabagame.com }
    use_backend l1_game_client_mobi_nodes if { hdr(host) -i m.gamesaba.com }
    use_backend l1_game_guides_nodes if { hdr(host) -i guides.sabagame.com }
    use_backend l1_game_guides_nodes if { hdr(host) -i guides.gamesaba.com }
    use_backend l1_instant_game_client_nodes_PROD if { hdr(host) -i mini.sabagame.com }

    # L2
    # Internal accessing
    use_backend l2_api_nodes if { hdr(host) -i intapi.v-gaming.net }
    use_backend l2_game_round_result_nodes if { hdr(host) -i intresult.v-gaming.net }
    
    # L2 new
    use_backend l2_game_client_nodes if { hdr(host) -i www.v-gaming.net }
    use_backend l2_api_nodes if { hdr(host) -i api.v-gaming.net }
    use_backend l2_game_round_result_nodes if { hdr(host) -i result.v-gaming.net }
    use_backend l2_game_news_nodes if { hdr(host) -i news.v-gaming.net }
    use_backend l2_game_client_mobi_nodes if { hdr(host) -i m.v-gaming.net }
    use_backend l2_game_server_nodes_PROD if { hdr(host) -i proxy.v-gaming.net }
    use_backend l2_game_guides_nodes if { hdr(host) -i guides.v-gaming.net }

