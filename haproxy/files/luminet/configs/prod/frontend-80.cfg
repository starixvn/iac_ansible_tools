frontend http_in
    bind *:80
    mode  http
    option forwardfor
    option http-keep-alive


    # L1
    use_backend l1_game_client_mobi_nodes if { hdr(host) -i m.sabagame.com }
    use_backend l1_game_client_mobi_nodes if { hdr(host) -i m.gamesaba.com }
    use_backend l1_game_guides_nodes if { hdr(host) -i guides.sabagame.com }
    use_backend l1_game_guides_nodes if { hdr(host) -i guides.gamesaba.com }

    # L2
    use_backend l2_game_guides_nodes if { hdr(host) -i guides.sabagame.net }
    use_backend l2_game_guides_nodes if { hdr(host) -i guides.gamesaba.net }
    
    # L2 new
    use_backend l2_game_client_nodes if { hdr(host) -i www.v-gaming.net }
    use_backend l2_api_nodes if { hdr(host) -i api.v-gaming.net }
    use_backend l2_game_round_result_nodes if { hdr(host) -i result.v-gaming.net }
    use_backend l2_game_news_nodes if { hdr(host) -i news.v-gaming.net }
    use_backend l2_game_client_mobi_nodes if { hdr(host) -i m.v-gaming.net }
    use_backend l2_game_server_nodes_PROD if { hdr(host) -i proxy.v-gaming.net }
    use_backend l2_game_guides_nodes if { hdr(host) -i guides.v-gaming.net }

    use_backend l2_game_server_nodes_PROD if { path_beg /main/ } { hdr(host) -i proxy.v-gaming.net }
    use_backend l2_sedie_nodes_PROD if { path_beg /sedie/ } { hdr(host) -i proxy.v-gaming.net }
