frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
    http-request use-service prometheus-exporter if { path /metrics }
default_backend default_backend_nodes

frontend http_in
    bind *:80
    mode  http
    option forwardfor
    option http-keep-alive
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock
    
    #use_backend %[path,map_beg(/etc/haproxy/l1-game-proxy.map)] if { hdr(host) -i proxy.v-gaming.net }
    #use_backend %[path,map_beg(/etc/haproxy/l1-game-proxy.map)] if { hdr(host) -i proxy2.v-gaming.net }
    use_backend %[path,map_beg(/etc/haproxy/l2-game-proxy.map)] if { hdr(host) -i proxy.v-gaming.net }
    use_backend %[path,map_beg(/etc/haproxy/l2-game-proxy.map)] if { hdr(host) -i proxy2.v-gaming.net }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/hosts.map)]

default_backend default_backend_nodes
