frontend l1_games_gateway
    bind *:8888
    mode  http
    option forwardfor

    use_backend l1_game_server_nodes_PROD if { path_beg /main/ }
    use_backend l1_sedie_nodes_PROD if { path_beg /sedie/ }
    use_backend l1_vip_sedie_nodes_PROD if { path_beg /vsedie/ }
    use_backend l1_special_sedie_nodes_PROD if { path_beg /specialsedie/ }
    use_backend l1_blackjack_node_PROD if { path_beg /blackjack/ }
    use_backend l1_vip_fish_prawn_crab_nodes_PROD if { path_beg /vipfishprawncrab/ }
    use_backend l1_sicbo_nodes_PROD if { path_beg /sicbo/ }
    use_backend l1_vip_baccarat_nodes_PROD if { path_beg /vipbaccarat/ }
    use_backend l1_vip_sedie_war_nodes_PROD if { path_beg /vipsediewar/ }
    use_backend l1_turbo_odd_even_nodes_PROD if { path_beg /turbooddeven/ }
    use_backend l1_keno_pro_max_service_nodes_PROD if { path_beg /kenopromax/ }
    use_backend l1_big_small_service_nodes_PROD if { path_beg /bigsmall/ }
    use_backend l1_user_service_nodes_PROD if { path_beg /user/ }
    use_backend l1_mini_sedie_service_nodes_PROD if { path_beg /minisedie/ }
    use_backend l1_turbo_big_small_service_nodes_PROD if { path_beg /turbobigsmall/ }
    use_backend l1_dragon_tiger_service_nodes_PROD if { path_beg /dragontiger/ }
    use_backend l1_baccarat_service_nodes_PROD if { path_beg /baccarat/ }
    use_backend l1_roulette_service_nodes_PROD if { path_beg /roulette/ }
    use_backend l1_fish_prawn_crab_service_nodes_PROD if { path_beg /fishprawncrab/ }
    use_backend l1_four_guardians_nodes_PROD if { path_beg /fourguardians/ }
    use_backend l1_lottery_nodes_PROD if { path_beg /lottery/ }
    use_backend l1_three_cards_nodes_PROD if { path_beg /threecards/ }
    use_backend l1_mini_keno_nodes_PROD if { path_beg /minikeno/ }
    use_backend l1_heroes_slot_service_PROD if { path_beg /heroesslot/ }
    use_backend l1_keno_power_service_PROD if { path_beg /kenopower/ }
    use_backend l1_keno_match_service_PROD if { path_beg /kenomatch/ }
    use_backend l1_bitcoin_master_service_PROD if { path_beg /bitcoinmaster/ }
    use_backend l1_casino_holdem_poker_service_PROD if { path_beg /casinoholdempoker/ }

    default_backend l1_game_server_nodes_PROD

backend l1_casino_holdem_poker_service_PROD
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/casinoholdempoker/,/)]
    server-template l1_casino_holdem_poker_service_PROD_ 1 l1_casino_holdem_poker_service_PROD:5000 check resolvers docker init-addr none

backend l1_bitcoin_master_service_PROD
