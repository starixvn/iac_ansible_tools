
frontend l2_game_admin_site
    bind *:8311
    mode  http
    option forwardfor
    acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    http-request deny if !is-whitelisted-ip
    default_backend l2_game_admin_site_nodes

backend l2_game_admin_site_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_admin_site_PROD_ 1 l2_admin_site_PROD:5000 check resolvers docker init-addr none

frontend l2_game_admin_api
    bind *:8314
    mode  http
    option forwardfor
    default_backend l2_game_admin_api_nodes

backend l2_game_admin_api_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_admin_api_PROD_ 1 l2_admin_api_PROD:5000 check resolvers docker init-addr none