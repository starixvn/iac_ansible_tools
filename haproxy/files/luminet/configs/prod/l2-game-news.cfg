
frontend l2_game_news_uat
    bind *:7316
    mode  http
    option forwardfor
    default_backend l2_game_news_nodes_uat

backend l2_game_news_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_news_UAT 2 l2-game-news-PROD:5000 check resolvers docker init-addr libc,none