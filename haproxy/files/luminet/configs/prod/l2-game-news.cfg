
frontend l2_game_news
    bind *:8316
    mode  http
    option forwardfor
    default_backend l2_game_news_nodes

backend l2_game_news_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_news 2 l2-game-news-PROD:5000 check resolvers docker init-addr libc,none