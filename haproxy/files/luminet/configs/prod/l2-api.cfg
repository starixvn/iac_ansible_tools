
frontend l2_api
    bind *:8310
    mode  http
    option forwardfor
    default_backend l2_api_nodes

backend l2_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_api_PROD_ 2 l2_game_api_PROD:5000 check resolvers docker init-addr none