frontend l2_games_gateway
    bind *:8889
    mode  http
    option forwardfor

    use_backend l2_game_server_nodes_PROD if { path_beg /main/ }
    use_backend l2_sedie_nodes_PROD if { path_beg /sedie/ }
    use_backend l2_vip_sedie_nodes_PROD if { path_beg /vsedie/ }
    use_backend l2_special_sedie_nodes_PROD if { path_beg /specialsedie/ }
    use_backend l2_blackjack_node_PROD if { path_beg /blackjack/ }
    use_backend l2_vip_fish_prawn_crab_nodes_PROD if { path_beg /vipfishprawncrab/ }
    use_backend l2_sicbo_nodes_PROD if { path_beg /sicbo/ }
    use_backend l2_vip_baccarat_nodes_PROD if { path_beg /vipbaccarat/ }
    use_backend l2_vip_sedie_war_nodes_PROD if { path_beg /vipsediewar/ }
    use_backend l2_turbo_odd_even_nodes_PROD if { path_beg /turbooddeven/ }
    use_backend l2_keno_pro_max_service_nodes_PROD if { path_beg /kenopromax/ }
    use_backend l2_big_small_service_nodes_PROD if { path_beg /bigsmall/ }
    use_backend l2_user_service_nodes_PROD if { path_beg /user/ }
    use_backend l2_mini_sedie_service_nodes_PROD if { path_beg /minisedie/ }
    use_backend l2_turbo_big_small_service_nodes_PROD if { path_beg /turbobigsmall/ }
    use_backend l2_dragon_tiger_service_nodes_PROD if { path_beg /dragontiger/ }
    use_backend l2_baccarat_service_nodes_PROD if { path_beg /baccarat/ }
    use_backend l2_roulette_service_nodes_PROD if { path_beg /roulette/ }
    use_backend l2_fish_prawn_crab_service_nodes_PROD if { path_beg /fishprawncrab/ }
    use_backend l2_four_guardians_nodes_PROD if { path_beg /fourguardians/ }
    use_backend l2_lottery_nodes_PROD if { path_beg /lottery/ }
    use_backend l2_three_cards_nodes_PROD if { path_beg /threecards/ }
    use_backend l2_mini_keno_nodes_PROD if { path_beg /minikeno/ }
    use_backend l2_heroes_slot_service_PROD if { path_beg /heroesslot/ }
    use_backend l2_lucky_wheel_service_nodes_PROD if { path_beg /luckywheel/ }
    use_backend l2_keno_match_service_PROD_nodes if { path_beg /kenomatch/ }
    use_backend l2_keno_power_service_PROD_nodes if { path_beg /kenopower/ }

    default_backend l2_game_server_nodes_PROD

backend l2_keno_power_service_PROD_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/kenopower/,/)]
    server-template l2_keno_power_service_PROD_ 1 l2_keno_power_service_PROD:5000 check resolvers docker init-addr none

backend l2_keno_match_service_PROD_nodes
    option forwardfor
