backend l2_admin_site_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_admin_site_AWS_ 1 l2_admin_site_AWS:5000 check resolvers docker init-addr libc,none

backend l2_admin_api_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_admin_api_AWS_ 1 l2_admin_api_AWS:5000 check resolvers docker init-addr libc,none