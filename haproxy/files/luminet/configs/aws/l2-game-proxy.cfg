backend l2_game_server_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/main/,/)]
    server-template l2_game_server_AWS_ 1 l2_game_server_AWS:5000 check resolvers docker init-addr none

