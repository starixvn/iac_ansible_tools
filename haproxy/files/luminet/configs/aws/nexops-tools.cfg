frontend nexops_portainer
    bind *:9002
    mode  http
    option forwardfor
    default_backend nexops_portainer_nodes

backend nexops_portainer_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    option httpchk GET /
    http-check expect status 200
    server-template portainer 1 portainer_portainer:9000 resolvers docker init-addr none check

frontend ansible_awx
    bind *:8080
    mode  http
    option forwardfor
    default_backend ansible_awx_nodes

backend ansible_awx_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    option httpchk GET /
    http-check expect status 400
    server-template ansible_awx 1 10.2.27.28:8080 resolvers docker init-addr none check

frontend nexops_deploymentapi_nodes_fe
    bind *:22222
    mode http
    option forwardfor
    default_backend nexops_deploymentapi_nodes

backend nexops_deploymentapi_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server-template nexops_deployment_api_ 6 nexops_deployment_api:22222 check resolvers docker init-addr none

backend nexops_whoami_api_nodes
    option forwardfor
    #acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    #http-request deny if !is-whitelisted-ip
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server-template nexops_whoami_api_ 1 nexops_whoami_api:2211 check resolvers docker init-addr none

backend default_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "Empty backend! Pls contact NexOps if you think this is a mistake."
