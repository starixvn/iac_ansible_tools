frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 120s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    http-request return status 200 content-type "text/plain"  lf-string "HAProxy is running" if { path_beg /whoami }
   
    # SC1
    acl l1_api_proxy_host hdr(host) -i sc1-proxy.sportsfun.app

    http-request redirect scheme http drop-query append-slash if l1_api_proxy_host { path_beg /main } ! { path_beg /main/ } !{ path_beg /main } 
    use_backend l1_game_server_nodes if l1_api_proxy_host { path_beg /main }

    use_backend l1_game_client_nodes if { hdr(host) -i sc1-games.sportsfun.app }
    use_backend l1_api_nodes if { hdr(host) -i sc1-api.sportsfun.app }
    use_backend l1_admin_site_nodes if { hdr(host) -i sc1-adm.sportsfun.app }
    use_backend l1_game_round_result_nodes if { hdr(host) -i sc1-result.sportsfun.app }   

    # SC2
    acl l2_api_proxy_host hdr(host) -i sc2-proxy.sportsfun.app

    http-request redirect scheme http drop-query append-slash if l2_api_proxy_host { path_beg /main } ! { path_beg /main/ } !{ path_beg /main } 
    use_backend l2_game_server_nodes if l2_api_proxy_host { path_beg /main }

    use_backend l2_game_client_nodes if { hdr(host) -i sc2-games.sportsfun.app }
    use_backend l2_api_nodes if { hdr(host) -i sc2-api.sportsfun.app }
    use_backend l2_admin_site_nodes if { hdr(host) -i sc2-adm.sportsfun.app }
    use_backend l2_game_round_result_nodes if { hdr(host) -i sc2-result.sportsfun.app }   