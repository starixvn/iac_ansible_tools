frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
default_backend default_backend_nodes

frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 120s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    http-request return status 200 content-type "text/plain"  lf-string "HAProxy is running" if { path_beg /whoami }
   
    # SC1
    acl l1_api_proxy_host hdr(host) -i sc1-proxy.sportsfun.app

    http-request redirect scheme http drop-query append-slash if l1_api_proxy_host { path_beg /main } ! { path_beg /main/ } !{ path_beg /main } 
    use_backend l1_game_server_nodes if l1_api_proxy_host { path_beg /main }

    http-request redirect scheme http drop-query append-slash if l1_api_proxy_host { path_beg /sedie } ! { path_beg /sedie/ } !{ path_beg /sedie } 
    use_backend l1_sedie_service_nodes if l1_api_proxy_host { path_beg /sedie }

    http-request redirect scheme http drop-query append-slash if l1_api_proxy_host { path_beg /sicbo } ! { path_beg /sicbo/ } !{ path_beg /sicbo } 
    use_backend l1_sicbo_service_nodes if l1_api_proxy_host { path_beg /sicbo }

    http-request redirect scheme http drop-query append-slash if l1_api_proxy_host { path_beg /specialsedie } ! { path_beg /specialsedie/ } !{ path_beg /specialsedie } 
    use_backend l1_special_sedie_service_nodes if l1_api_proxy_host { path_beg /specialsedie }

    http-request redirect scheme http drop-query append-slash if l1_api_proxy_host { path_beg /vsedie } ! { path_beg /vsedie/ } !{ path_beg /vsedie } 
    use_backend l1_vip_sedie_service_nodes if l1_api_proxy_host { path_beg /vsedie }

    http-request redirect scheme http drop-query append-slash if l1_api_proxy_host { path_beg /blackjack } ! { path_beg /blackjack/ } !{ path_beg /blackjack } 
    use_backend l1_blackjack_service_nodes if l1_api_proxy_host { path_beg /blackjack }

    http-request redirect scheme http drop-query append-slash if l1_api_proxy_host { path_beg /vipbaccarat } ! { path_beg /vipbaccarat/ } !{ path_beg /vipbaccarat } 
    use_backend l1_vip_baccarat_service_nodes if l1_api_proxy_host { path_beg /vipbaccarat }

    http-request redirect scheme http drop-query append-slash if l1_api_proxy_host { path_beg /vipsediewar } ! { path_beg /vipsediewar/ } !{ path_beg /vipsediewar } 
    use_backend l1_vip_sedie_war_service_nodes if l1_api_proxy_host { path_beg /vipsediewar }

    http-request redirect scheme http drop-query append-slash if l1_api_proxy_host { path_beg /vipfishprawncrab } ! { path_beg /vipfishprawncrab/ } !{ path_beg /vipfishprawncrab/ }
    use_backend l1_vip_fish_prawn_crab_service_nodes if l1_api_proxy_host { path_beg /vipfishprawncrab }

    http-request redirect scheme http drop-query append-slash if l1_api_proxy_host { path_beg /fourguardians } ! { path_beg /fourguardians/ } !{ path_beg /fourguardians/ }
    use_backend l1_four_guardians_service_nodes if l1_api_proxy_host { path_beg /fourguardians }

    use_backend l1_game_client_nodes if { hdr(host) -i sc1-games.sportsfun.app }
    use_backend l1_api_nodes if { hdr(host) -i sc1-api.sportsfun.app }
    use_backend l1_admin_site_nodes if { hdr(host) -i sc1-adm.sportsfun.app }
    use_backend l1_game_round_result_nodes if { hdr(host) -i sc1-result.sportsfun.app }   

    # SC2
    acl l2_api_proxy_host hdr(host) -i sc2-proxy.sportsfun.app

    http-request redirect scheme http drop-query append-slash if l2_api_proxy_host { path_beg /main } ! { path_beg /main/ } !{ path_beg /main } 
    use_backend l2_game_server_nodes if l2_api_proxy_host { path_beg /main }

    http-request redirect scheme http drop-query append-slash if l2_api_proxy_host { path_beg /sedie } ! { path_beg /sedie/ } !{ path_beg /sedie } 
    use_backend l2_sedie_service_nodes if l2_api_proxy_host { path_beg /sedie }

    http-request redirect scheme http drop-query append-slash if l2_api_proxy_host { path_beg /sicbo } ! { path_beg /sicbo/ } !{ path_beg /sicbo } 
    use_backend l2_sicbo_service_nodes if l2_api_proxy_host { path_beg /sicbo }

    http-request redirect scheme http drop-query append-slash if l2_api_proxy_host { path_beg /specialsedie } ! { path_beg /specialsedie/ } !{ path_beg /specialsedie } 
    use_backend l2_special_sedie_service_nodes if l2_api_proxy_host { path_beg /specialsedie }

    http-request redirect scheme http drop-query append-slash if l2_api_proxy_host { path_beg /vsedie } ! { path_beg /vsedie/ } !{ path_beg /vsedie } 
    use_backend l2_vip_sedie_service_nodes if l2_api_proxy_host { path_beg /vsedie }

    http-request redirect scheme http drop-query append-slash if l2_api_proxy_host { path_beg /blackjack } ! { path_beg /blackjack/ } !{ path_beg /blackjack } 
    use_backend l2_blackjack_service_nodes if l2_api_proxy_host { path_beg /blackjack }

    http-request redirect scheme http drop-query append-slash if l2_api_proxy_host { path_beg /vipbaccarat } ! { path_beg /vipbaccarat/ } !{ path_beg /vipbaccarat } 
    use_backend l2_vip_baccarat_service_nodes if l2_api_proxy_host { path_beg /vipbaccarat }

    http-request redirect scheme http drop-query append-slash if l2_api_proxy_host { path_beg /vipsediewar } ! { path_beg /vipsediewar/ } !{ path_beg /vipsediewar } 
    use_backend l2_vip_sedie_war_service_nodes if l2_api_proxy_host { path_beg /vipsediewar }

    http-request redirect scheme http drop-query append-slash if l2_api_proxy_host { path_beg /vipfishprawncrab } ! { path_beg /vipfishprawncrab/ } !{ path_beg /vipfishprawncrab/ }
    use_backend l2_vip_fish_prawn_crab_service_nodes if l2_api_proxy_host { path_beg /vipfishprawncrab }

    http-request redirect scheme http drop-query append-slash if l2_api_proxy_host { path_beg /fourguardians } ! { path_beg /fourguardians/ } !{ path_beg /fourguardians/ }
    use_backend l2_four_guardians_service_nodes if l2_api_proxy_host { path_beg /fourguardians }

    use_backend l2_game_client_nodes if { hdr(host) -i sc2-games.sportsfun.app }
    use_backend l2_api_nodes if { hdr(host) -i sc2-api.sportsfun.app }
    use_backend l2_admin_site_nodes if { hdr(host) -i sc2-adm.sportsfun.app }
    use_backend l2_game_round_result_nodes if { hdr(host) -i sc2-result.sportsfun.app }

    use_backend nexops_deploymentapi_nodes if { hdr(host) -i deployment-api.sportsfun.app }
    use_backend nexops_whoami_api_nodes if { hdr(host) -i haproxy.sportsfun.app }
