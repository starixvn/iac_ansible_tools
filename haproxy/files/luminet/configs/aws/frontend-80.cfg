frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
default_backend default_backend_nodes

frontend http_in
    bind *:80
    mode http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 120s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    use_backend %[path,map_beg(/etc/haproxy/l1-game-proxy.map)] if { hdr(host) -i sc1-proxy.sportsfun.app }
    use_backend %[path,map_beg(/etc/haproxy/l2-game-proxy.map)] if { hdr(host) -i sc2-proxy.sportsfun.app }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/hosts.map)]

default_backend default_backend_nodes
