
backend l2_keno_match_service_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/kenomatch/,/)]
    server-template l2_keno_match_service_LOCAL_ 1 l2_keno_match_service_LOCAL:5000 check resolvers docker init-addr none

