
backend l2_auth_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_auth_api 1 l2-auth-api-LOCAL:9101 check resolvers docker init-addr libc,none

backend l2_auth_api_nodes_1
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_auth_api_LOCAL_1_ 1 l2_auth_api_LOCAL_1:5000 check resolvers docker init-addr libc,none
    