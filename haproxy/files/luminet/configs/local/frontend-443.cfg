frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/lumigame.com.pem alpn h2,http/1.1
    mode http
    option forwardfor
    option http-keep-alive
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    option forwardfor
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    # L1 - LOCAL
    use_backend l1_game_client_mobi_nodes if { hdr(host) -i l1-m.lumigame.com }
    http-response set-header Cache-Control public,max-age=31536000 if { hdr(host) -i l1-m.lumigame.com }
    use_backend l1_game_client_nodes if { hdr(host) -i games.lumigame.com }
    use_backend l1_game_admin_api_nodes if { hdr(host) -i admin-api.lumigame.com }
    use_backend l1_api_nodes if { hdr(host) -i api.lumigame.com }
