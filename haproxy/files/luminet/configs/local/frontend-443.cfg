frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/lumigame.com.pem alpn h2,http/1.1
    mode http
    option forwardfor
    option http-keep-alive
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    option forwardfor
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    # L1
    use_backend l1_game_client_mobi_nodes if { hdr(host) -i l1-m.lumigame.com }
    http-response set-header Cache-Control public,max-age=31536000 if { hdr(host) -i l1-m.lumigame.com }

    use_backend l1_game_client_mobi_nodes_1 if { hdr(host) -i l1-m1.lumigame.com }
    use_backend l1_game_server_nodes_1 if { path_beg /main/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_sedie_nodes_1 if { path_beg /sedie/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_vip_sedie_nodes_1 if { path_beg /vsedie/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_special_sedie_nodes_1 if { path_beg /specialsedie/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_blackjack_node_1 if { path_beg /blackjack/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_vip_fish_prawn_crab_nodes_1 if { path_beg /vipfishprawncrab/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_sicbo_nodes_1 if { path_beg /sicbo/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_vip_baccarat_nodes_1 if { path_beg /vipbaccarat/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_vip_sedie_war_nodes_1 if { path_beg /vipsediewar/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_turbo_odd_even_nodes_1 if { path_beg /turbooddeven/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_keno_pro_max_service_nodes_1 if { path_beg /kenopromax/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_big_small_service_nodes_1 if { path_beg /bigsmall/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_user_service_nodes_1 if { path_beg /user/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_mini_sedie_service_nodes_1 if { path_beg /minisedie/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_turbo_big_small_service_nodes_1 if { path_beg /turbobigsmall/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_dragon_tiger_service_nodes_1 if { path_beg /dragontiger/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_baccarat_service_nodes_1 if { path_beg /baccarat/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_roulette_service_nodes_1 if { path_beg /roulette/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_fish_prawn_crab_service_nodes_1 if { path_beg /fishprawncrab/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_four_guardians_nodes_1 if { path_beg /fourguardians/ } { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_lottery_nodes_1 if { path_beg /lottery/ } { hdr(host) -i l1-proxy1.lumigame.com }

    use_backend l1_game_client_mobi_nodes_2 if { hdr(host) -i l1-m2.lumigame.com }

    use_backend l2_game_client_mobi_nodes if { hdr(host) -i l2-m.lumigame.com }



    # tools 
    use_backend sonarqube_nodes if { hdr(host) -i sonarqube.lumigame.com }
    use_backend verdacio_nodes if { hdr(host) -i npm.lumigame.com }
    use_backend sentry_web_nodes if { hdr(host) -i sentry.lumigame.com }
    use_backend rocketor_nodes if { hdr(host) -i deploy.lumigame.com }