frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/lumigame.com.pem alpn h2,http/1.1
    mode http
    option forwardfor
    option http-keep-alive
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats show-modules
    stats auth lumi:lum!onRock

    # L2 - LOCAL - LOCAL1 # L1 - LOCAL_2 LOCAL_1 LOCAL
    #http-response set-header Cache-Control public,max-age=31536000 if { hdr(host) -i l1-m2.lumigame.com } { hdr(host) -i l1-m1.lumigame.com } { hdr(host) -i l1-m.lumigame.com } { hdr(host) -i l2-m1.lumigame.com } { hdr(host) -i l2-m.lumigame.com }
    acl mobile_cache hdr_beg(host) -i l1-m[^.].lumigame.com hdr_beg(host) -i l2-m[^.].lumigame.com
    http-response set-header Cache-Control public,max-age=31536000 if mobile_cache
    use_backend %[path,map_beg(/etc/haproxy/l1-game-proxy2.map)] if { hdr(host) -i l1-proxy2.lumigame.com }
    use_backend %[path,map_beg(/etc/haproxy/l1-game-proxy1.map)] if { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend %[path,map_beg(/etc/haproxy/l1-game-proxy.map)] if { hdr(host) -i l1-proxy.lumigame.com }
    use_backend %[path,map_beg(/etc/haproxy/l2-game-proxy1.map)] if { hdr(host) -i l2-proxy1.lumigame.com }
    use_backend %[path,map_beg(/etc/haproxy/l2-game-proxy.map)] if { hdr(host) -i l2-proxy.lumigame.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/hosts.map)]
    
default_backend default_backend_nodes
