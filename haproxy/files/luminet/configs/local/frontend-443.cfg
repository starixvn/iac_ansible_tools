frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/lumigame.com.pem alpn h2,http/1.1
    mode http
    option forwardfor
    option http-keep-alive
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    option forwardfor
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    # L1
    use_backend l1_game_client_mobi_nodes if { hdr(host) -i l1-m.lumigame.com }
    http-response set-header Cache-Control public,max-age=31536000 if { hdr(host) -i l1-m.lumigame.com }

    use_backend l1_game_client_mobi_nodes_1 if { hdr(host) -i l1-m1.lumigame.com }
    http-response set-header Cache-Control public,max-age=31536000 if { hdr(host) -i l1-m1.lumigame.com }

    use_backend l1_game_client_mobi_nodes_2 if { hdr(host) -i l1-m2.lumigame.com }

    use_backend l2_game_client_mobi_nodes if { hdr(host) -i l2-m.lumigame.com }

    # tools 
    use_backend sonarqube_nodes if { hdr(host) -i sonarqube.lumigame.com }
    use_backend verdacio_nodes if { hdr(host) -i npm.lumigame.com }
    use_backend sentry_web_nodes if { hdr(host) -i sentry.lumigame.com }
    use_backend rocketor_nodes if { hdr(host) -i deploy.lumigame.com }