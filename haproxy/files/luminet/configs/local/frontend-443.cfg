frontend https_in
    bind *:443 ssl crt /usr/local/etc/haproxy/lumigame.com.pem alpn h2,http/1.1
    mode http
    option forwardfor
    option http-keep-alive
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    redirect scheme https code 301 if !{ ssl_fc }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats show-modules
    stats auth lumi:lum!onRock

    # L1 - LOCAL
    http-response set-header Cache-Control public,max-age=31536000 if { hdr(host) -i l1-m.lumigame.com }

    use_backend l1_game_server_nodes if { path_beg /main/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_sedie_nodes if { path_beg /sedie/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_vip_sedie_nodes if { path_beg /vsedie/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_special_sedie_nodes if { path_beg /specialsedie/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_blackjack_node if { path_beg /blackjack/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_vip_fish_prawn_crab_nodes if { path_beg /vipfishprawncrab/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_sicbo_nodes if { path_beg /sicbo/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_vip_baccarat_nodes if { path_beg /vipbaccarat/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_vip_sedie_war_nodes if { path_beg /vipsediewar/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_turbo_odd_even_nodes if { path_beg /turbooddeven/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_keno_pro_max_service_nodes if { path_beg /kenopromax/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_big_small_service_nodes if { path_beg /bigsmall/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_user_service_nodes if { path_beg /user/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_mini_sedie_service_nodes if { path_beg /minisedie/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_turbo_big_small_service_nodes if { path_beg /turbobigsmall/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_dragon_tiger_service_nodes if { path_beg /dragontiger/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_baccarat_service_nodes if { path_beg /baccarat/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_roulette_service_nodes if { path_beg /roulette/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_fish_prawn_crab_service_nodes if { path_beg /fishprawncrab/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_four_guardians_nodes if { path_beg /fourguardians/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_lottery_nodes if { path_beg /lottery/ } { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_three_cards_nodes if { path_beg /threecards/ }  { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_keno_soccer_nodes if { path_beg /kenosoccer/ }  { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_heroes_slot_nodes if { path_beg /heroesslot/ }  { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_keno_match_nodes if { path_beg /kenomatch/ }  { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_mini_keno_nodes if { path_beg /minikeno/ }  { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_keno_power_nodes if { path_beg /kenopower/ }  { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_bitcoin_master_nodes if { path_beg /bitcoinmaster/ }  { hdr(host) -i l1-proxy.lumigame.com }
    use_backend l1_casino_holdem_poker_nodes if { path_beg /casinoholdempoker/ }  { hdr(host) -i l1-proxy.lumigame.com }

    # L2 - LOCAL - LOCAL1 # L1 - LOCAL_2 LOCAL_1
    http-response set-header Cache-Control public,max-age=31536000 if { hdr(host) -i l1-m2.lumigame.com }
    http-response set-header Cache-Control public,max-age=31536000 if { hdr(host) -i l1-m1.lumigame.com }
    http-response set-header Cache-Control public,max-age=31536000 if { hdr(host) -i l2-m1.lumigame.com }
    http-response set-header Cache-Control public,max-age=31536000 if { hdr(host) -i l2-m.lumigame.com }
    use_backend %[path,map_beg(/etc/haproxy/l1-game-proxy2.map)] if { hdr(host) -i l1-proxy2.lumigame.com }
    use_backend %[path,map_beg(/etc/haproxy/l1-game-proxy1.map)] if { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend %[path,map_beg(/etc/haproxy/l2-game-proxy1.map)] if { hdr(host) -i l2-proxy1.lumigame.com }
    use_backend %[path,map_beg(/etc/haproxy/l2-game-proxy.map)] if { hdr(host) -i l2-proxy.lumigame.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/hosts.map)]
    
default_backend default_backend_nodes
