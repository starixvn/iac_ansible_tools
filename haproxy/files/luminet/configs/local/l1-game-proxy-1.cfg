
frontend l1_games_proxy_1
    bind *:7002
    mode  http
    option forwardfor
    use_backend l1_game_server1_nodes if { path_beg /main/ }
    use_backend l1_sedie1_nodes if { path_beg /sedie/ }
    use_backend l1_vip_sedie1_nodes if { path_beg /vipsedie/ }
    use_backend l1_special_sedie1_nodes if { path_beg /specialsedie/ }
    use_backend l1_blackjack1_nodes if { path_beg /blackjack/ }
    use_backend l1_vip_fishprawncrab1_nodes if { path_beg /vipfishprawncrab/ }
    use_backend l1_sicbo1_nodes if { path_beg /sicbo/ }
    use_backend l1_vip_baccarat1_nodes if { path_beg /vipbaccarat/ }
    use_backend l1_vip_sedie_war1_nodes if { path_beg /vipsediewar/ }
    use_backend l1_turbo_odd_even_nodes if { path_beg /turbooddeven/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /kenopromax } ! { path_beg /kenopromax/ }
    use_backend l1_keno_pro_max_service_nodes_1 if { path_beg /kenopromax/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /bigsmall } ! { path_beg /bigsmall/ }
    use_backend l1_big_small_service_nodes_1 if { path_beg /bigsmall/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /user } ! { path_beg /user/ }
    use_backend l1_user_service_nodes_1 if { path_beg /user/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /minisedie } ! { path_beg /minisedie/ }
    use_backend l1_mini_sedie_service_nodes_1 if { path_beg /minisedie/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /turbobigsmall } ! { path_beg /turbobigsmall/ }
    use_backend l1_turbo_big_small_service_nodes_1 if { path_beg /turbobigsmall/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /dragontiger } ! { path_beg /dragontiger/ }
    use_backend l1_dragon_tiger_service_nodes_1 if { path_beg /dragontiger/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /baccarat } ! { path_beg /baccarat/ }
    use_backend l1_baccarat_service_nodes_1 if { path_beg /baccarat/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /roulette } ! { path_beg /roulette/ }
    use_backend l1_roulette_service_nodes_1 if { path_beg /roulette/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /fishprawncrab } ! { path_beg /fishprawncrab/ }
    use_backend l1_fish_prawn_crab_service_nodes_1 if { path_beg /fishprawncrab/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /fourguardians } ! { path_beg /fourguardians/ }
    use_backend l2_four_guardians_nodes_1 if { path_beg /fourguardians/ }

    default_backend l1_game_server1_nodes

backend l1_game_server1_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /main/(.*) /\1
    server-template l1_game_server 1 l1-game-server-LOCAL-1:5000 check resolvers docker init-addr libc,none

