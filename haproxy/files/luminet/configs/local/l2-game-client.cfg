
backend l2_game_client_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_client_LOCAL_ 1 l2_game_client_LOCAL:80 check resolvers docker init-addr libc,none

