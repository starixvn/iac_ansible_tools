
backend l2_game_client_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_client 1 l2-game-client-LOCAL:80 check resolvers docker init-addr libc,none


backend l2_game_client_nodes_1
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_client_LOCAL_1 1 l2_game_client_LOCAL_1:80 check resolvers docker init-addr libc,none