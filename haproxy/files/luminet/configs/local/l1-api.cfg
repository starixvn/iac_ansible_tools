
backend l1_api_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_api_LOCAL_ 2 l1_game_api_LOCAL:5000 check resolvers docker init-addr libc,none

backend l1_api_nodes_1
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /v1/(.*) /\1
    server-template l1_game_api_LOCAL_1_ 2 l1_game_api_LOCAL_1:5000 check resolvers docker init-addr libc,none