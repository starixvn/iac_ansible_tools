
backend l1_api_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_api_LOCAL_ 5 l1_game_api_LOCAL:5000 check resolvers docker init-addr libc,none

