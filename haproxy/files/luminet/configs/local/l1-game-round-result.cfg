
backend l1_game_result_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_result_LOCAL_1 1 l1_game_result_LOCAL:5000 check resolvers docker init-addr libc,none

