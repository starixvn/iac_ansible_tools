frontend http_in
    bind *:80
    mode  http
    option forwardfor
    option http-keep-alive
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats show-modules
    stats auth lumi:lum!onRock

    #use_backend l1_oldgame_client_nodes if { hdr(host) -i oldgames.lumigame.com }
    # L1 - LOCAL
    acl none_https hdr(host) -m reg -i l[^\.]-auth[^\.]*\.lumigame.com$ -i auth.lumigame.com hdr(host) -i oldgames.lumigame.com hdr(host) -i npm.lumigame.com
    http-request redirect scheme https if !none_https
    #use_backend verdacio_npm_nodes if { hdr(host) -i npm.lumigame.com }
    use_backend %[path,map_beg(/etc/haproxy/l1-game-proxy2.map)] if { hdr(host) -i l1-proxy2.lumigame.com }
    use_backend %[path,map_beg(/etc/haproxy/l1-game-proxy1.map)] if { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend %[path,map_beg(/etc/haproxy/l1-game-proxy.map)] if { hdr(host) -i l1-proxy.lumigame.com }
    use_backend %[path,map_beg(/etc/haproxy/l2-game-proxy1.map)] if { hdr(host) -i l2-proxy1.lumigame.com }
    use_backend %[path,map_beg(/etc/haproxy/l2-game-proxy.map)] if { hdr(host) -i l2-proxy.lumigame.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/hosts.map)]

default_backend default_backend_nodes