frontend http_in
    bind *:80
    mode  http
    option forwardfor
    option http-keep-alive
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    use_backend l1_oldgame_client_nodes if { hdr(host) -i oldgames.lumigame.com }

    # L1
    #### LOCAL
    use_backend l1_game_client_nodes if { hdr(host) -i games.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-m.lumigame.com }
    use_backend l1_api_nodes if { hdr(host) -i api.lumigame.com }
    use_backend l1_auth_api_nodes if { hdr(host) -i auth.lumigame.com }
    use_backend l1_game_admin_site_nodes if {  hdr(host) -i admin.lumigame.com }
    use_backend l1_game_admin_api_nodes if { hdr(host) -i admin-api.lumigame.com }
    use_backend l1_gamelobby_simulator_nodes if { hdr(host) -i gamelobby-simulator.lumigame.com }
    use_backend l1_owapi_simulator_nodes if { hdr(host) -i owapi-simulator.lumigame.com }
    use_backend l1_game_result_nodes if { hdr(host) -i result.lumigame.com }

    #### LOCAL_1
    http-request redirect scheme https if { hdr(host) -i l1-proxy1.lumigame.com }
    use_backend l1_game_client_nodes_1 if { hdr(host) -i l1-games1.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-m1.lumigame.com }
    use_backend l1_api_nodes_1 if { hdr(host) -i l1-api1.lumigame.com }
    use_backend l1_auth_api_nodes_1 if { hdr(host) -i l1-auth1.lumigame.com }
    use_backend l1_game_admin_site_nodes_1 if {  hdr(host) -i l1-admin1.lumigame.com }
    use_backend l1_game_admin_api_nodes_1 if { hdr(host) -i l1-admin-api1.lumigame.com }
    use_backend l1_gamelobby_simulator_nodes_1 if { hdr(host) -i l1-glbs1.lumigame.com }
    use_backend l1_owapi_simulator_nodes_1 if { hdr(host) -i l1-ows1.lumigame.com }
    use_backend l1_game_result_nodes_1 if { hdr(host) -i l1-result1.lumigame.com }

    #### LOCAL_2
    use_backend l1_game_client_nodes_2 if { hdr(host) -i l1-games2.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i l1-m2.lumigame.com }
    use_backend l1_api_nodes_2 if { hdr(host) -i l1-api2.lumigame.com }
    use_backend l1_auth_api_nodes_2 if { hdr(host) -i l1-auth2.lumigame.com }
    use_backend l1_game_admin_site_nodes_2 if {  hdr(host) -i l1-admin2.lumigame.com }
    use_backend l1_gamelobby_simulator_nodes_2 if { hdr(host) -i l1-glbs2.lumigame.com }
    use_backend l1_owapi_simulator_nodes_2 if { hdr(host) -i l1-ows2.lumigame.com }
    use_backend l1_game_result_nodes_2 if { hdr(host) -i l1-result2.lumigame.com }

    # L2
    use_backend l2_game_client_nodes if { hdr(host) -i l2-games.lumigame.com }
    use_backend l2_game_client_mobi_nodes if { hdr(host) -i l2-m.lumigame.com }
    use_backend l2_api_nodes if { hdr(host) -i l2-api.lumigame.com }
    use_backend l2_auth_api_nodes if { hdr(host) -i l2-auth.lumigame.com }
    use_backend l2_game_admin_site_nodes if { hdr(host) -i l2-admin.lumigame.com }
    use_backend l2_game_admin_api_nodes if { hdr(host) -i l2-admin-api.lumigame.com }
    use_backend l2_gamelobby_simulator_nodes if { hdr(host) -i l2-glbs.lumigame.com }
    use_backend l2_owapi_simulator_nodes if { hdr(host) -i l2-ows.lumigame.com }
    use_backend l2_game_round_result_nodes if { hdr(host) -i l2-result.lumigame.com }
    use_backend l2_game_news_nodes if { hdr(host) -i l2-news.lumigame.com }

    # L2 - LOCAL_1
    use_backend l2_game_client_nodes_1 if { hdr(host) -i l2-games1.lumigame.com }
    use_backend l2_api_nodes_1 if { hdr(host) -i l2-api1.lumigame.com }
    use_backend l2_auth_api_nodes_1 if { hdr(host) -i l2-auth1.lumigame.com }
    use_backend l2_game_admin_site_nodes_1 if { hdr(host) -i l2-admin1.lumigame.com }
    use_backend l2_game_admin_api_nodes if { hdr(host) -i l2-admin-api1.lumigame.com }
    use_backend l2_gamelobby_simulator_nodes_1 if { hdr(host) -i l2-glbs1.lumigame.com }
    use_backend l2_owapi_simulator_nodes_1 if { hdr(host) -i l2-ows1.lumigame.com }
    use_backend l2_game_round_result_nodes_1 if { hdr(host) -i l2-result1.lumigame.com }

    # tools 
    use_backend verdacio_nodes if { hdr(host) -i npm.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i sentry.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i sonarqube.lumigame.com }
    http-request redirect scheme https if { hdr(host) -i deploy.lumigame.com }