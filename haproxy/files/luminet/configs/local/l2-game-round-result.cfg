
backend l2_game_result_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_result_LOCAL_1 1 l2_game_result_LOCAL:5000 check resolvers docker init-addr libc,none

backend l2_game_result_nodes_1
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_result_LOCAL_1_ 1 l2_game_result_LOCAL_1:5000 check resolvers docker init-addr libc,none