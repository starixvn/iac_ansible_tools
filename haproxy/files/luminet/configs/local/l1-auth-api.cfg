
backend l1_auth_api_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_auth_api_LOCAL_ 1 l1_auth_api_LOCAL:5000 check resolvers docker init-addr libc,none
    
backend l1_auth_api_nodes_1
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_auth_api_LOCAL_1_ 1 l1_auth_api_LOCAL_1:5000 check resolvers docker init-addr libc,none