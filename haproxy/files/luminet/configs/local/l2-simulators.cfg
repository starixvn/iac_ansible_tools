
backend l2_gamelobby_simulator_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_lobby_simulator_LOCAL_ 1 l2_game_lobby_simulator_LOCAL:5000 check resolvers docker init-addr libc,none

