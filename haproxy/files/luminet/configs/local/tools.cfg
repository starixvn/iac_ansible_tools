backend sonarqube_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template sonarqube 1 10.10.50.15:9011 check resolvers docker init-addr libc,none

backend verdacio_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template verdacio 1 npm_verdaccio:4873 check resolvers  docker init-addr libc,none

backend sentry_web_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /auth/login/luminet/
    http-check expect status 200
    cookie serverid insert
    server-template sentry_web_lumi_ 2 sentry_web_lumi:9000 check resolvers docker init-addr libc,none

frontend rabbitmq_frontend
    bind *:5672
    mode http
    use_backend rabbitmq_nodes

backend rabbitmq_nodes
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template rabbitmq_rabbit_ 2 rabbitmq_rabbit:5672 check resolvers docker init-addr libc,none

backend rocketor_nodes
    mode http
	log global
    option http-keep-alive
	balance source
	timeout client 30m
    timeout server 30m
    timeout check 30s
    http-check expect status 401
    option httpchk GET /
	default-server  inter 3s fall 3 rise 2
    server rocketor_1 10.10.50.24:8888 check
    server rocketor_2 10.10.50.25:8888 check