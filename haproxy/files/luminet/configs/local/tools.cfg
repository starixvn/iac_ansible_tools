backend backend_for_testing_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /-/ping
    http-check expect status 200
    cookie serverid insert
    server-template nexops_verdaccio_npm_ 1 nexops_verdaccio_npm:4873 check resolvers  docker init-addr none

backend elk_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /login
    http-check expect status 200
    #cookie serverid insert
    server-template elk_kibana_ 1 elk_kibana:5601 check resolvers  docker init-addr none

backend sonarqube_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template sonarqube 1 10.10.50.15:9011 check resolvers docker init-addr none

backend verdacio_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    #cookie serverid insert
    server-template verdacio 1 npm_verdaccio:4873 check resolvers  docker init-addr none

backend verdacio_npm_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /-/ping
    http-check expect status 200
    #cookie serverid insert
    server-template nexops_verdaccio_npm_ 1 nexops_verdaccio_npm:4873 check resolvers  docker init-addr none

backend sentry_web_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /account/recover/
    http-check expect status 200
    cookie serverid insert
    #server-template sentry_web_lumi_ 1 10.10.50.69:9040 check resolvers docker init-addr none
    server-template sentry_web_local_ 2 sentry_web_local:9000 check resolvers docker init-addr none

frontend rabbitmq_frontend
    bind *:5672
    mode tcp
    use_backend rabbitmq_nodes

backend rabbitmq_nodes
    mode tcp
    option forwardfor
    option http-server-close
    cookie serverid insert
    server-template rabbitmq_rabbit_ 2 rabbitmq_rabbit:5672 check resolvers docker init-addr none

backend rocketor_nodes
    mode http
    log global
    option http-keep-alive
    balance source
    timeout client 30m
    timeout server 30m
    timeout check 30s
    http-check expect status 401
    option httpchk GET /
    default-server  inter 3s fall 3 rise 2
    server rocketor_1 10.10.50.24:8888 check
    server rocketor_2 10.10.50.25:8888 check

backend nexops_deploymentapi_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server-template nexops_deployment_api_ 6 nexops_deployment_api:22222 check resolvers docker init-addr none

backend default_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "Empty backend! Pls contact NexOps if you think this is a mistake" #if { path_beg /whoami }
