
backend l2_api_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_api_LOCAL_ 2 l2_game_api_LOCAL:5000 check resolvers docker init-addr libc,none

backend l2_api_nodes_1
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_api_LOCAL_1 2 l2_game_api_LOCAL_1:5000 check resolvers docker init-addr libc,none
    