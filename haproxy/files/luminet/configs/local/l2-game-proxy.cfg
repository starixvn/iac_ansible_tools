
frontend l2_games_proxy
    bind *:7001
    mode  http
    option forwardfor
    use_backend l2_game_server_nodes if { path_beg /main/ }
    use_backend l2_sedie_nodes if { path_beg /sedie/ }
    use_backend l2_vip_sedie_nodes if { path_beg /vipsedie/ }
    use_backend l2_special_sedie_nodes if { path_beg /specialsedie/ }
    use_backend l2_blackjack_nodes if { path_beg /blackjack/ }
    use_backend l2_vip_fishprawncrab_nodes if { path_beg /vipfishprawncrab/ }
    use_backend l2_sicbo_nodes if { path_beg /sicbo/ }
    use_backend l2_four_guardians_nodes if { path_beg /fourguardians/ }
    use_backend l2_vip_sedie_war_nodes if { path_beg /vipsediewar/ }
    use_backend l2_vip_baccarat_nodes if { path_beg /vipbaccarat/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /kenopromax } ! { path_beg /kenopromax/ }
    use_backend l2_keno_pro_max_service_nodes if { path_beg /kenopromax/ }

    default_backend l2_game_server_nodes

backend l2_game_server_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /main/(.*) /\1
    server-template l2_game_server 1 l2_game_server_LOCAL:5000 check resolvers docker init-addr libc,none

