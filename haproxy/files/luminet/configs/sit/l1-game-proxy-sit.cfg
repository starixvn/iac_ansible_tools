    default_backend l1_game_server_nodes_SIT

backend l1_game_server_nodes_SIT
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/sit/main/,/)]
    server-template l1_game_server_SIT_ 1 l1_game_server_SIT:5000 check resolvers docker init-addr libc,none

