
frontend l1_games_proxy
    bind *:7777
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock
    mode  http
    option forwardfor

    ###### SIT #######
    http-request redirect scheme http drop-query append-slash if { path_beg /sit/main } ! { path_beg /sit/main/ }
    use_backend l1_game_server_nodes_SIT if { path_beg /sit/main/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/sedie } ! { path_beg /sit/sedie/ }
    use_backend l1_sedie_nodes_SIT if { path_beg /sit/sedie/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /sit/vsedie } ! { path_beg /sit/vsedie/ }
