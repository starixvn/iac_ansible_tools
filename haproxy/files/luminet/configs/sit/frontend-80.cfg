frontend http_in
    bind *:80
    mode  http
    option forwardfor
    option http-keep-alive

    # L1
    use_backend l1_game_client_mobi_nodes_SIT if { hdr(host) -i sitm.sabagame.com }
    use_backend l1_game_client_mobi_nodes_UAT if { hdr(host) -i uatm.sabagame.com }
    use_backend l1_game_guides_nodes_sit if { hdr(host) -i guidessit.sabagame.com }
    use_backend l1_game_guides_nodes_uat if { hdr(host) -i guidesuat.sabagame.com }

    # L2
    use_backend l2_game_client_mobi_nodes_SIT if { hdr(host) -i sitm.sabagame.net }
    use_backend l2_game_client_mobi_nodes_UAT if { hdr(host) -i uatm.sabagame.net }
    use_backend l2_game_guides_nodes_sit if { hdr(host) -i guidessit.sabagame.net }
    use_backend l2_game_guides_nodes_uat if { hdr(host) -i guidesuat.sabagame.net }