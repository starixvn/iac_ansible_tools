
frontend l1_games_prox
    bind *:7777
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock
    mode  http
    option forwardfor
    http-request redirect scheme http drop-query append-slash if { path_beg /uat/main } ! { path_beg /uat/main/ }
    use_backend l1_game_server_nodes_UAT if { path_beg /uat/main/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/sedie } ! { path_beg /uat/sedie/ }
    use_backend l1_sedie_nodes_UAT if { path_beg /uat/sedie/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/vsedie } ! { path_beg /uat/vsedie/ }
    use_backend l1_vip_sedie_nodes_UAT if { path_beg /uat/vsedie/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/specialsedie } ! { path_beg /uat/specialsedie/ }
    use_backend l1_special_sedie_nodes_UAT if { path_beg /uat/specialsedie/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/blackjack } ! { path_beg /uat/blackjack/ }
    use_backend l1_blackjack_node_UAT if { path_beg /uat/blackjack/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /vipfishprawncrab } ! { path_beg /vipfishprawncrab/ }
    use_backend l1_vip_fish_prawn_crab_nodes_UAT if { path_beg /uat/vipfishprawncrab/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /sicbo } ! { path_beg /uat/sicbo/ }
    use_backend l1_sicbo_nodes_UAT if { path_beg /uat/sicbo/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/vipbaccarat } ! { path_beg /uat/vipbaccarat/ }
    use_backend l1_vip_baccarat_nodes_UAT if { path_beg /uat/vipbaccarat/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/vipsediewar } ! { path_beg /uat/vipsediewar/ }
    use_backend l1_vip_sedie_war_nodes_UAT if { path_beg /uat/vipsediewar/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/turbooddeven } ! { path_beg /uat/turbooddeven/ }
    use_backend l1_turbo_odd_even_nodes_UAT if { path_beg /uat/turbooddeven/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/kenopromax } ! { path_beg /uat/kenopromax/ }
    use_backend l1_keno_pro_max_service_nodes_UAT if { path_beg /uat/kenopromax/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/bigsmall } ! { path_beg /uat/bigsmall/ }
    use_backend l1_big_small_service_nodes_UAT if { path_beg /uat/bigsmall/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/user } ! { path_beg /uat/user/ }
    use_backend l1_user_service_nodes_UAT if { path_beg /uat/user/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/minisedie } ! { path_beg /uat/minisedie/ }
    use_backend l1_mini_sedie_service_nodes_UAT if { path_beg /uat/minisedie/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/turbobigsmall } ! { path_beg /uat/turbobigsmall/ }
    use_backend l1_turbo_big_small_service_nodes_UAT if { path_beg /uat/turbobigsmall/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/dragontiger } ! { path_beg /uat/dragontiger/ }
    use_backend l1_dragon_tiger_service_nodes_UAT if { path_beg /uat/dragontiger/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/baccarat } ! { path_beg /uat/baccarat/ }
    use_backend l1_baccarat_service_nodes_UAT if { path_beg /uat/baccarat/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/roulette } ! { path_beg /uat/roulette/ }
    use_backend l1_roulette_service_nodes_UAT if { path_beg /uat/roulette/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/fishprawncrab } ! { path_beg /uat/fishprawncrab/ }
    use_backend l1_fish_prawn_crab_service_nodes_UAT if { path_beg /uat/fishprawncrab/ }

    http-request redirect scheme http drop-query append-slash if { path_beg /uat/fourguardians } ! { path_beg /uat/fourguardians/ }
    use_backend l1_four_guardians_nodes_UAT if { path_beg /uat/fourguardians/ }

    default_backend l1_game_server_nodes_UAT

backend l1_game_server_nodes_UAT
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/uat/main/,/)]
    server-template l1_game_server_UAT_ 1 l1_game_server_UAT:5000 check resolvers docker init-addr libc,none

