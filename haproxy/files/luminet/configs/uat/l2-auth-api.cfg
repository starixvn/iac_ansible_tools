
frontend l2_auth_api_sit
    bind *:6313
    mode  http
    option forwardfor
    default_backend l2_auth_api_nodes_sit

backend l2_auth_api_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_auth_api_SIT_ 1 l2_auth_api_SIT:5000 check resolvers docker init-addr libc,none

frontend l2_auth_api_uat
    bind *:7313
    mode  http
    option forwardfor
    default_backend l2_auth_api_nodes_uat

backend l2_auth_api_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_auth_api_UAT_ 1 l2_auth_api_UAT:5000 check resolvers docker init-addr libc,none
