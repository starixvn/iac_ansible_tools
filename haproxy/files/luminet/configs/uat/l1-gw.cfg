backend l1_socket_gateway_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_socket_gateway_UAT_ 2 l1_socket_gateway_UAT:5000 check resolvers docker init-addr libc,none

