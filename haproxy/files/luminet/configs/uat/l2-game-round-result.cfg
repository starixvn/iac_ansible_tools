

frontend l2_game_round_result_sit
    bind *:6315
    mode  http
    option forwardfor
    #acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    #http-request deny if !is-whitelisted-ip
    #default_backend nexops_whoami_api_nodes
    default_backend l2_game_round_result_nodes_sit

backend l2_game_round_result_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_result_SIT_ 1 l2_game_result_SIT:5000 check resolvers docker init-addr none

frontend l2_game_round_result_uat
    bind *:7315
    mode  http
    option forwardfor except 127.0.0.1
    option forwardfor header X-Real-IP
    #acl is-whitelisted-ip hdr_ip(x-forwarded-for,-1) -f /etc/haproxy/whitelisted.ips
    #http-request deny if !is-whitelisted-ip
    #default_backend nexops_whoami_api_nodes
    default_backend l2_game_round_result_nodes_uat

backend l2_game_round_result_nodes_uat
    #option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_result_UAT_ 1 l2_game_result_UAT:5000 check resolvers docker init-addr none
