backend l1_ow_api_simulator_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_ow_api_simulator_SIT 1 l1_ow_api_simulator_SIT:5000 check resolvers docker init-addr none

