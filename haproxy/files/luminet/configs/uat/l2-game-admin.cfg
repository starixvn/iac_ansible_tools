
frontend l2_game_admin_site_sit
    bind *:6311
    mode  http
    option forwardfor
    #acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    #http-request deny if !is-whitelisted-ip
    default_backend l2_game_admin_site_nodes_sit

backend l2_game_admin_site_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_admin_site_SIT_ 1 l2_admin_site_SIT:5000 check resolvers docker init-addr none

