backend l1_game_round_result_nodes_sit
    #acl restricted_network hdr_ip(X-Forwarded-For) -f /etc/haproxy/whitelisted.ips
    #http-request deny if !restricted_network
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_result_SIT_ 1 l1_game_result_SIT:5000 check resolvers docker init-addr none

backend l1_game_round_result_nodes_uat
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_result_UAT_ 1 l1_game_result_UAT:5000 check resolvers docker init-addr none
