backend l1_game_round_result_nodes_sit
    option forwardfor except 127.0.0.1
    acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    http-request deny if !is-whitelisted-ip
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_result_SIT_ 1 l1_game_result_SIT:5000 check resolvers docker init-addr libc,none

backend l1_game_round_result_nodes_uat
    #option forwardfor
    option forwardfor except 127.0.0.1
    acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    http-request deny if !is-whitelisted-ip
    option http-server-close
    option httpchk GET /health
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_result_UAT_ 1 l1_game_result_UAT:5000 check resolvers docker init-addr libc,none
