frontend nexops_sentry_fe
    bind *:9009
    mode  http
    option forwardfor
    default_backend nexops_sentry_nodes

backend nexops_deploymentapi_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    default-server inter 3s fall 2 rise 10
    server-template nexops_deployment_api_ 6 nexops_deployment_api:22222 check resolvers docker init-addr libc,none

backend nexops_sentry_nodes
    option forwardfor
    option http-server-close
    option httpchk GET /account/recover/
    http-check expect status 200
    cookie serverid insert
    server-template nexops_sentry 2 sentry_web_uat:9000 check resolvers docker init-addr libc,none

backend default_backend_nodes
    http-request return status 200 content-type "text/plain"  lf-string "Hello, it's me" #if { path_beg /whoami }
