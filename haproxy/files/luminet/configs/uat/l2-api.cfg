backend l2_api_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_api_SIT_ 2 l2_game_api_SIT:5000 check resolvers docker init-addr libc,none

backend l2_api_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_api_UAT_ 2 l2_game_api_UAT:5000 check resolvers docker init-addr libc,none
