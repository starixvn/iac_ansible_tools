
frontend l1_games_proxy
    bind *:7777
    mode  http
    option forwardfor
    #acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    #http-request deny if !is-whitelisted-ip

    ###### SIT #######
    use_backend l1_game_server_nodes_SIT if { path_beg /sit/main/ }
    use_backend l1_sedie_nodes_SIT if { path_beg /sit/sedie/ }
    use_backend l1_vip_sedie_nodes_SIT if { path_beg /sit/vsedie/ }
    use_backend l1_special_sedie_nodes_SIT if { path_beg /sit/specialsedie/ }
    use_backend l1_blackjack_node_SIT if { path_beg /sit/blackjack/ }
    use_backend l1_vip_fish_prawn_crab_nodes_SIT if { path_beg /sit/vipfishprawncrab/ }
    use_backend l1_sicbo_nodes_SIT if { path_beg /sit/sicbo/ }
    use_backend l1_vip_baccarat_nodes_SIT if { path_beg /sit/vipbaccarat/ }
    use_backend l1_vip_sedie_war_nodes_SIT if { path_beg /sit/vipsediewar/ }
    use_backend l1_turbo_odd_even_nodes_SIT if { path_beg /sit/turbooddeven/ }
    use_backend l1_keno_pro_max_service_nodes_SIT if { path_beg /sit/kenopromax/ }
    use_backend l1_big_small_service_nodes_SIT if { path_beg /sit/bigsmall/ }
    use_backend l1_user_service_nodes_SIT if { path_beg /sit/user/ }
    use_backend l1_mini_sedie_service_nodes_SIT if { path_beg /sit/minisedie/ }
    use_backend l1_turbo_big_small_service_nodes_SIT if { path_beg /sit/turbobigsmall/ }
    use_backend l1_dragon_tiger_service_nodes_SIT if { path_beg /sit/dragontiger/ }
    use_backend l1_baccarat_service_nodes_SIT if { path_beg /sit/baccarat/ }
    use_backend l1_roulette_service_nodes_SIT if { path_beg /sit/roulette/ }
    use_backend l1_fish_prawn_crab_service_nodes_SIT if { path_beg /sit/fishprawncrab/ }
    use_backend l1_four_guardians_nodes_SIT if { path_beg /sit/fourguardians/ }
    use_backend l1_lottery_nodes_SIT if { path_beg /sit/lottery/ }
    use_backend l1_three_cards_nodes_SIT if { path_beg /sit/threecards/ }
    use_backend l1_mini_keno_nodes_SIT if { path_beg /sit/minikeno/ }

    ###### UAT #######
    use_backend l1_game_server_nodes_UAT if { path_beg /uat/main/ }
    use_backend l1_sedie_nodes_UAT if { path_beg /uat/sedie/ }
    use_backend l1_vip_sedie_nodes_UAT if { path_beg /uat/vsedie/ }
    use_backend l1_special_sedie_nodes_UAT if { path_beg /uat/specialsedie/ }
    use_backend l1_blackjack_node_UAT if { path_beg /uat/blackjack/ }
    use_backend l1_vip_fish_prawn_crab_nodes_UAT if { path_beg /uat/vipfishprawncrab/ }
    use_backend l1_sicbo_nodes_UAT if { path_beg /uat/sicbo/ }
    use_backend l1_vip_baccarat_nodes_UAT if { path_beg /uat/vipbaccarat/ }
    use_backend l1_vip_sedie_war_nodes_UAT if { path_beg /uat/vipsediewar/ }
    use_backend l1_turbo_odd_even_nodes_UAT if { path_beg /uat/turbooddeven/ }
    use_backend l1_keno_pro_max_service_nodes_UAT if { path_beg /uat/kenopromax/ }
    use_backend l1_big_small_service_nodes_UAT if { path_beg /uat/bigsmall/ }
    use_backend l1_user_service_nodes_UAT if { path_beg /uat/user/ }
    use_backend l1_mini_sedie_service_nodes_UAT if { path_beg /uat/minisedie/ }
    use_backend l1_turbo_big_small_service_nodes_UAT if { path_beg /uat/turbobigsmall/ }
    use_backend l1_dragon_tiger_service_nodes_UAT if { path_beg /uat/dragontiger/ }
    use_backend l1_baccarat_service_nodes_UAT if { path_beg /uat/baccarat/ }
    use_backend l1_roulette_service_nodes_UAT if { path_beg /uat/roulette/ }
    use_backend l1_fish_prawn_crab_service_nodes_UAT if { path_beg /uat/fishprawncrab/ }
    use_backend l1_four_guardians_nodes_UAT if { path_beg /uat/fourguardians/ }
    use_backend l1_lottery_nodes_UAT if { path_beg /uat/lottery/ }
    use_backend l1_three_cards_nodes_UAT if { path_beg /uat/threecards/ }
    use_backend l1_mini_keno_nodes_UAT if { path_beg /uat/minikeno/ }

backend l1_game_server_nodes_SIT
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/sit/main/,/)]
    server-template l1_game_server_SIT_ 1 l1_game_server_SIT:5000 check resolvers docker init-addr libc,none

