frontend http_in
    bind *:80
    mode  http
    option forwardfor
    option http-keep-alive
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock
    mode  http
    option forwardfor

    ### Tools
    use_backend nexops_deploymentapi_nodes if { hdr(host) -i scdeployapi.starixplay.com }
    use_backend nexops_sentry_nodes if { hdr(host) -i scsentry.sgamesuat.com }
    use_backend default_backend_nodes if { hdr(host) -i haproxy.sgamesuat.com }

    ### L1
    #UAT
    use_backend l1_game_client_nodes_uat if { hdr(host) -i l1uat.sgamesuat.com }
    use_backend l1_api_nodes_uat if { hdr(host) -i l1uatapi.sgamesuat.com }
    use_backend l1_game_admin_site_nodes_uat if { hdr(host) -i l1uatadm.sgamesuat.com }
    use_backend l1_game_round_result_nodes_uat if { hdr(host) -i l1uatresult.sgamesuat.com }
    use_backend default_backend_nodes if { hdr(host) -i l1uatproxy.sgamesuat.com }
    use_backend l1_game_client_mobi_nodes_UAT if { hdr(host) -i l1uatm.sgamesuat.com }
    use_backend l2_game_guides_nodes_uat if { hdr(host) -i l1guidesuat.sgamesuat.com }
    use_backend default_backend_nodes if { hdr(host) -i l1socceruat.sgamesuat.com }
    use_backend l1_instant_game_client_nodes_UAT if { hdr(host) -i l1miniuat.sgamesuat.com }
    use_backend default_backend_nodes if { hdr(host) -i l1gwuat.sgamesuat.com }
    #SIT
    use_backend l1_game_client_nodes_sit if { hdr(host) -i l1sit.sgamesuat.com }
    use_backend l1_api_nodes_sit if { hdr(host) -i l1sitapi.sgamesuat.com }
    use_backend l1_game_admin_site_nodes_sit if { hdr(host) -i l1sitadm.sgamesuat.com }
    use_backend l1_game_round_result_nodes_sit if { hdr(host) -i l1sitresult.sgamesuat.com }
    use_backend l1_game_client_mobi_nodes_SIT if { hdr(host) -i l1sitm.sgamesuat.com }
    use_backend l2_game_guides_nodes_sit if { hdr(host) -i l1guidessit.sgamesuat.com }
    use_backend default_backend_nodes if { hdr(host) -i l1soccersit.sgamesuat.com }
    use_backend l1_instant_game_client_nodes_SIT if { hdr(host) -i l1minisit.sgamesuat.com }
    use_backend default_backend_nodes if { hdr(host) -i l1gwsit.sgamesuat.com }

    #
    use_backend l1_game_client_mobi_nodes_SIT if { hdr(host) -i sitm.sabagame.com }
    use_backend l1_game_client_mobi_nodes_UAT if { hdr(host) -i uatm.sabagame.com }
    use_backend l1_game_guides_nodes_sit if { hdr(host) -i guidessit.sabagame.com }
    use_backend l1_game_guides_nodes_uat if { hdr(host) -i guidesuat.sabagame.com }

    use_backend l1_instant_game_client_nodes_UAT if { hdr(host) -i miniuat.sgamesuat.com }
    use_backend l1_instant_game_client_nodes_SIT if { hdr(host) -i minisit.sgamesuat.com }

    ### L2
    use_backend default_backend_nodes if { hdr(host) -i l2uat.sgamesuat.com }
    use_backend default_backend_nodes if { hdr(host) -i l2uatapi.sgamesuat.com }
