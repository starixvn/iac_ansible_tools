frontend http_in
    bind *:80
    mode  http
    option forwardfor
    acl restricted_network hdr_ip(X-Forwarded-For) -f /etc/haproxy/whitelisted.ips
    http-request deny if !restricted_network

    option http-keep-alive
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    ### Tools
    use_backend nexops_deploymentapi_nodes if { hdr(host) -i scdeployapi.starixplay.com }
    use_backend nexops_sentry_nodes if { hdr(host) -i scsentry.sgamesuat.com }
    use_backend nexops_whoami_api_nodes if { hdr(host) -i l2haproxy.sgamesuat.com }

    ### L1
    # Internal accessing
    use_backend l1_api_nodes_uat if { hdr(host) -i intl1uatapi.sgamesuat.com }
    use_backend l1_game_round_result_nodes_uat if { hdr(host) -i intl1uatresult.sgamesuat.com }
    use_backend l1_api_nodes_sit if { hdr(host) -i intl1sitapi.sgamesuat.com }
    use_backend l1_game_round_result_nodes_sit if { hdr(host) -i intl1sitresult.sgamesuat.com }
    #
    ### L2
    #UAT
    # Internal accessing
    use_backend l2_api_nodes_uat if { hdr(host) -i intl2uatapi.sgamesuat.com }
    use_backend l2_game_round_result_nodes_uat if { hdr(host) -i intl2uatresult.sgamesuat.com }
    use_backend l2_api_nodes_sit if { hdr(host) -i intl2sitapi.sgamesuat.com }
    use_backend l2_game_round_result_nodes_sit if { hdr(host) -i intl2sitresult.sgamesuat.com }
    #

default_backend default_backend_nodes
