frontend http_in
    bind *:80
    mode  http
    option forwardfor
    #option forwardfor except 127.0.0.1
    #option forwardfor header X-Real-IP
    #acl is-whitelisted-ip hdr_ip(x-forwarded-for,-1) -f /etc/haproxy/whitelisted.ips
    #http-request deny if !is-whitelisted-ip

    option http-keep-alive
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    ### Tools
    use_backend nexops_deploymentapi_nodes if { hdr(host) -i scdeployapi.starixplay.com }
    use_backend nexops_sentry_nodes if { hdr(host) -i scsentry.sgamesuat.com }
    use_backend nexops_whoami_api_nodes if { hdr(host) -i haproxy.sgamesuat.com }
    use_backend nexops_whoami_api_nodes if { hdr(host) -i l2haproxy.sgamesuat.com }

