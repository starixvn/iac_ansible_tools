    use_backend default_backend_nodes if { hdr(host) -i l2socceruat.sgamesuat.com }
    #use_backend l2_instant_game_client_nodes_UAT if { hdr(host) -i l2miniuat.sgamesuat.com }
    use_backend default_backend_nodes if { hdr(host) -i l2gwuat.sgamesuat.com }
    use_backend default_backend_nodes if { hdr(host) -i l2sit.sgamesuat.com }
    use_backend default_backend_nodes if { hdr(host) -i l2sitapi.sgamesuat.com }
    use_backend default_backend_nodes if { hdr(host) -i l2sitadm.sgamesuat.com }
    use_backend default_backend_nodes if { hdr(host) -i l2sitresult.sgamesuat.com }
