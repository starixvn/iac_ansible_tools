frontend status-monitor
	bind *:8001
	monitor-uri	/checkstatus
    http-request use-service prometheus-exporter if { path /metrics }
default_backend default_backend_nodes

frontend http_in
    bind *:80
    mode  http
    option forwardfor
    capture request header Host len 30
    capture request header User-Agent len 200
    capture request header Referer len 800
    capture request header X-Forwarded-For len 20
    #acl restricted_network hdr_ip(X-Forwarded-For) -f /etc/haproxy/whitelisted.ips
    #http-request deny if !restricted_network
    option http-keep-alive
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 300s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    ### L1
    use_backend %[path,map_beg(/etc/haproxy/l1-game-proxy.map)] if { hdr(host) -i l1uatproxy.sgamesuat.com }
    use_backend %[path,map_beg(/etc/haproxy/l2-game-proxy.map)] if { hdr(host) -i l2uatproxy.sgamesuat.com }
    use_backend %[req.hdr(host),lower,map_dom(/etc/haproxy/hosts.map)]

default_backend default_backend_nodes
