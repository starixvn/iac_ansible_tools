
backend l1_instant_game_client_nodes_UAT
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_instant_game_client_UAT_ 2 l1_instant_game_client_UAT:80 check resolvers docker init-addr none

