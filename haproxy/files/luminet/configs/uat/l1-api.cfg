
#frontend l1_api_sit
#    bind *:6300
#    mode  http
#    option forwardfor
#    default_backend l1_api_nodes_sit

backend l1_api_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_api_SIT_ 2 l1_game_api_SIT:5000 check resolvers docker init-addr libc,none

