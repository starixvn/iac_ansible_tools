backend l2_game_news_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_news_SIT_ 2 l2_game_news_SIT:5000 check resolvers docker init-addr libc,none

backend l2_game_news_nodes_uat
