    cookie serverid insert
    server-template l1_game_client_UAT_ 1 l1_game_client_UAT:80 check resolvers docker init-addr libc,none

backend l1_game_client_mobi_nodes_SIT
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-response set-header Cache-Control public,max-age=31536000
    server-template l1_game_client_mobi_SIT_ 1 l1_game_client_mobi_SIT:5000 check resolvers docker init-addr libc,none
    
