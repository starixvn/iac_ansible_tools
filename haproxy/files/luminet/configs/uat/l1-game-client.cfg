
frontend l1_game_client_sit
    bind *:6100
    mode  http
    option forwardfor
    acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    http-request deny if !is-whitelisted-ip
    default_backend l1_game_client_nodes_sit

backend l1_game_client_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_client_SIT_ 2 l1_game_client_SIT:80 check resolvers docker init-addr libc,none

frontend l1_game_client_uat
    bind *:7100
    mode  http
    option forwardfor
    acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    http-request deny if !is-whitelisted-ip
    default_backend l1_game_client_nodes_uat

backend l1_game_client_nodes_uat
