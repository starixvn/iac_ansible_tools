version: '3.5'

services:
  agent:
    image: haproxytech/haproxy-debian:2.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - {{portainer_network_name}}
    environment:
      AGENT_SECRET: {{portainer_agent_secret}}
    deploy:
      mode: global
      placement:
        constraints: [node.platform.os == linux]

  portainer:
    image: portainer/portainer-ce
    command: "-H tcp://tasks.agent:9001 --tlsskipverify"
    ports:
      - "{{portainer_admin_port}}:{{portainer_admin_port}}"
      - "{{portainer_tunnel_port}}:{{portainer_tunnel_port}}"
    volumes:
      - {{portainer_volume_name}}:/data
    networks:
      - {{portainer_network_name}}
    environment:
      AGENT_SECRET: {{portainer_agent_secret}}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]

networks:
  {{portainer_network_name}}:
    driver: overlay
    attachable: true
    name: {{portainer_network_name}}

volumes:
  {{portainer_volume_name}}:
    #driver: glusterfs
    #name: "gfs/{{portainer_gfs_subdir}}"