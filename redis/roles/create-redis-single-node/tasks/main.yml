---
- name: Verify stacks directory exists (on first swarm node)
  when: inventory_hostname in groups['swarm_managers']
  file:
    path: '{{gluster_path}}/redis/stack'
    state: directory

- name: Create directory
  file:
    path: '{{gluster_path}}/redis'
    mode: '0755'
    state: directory
  become: yes

- name: Create network
  docker_network:
    name: '{{swarm_network_nexops}}'
    driver: 'overlay'
    attachable: true
  ignore_errors: yes
  become: yes

- name: Copy docker-compose file
  when: inventory_hostname in groups['swarm_managers']
  template:
    src: 'templates/docker-compose.yml.j2'
    dest: '{{gluster_path}}/redis/stack/redis-stack.yml'
  become: yes

- name: Build up and run container
  when: inventory_hostname in groups['swarm_managers']
  shell: |
    cd {{gluster_path}}/redis/stack
    docker stack deploy --compose-file=redis-stack.yml redis  --with-registry-auth
  become: yes
