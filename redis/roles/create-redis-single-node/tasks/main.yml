---
- name: Verify stacks directory exists (on first swarm node)
  when: inventory_hostname in groups['swarm_managers']
  file:
    path: '{{gluster_path}}'
    mode: '0755'
    state: directory

- name: Verify stacks directory exists (on first swarm node)
  when: inventory_hostname in groups['swarm_managers']
  file:
    path: '{{gluster_path}}/{{item}}'
    mode: '0777'
    state: directory
  with_items:
    - data
    - logs

- name: Create network
  docker_network:
    name: '{{swarm_network_nexops}}'
    driver: 'overlay'
    attachable: true
  ignore_errors: yes
  become: yes

- name: Copy docker-compose file
  when: inventory_hostname in groups['swarm_managers']
  template:
    src: "templates/{{item}}.j2"
    dest: "{{gluster_path}}/{{item}}"
  become: yes
  with_items:
    - docker-compose.yml
    - redis.conf

- name: Build up and run container
  when: inventory_hostname in groups['swarm_managers']
  shell: |
    cd {{gluster_path}}
    docker stack deploy -c docker-compose.yml {{stack_name}} --with-registry-auth
  become: yes
