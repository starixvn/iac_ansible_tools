##/etc/sysctl.d/99-redis.conf ->sudo service procps start
vm.overcommit_memory = 1   # always overcommit
vm.swappiness=0            # turn off swapping
fs.file-max = 500000       # set maximum number of file-handles that the kernel will allocate
net.netfilter.nf_conntrack_max = 131072
# default is 65536 => 131072 = 65536 * 2
# size of connection tracking table
# = nf_conntrack_buckets * 4
# = MAX(RAM in bytes /16384, 65536) * 4
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
# reduce timeout from 120 (default) to 30
net.core.netdev_max_backlog = 400000
# Maximum number  of  packets,  queued  on  the  INPUT  side,
# when the interface receives packets faster than kernel can process them
# The default value is 1000 frames
net.core.optmem_max = 10000000
# Maximum ancillary buffer size allowed per socket.
# Ancillary data is a sequence of struct cmsghdr 
# structures with appended data
net.core.rmem_default = 10000000
# The default setting of the socket receive buffer in bytes.
net.core.rmem_max = 10000000
# The maximum receive socket buffer size in bytes.
net.core.somaxconn = 65536
# Maximum socket connections
net.core.wmem_default = 10000000
# The default setting (in bytes) of the socket send buffer.
net.core.wmem_max = 10000000
# The maximum send socket buffer size in bytes.
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# 0 - No source validation.
# 1 - Strict mode as defined in RFC3704 Strict Reverse Path
#     Each incoming packet is tested against the FIB and if the interface
#     is not the best reverse path the packet check will fail.
#     By default failed packets are discarded.
# 2 - Loose mode as defined in RFC3704 Loose Reverse Path
#     Each incoming packet's source address is also tested against the FIB
#     and if the source address is not reachable via any inter
#     the packet check will fail.
net.ipv4.netfilter.ip_conntrack_generic_timeout = 120
net.ipv4.netfilter.ip_conntrack_tcp_timeout_established = 54000
# 54000s = 15hr
# default is 432000s = 5 days
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_ecn = 0
net.ipv4.tcp_max_syn_backlog = 65536
# Maximal number of remembered connection requests, which have not
# received an acknowledgment from connecting client.
# The minimal value is 128 for low memory machines, and it will
# increase in proportion to the memory of machine.
# If server suffers from overload, try increasing this number.
net.ipv4.tcp_max_tw_buckets = 2000000
# Maximal number of timewait sockets held by system simultaneously.
# If this number is exceeded time-wait socket is immediately destroyed
# and warning is printed. This limit exists only to prevent
# simple DoS attacks, you _must_ not lower the limit artificially,
# but rather increase it (probably, after increasing installed memory),
# if network conditions require more than default value.
net.ipv4.tcp_mem = 30000000 30000000 30000000
# vector of 3 INTEGERs: min, pressure, max
# -   min: below this number of pages TCP is not bothered about its
#          memory appetite.
# -   pressure: when amount of memory allocated by TCP exceeds this number
#               of pages, TCP moderates its memory consumption and enters
#               memory pressure mode, which is exited when memory 
#               consumption falls under "min".
# -   max: number of pages allowed for queueing by all TCP sockets.
# Defaults are calculated at boot time from amount of available
# memory.
net.ipv4.tcp_rmem = 30000000 30000000 30000000
# vector of 3 INTEGERs: min, default, max
# -   min: Minimal size of receive buffer used by TCP sockets.
#          It is guaranteed to each TCP socket, even under moderate memory
#          pressure. Default: 1 page
# -   default: initial size of receive buffer used by TCP sockets.
#              This value overrides net.core.rmem_default used by other
#              protocols. Default: 87380 bytes. This value results in window 
#              of 65535 with default setting of tcp_adv_win_scale and
#              tcp_app_win:0 and a bit less for default tcp_app_win.
# -   max: maximal size of receive buffer allowed for automatically
#          selected receiver buffers for TCP socket. This value does not
#          override net.core.rmem_max.  Calling setsockopt() with SO_RCVBUF
#          disables automatic tuning of that socket's receive buffer size,
#          in which case this value is ignored. Default: between 87380B and
#          6MB, depending on RAM size.
net.ipv4.tcp_sack = 1 # Enable select acknowledgments (SACKS).
net.ipv4.tcp_syncookies = 0
net.ipv4.tcp_timestamps = 1 # Enable timestamps as defined in RFC1323.
net.ipv4.tcp_wmem = 30000000 30000000 30000000
net.ipv4.tcp_tw_reuse = 1