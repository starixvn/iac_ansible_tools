---
- name: Check if keepalived has already been installed
  stat:
    path: /etc/_keepalived_installed
  register: "_keepalived_installed"
  become: yes

- name: Copy keepalived setup file
  copy:
    src: files/keepalived-2.0.20.tar.gz
    dest: "/tmp/keepalived.tar.gz"
  register: keepalived_source
  when:
    - not _keepalived_installed.stat.exists
  become: yes

- name: Unpack keepalived
  unarchive:
    copy: no
    dest: /tmp/
    src: "{{ keepalived_source.dest }}"
  when:
    - not _keepalived_installed.stat.exists
    - keepalived_source.changed
  register: keepalived_source_unpack
  become: yes

- name: Configure keepalived source
  command: "./configure"
  args:
    chdir: "{{ keepalived_install_dir }}"
  when:
    - not _keepalived_installed.stat.exists
    - keepalived_source_unpack.changed
  register: keepalived_configure
  become: yes

- name: Install keepalived
  shell: make && make install
  args:
    chdir: "{{ keepalived_install_dir }}"
  when:
    - not _keepalived_installed.stat.exists
    - keepalived_configure.changed
  become: yes

- name: Set keepalived variables for standby servers
  set_fact:
    keepalive_role: "BACKUP"
    keepalive_priority: "100"
  when: inventory_hostname != groups['swarm_leader'][0]
  become: yes

- name: Set keepalived variables for master server
  set_fact:
    keepalive_role: "MASTER"
    keepalive_priority: "110"
  when: inventory_hostname == groups['swarm_leader'][0]
  become: yes

- name: Create config directory
  file:
    path: /etc/keepalived
    state: directory
  become: yes

- name: Create keepalived conf file
  template:
    src: "{{item}}.j2"
    dest: "{{ keepalived_conf_path }}/{{item}}"
  notify: Restart keepalived
  become: yes
  with_items: 
    - keepalived.conf
    - keepalived_notify.sh

- name: file permission keepalived_notify.sh
  shell: chmod +x {{ keepalived_conf_path }}/keepalived_notify.sh
  become: yes

- name: Install keepalived service
  template:
    src: keepalived.service.j2
    dest: /lib/systemd/system/keepalived.service
  notify: Restart keepalived
  become: yes

- name: Start keepalived
  service:
    name: keepalived
    state: started
    enabled: yes
  become: yes

- name: Mark keepalived as installed
  file:
    path: /etc/_keepalived_installed
    state: touch
  become: yes