---
- name: Check if Service Exists
  stat: path=/etc/init.d/{{service_name}}
  register: service_status
  become: yes

- name: Install necessary apt package
  apt:
    name: libssl-dev
  become: yes

- name: Copy keepalived setup file
  copy:
    src: files/keepalived-2.0.20.tar.gz
    dest: '/tmp/keepalived.tar.gz'
  register: keepalived_source
  # when:
  #   - not service_status.stat.exists
  become: yes

- name: Unpack keepalived
  unarchive:
    copy: no
    dest: /tmp/
    src: '{{ keepalived_source.dest }}'
  # when:
  #   - not service_status.stat.exists or keepalived_source.changed
  register: keepalived_source_unpack
  become: yes

- name: Configure keepalived
  command: './configure'
  args:
    chdir: '{{ keepalived_install_dir }}'
  # when:
  #   - not service_status.stat.exists or keepalived_source_unpack.changed
  register: keepalived_configure
  become: yes

- name: Install keepalived
  shell: make && make install
  args:
    chdir: '{{ keepalived_install_dir }}'
  # when:
  #   - not service_status.stat.exists or keepalived_configure.changed
  become: yes

- name: Set keepalived variables for backup servers
  set_fact:
    keepalive_role: 'BACKUP'
    keepalive_priority: '100'
  when: inventory_hostname != groups['swarm_leader'][0]
  become: yes

- name: Set keepalived variables for master server
  set_fact:
    keepalive_role: 'MASTER'
    keepalive_priority: '110'
  when: inventory_hostname == groups['swarm_leader'][0]
  become: yes

- name: Create config directory
  file:
    path: '{{ keepalived_conf_dir }}'
    state: directory
  become: yes

- name: Create keepalived config file
  template:
    src: '{{item}}.j2'
    dest: '{{ keepalived_conf_dir }}/{{item}}'
  notify: Restart keepalived
  become: yes
  with_items:
    - keepalived.conf
    - keepalived_notify.sh

- name: Set permission keepalived_notify.sh
  shell: chmod +x {{ keepalived_conf_dir }}/keepalived_notify.sh
  become: yes

- name: Install keepalived service
  template:
    src: keepalived.service.j2
    dest: /lib/systemd/system/keepalived.service
  notify: Restart keepalived
  become: yes

- name: Start keepalived
  service:
    name: keepalived
    state: started
    enabled: yes
  become: yes
